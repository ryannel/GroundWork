name: CI

# The required gates, split into jobs that run CONCURRENTLY. `./dev ci` locally
# still runs all of them end to end and remains the single reproduction command;
# this file just stops the runner doing sequentially what it can do at once.
#
# The split is by toolchain, which is also the setup cost: `lint` and `cli` need
# only Node + Python, `generation` adds the built generators, `compilation` is the
# only job that pays for Go, uv and pnpm. Before the split every job paid for
# every toolchain and then ran the lanes one after another.
#
# The heavyweight real-stack boot lives in integration.yml (nightly/manual).

on:
  pull_request:
    branches: [legacy]
  push:
    branches: [legacy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/lint_skills.py
      - run: bash scripts/check_sim_invariants.sh
      - run: python3 scripts/check_sync_anchors.py

  cli:
    name: CLI + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: ./dev test cli-ci

  generation:
    name: Generation matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: ./dev test generation-ci

  compilation:
    name: Compile lane (go + uv + pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: ./dev test compilation-ci
