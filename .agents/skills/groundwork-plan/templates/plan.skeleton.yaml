  date: '2026-10-01' # TODO: today, quoted
  status: draft # draft | review | approved
  authors: ['TODO: team names']
  appetite: 'TODO: 4 weeks · 2 milestones'
  repos: ['TODO-org/TODO-repo'] # repos the work lands in

