id: thrum-render
name: thrum-render
kind: module
form: library
tech: Rust 2024
home: thrum-render
depth: module-boundary
does: Portable wgpu GPU execution foundation — retained render-graph compiler, bounded frame runtime, pass contribution ABI, and core atmosphere/sprite/lighting passes.
invariants:
  - Platform owns the single GPU device and queue; feature crates never create a second device or submit independent work.
  - Render graphs compile at setup or configuration/generation changes and reuse retained plans per frame.
  - GPU timestamp resolve/readback runs asynchronously after completion callbacks and never blocks the frame encode/submit path.
