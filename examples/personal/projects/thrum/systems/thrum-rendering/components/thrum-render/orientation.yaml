lifecycle: "Setup: compile frame graph (graph + binding) -> Per-frame: extract -> runtime encode/submit -> present -> async nonblocking timing readback"
zones:
  - id: execution-spine
    name: Execution Spine
    role: core
    summary: Bounded frame runtime, retained compiled render-graph planner, frame extraction, and presentation coordination on the single platform-owned GPU device.
    paths:
      - src/runtime
      - src/graph
      - src/graph_record
      - src/frame.rs
      - src/extract.rs
      - src/present.rs
      - src/pass_key
      - src/shared_gpu.rs
  - id: contracts-abi
    name: Public Contracts & Resource Binding
    role: contract
    summary: Stable cross-crate ABI, render pass contribution interfaces, capability negotiation, bind-group layouts, shader record layouts, and error/config types.
    paths:
      - src/abi.rs
      - src/binding
      - src/capabilities
      - src/contribution
      - src/error.rs
      - src/render_config.rs
      - src/records
      - src/shaders.rs
      - src/shader_constants.rs
  - id: render-features
    name: Rendering Features & Passes
    role: feature
    summary: Domain rendering passes and WGSL shaders — physically based atmosphere/sky, 2D sprites, visibility/culling, lighting, surface wetness, and Apple Silicon tile optimizations.
    paths:
      - src/atmosphere
      - src/sprite
      - src/visibility
      - src/light
      - src/wetness.rs
      - src/apple_tile
  - id: pacing-telemetry
    name: Frame Pacing & Telemetry
    role: infra
    summary: Adaptive frame governor, frame history tracking, and nonblocking GPU timestamp query resolve/readback outside the frame submit path.
    paths:
      - src/governor.rs
      - src/timing
      - src/history.rs
  - id: diagnostic-synthetic
    name: Diagnostic & Test Renderer
    role: diagnostic
    summary: Synthetic lit diagnostic output and internal registry audit hooks — used for conformance and visual regression testing, not production scene rendering.
    paths:
      - src/synthetic
      - src/registry_audit.rs
      - src/test_device.rs
      - src/timestamp_permit.rs
start_here:
  - path: src/lib.rs
    why: Architectural contract (device ownership, graph retention, nonblocking readback rules) and the full public vs. internal module index.
  - path: src/runtime.rs
    why: Main bounded frame runtime orchestrating preparation, encoding, submission, and presentation.
  - path: src/graph.rs
    why: Render graph compilation and retained execution plans reused across frames.
  - path: src/contribution.rs
    why: How downstream feature crates (thrum-sea, thrum-clouds, thrum-water) register passes into the frame graph without owning a GPU device.
traps:
  - title: synthetic/ is diagnostic-only, not the main scene renderer
    detail: Despite being one of the largest modules in the crate (94 files, 34k LOC), synthetic lit output is strictly diagnostic and not a complete clustered/CSM scene renderer.
    cite: thrum:crates/thrum-render/src/lib.rs#L1-10
  - title: Features must never create a GPU device or submit independently
    detail: The platform shell owns the single wgpu device and queue; thrum-render borrows it and coordinates all submissions through its bounded frame runtime.
    cite: thrum:crates/thrum-render/src/lib.rs#L1-6
  - title: Never block on timestamp readback in the frame path
    detail: Timestamp resolve/readback runs as a later host submission after a nonblocking completion callback and must never stall frame encode/submit.
    cite: thrum:crates/thrum-render/src/lib.rs#L5-8
tasks:
  - label: Add or hook a feature render pass
    path: src/contribution
    note: Implement the contribution contract and pass_key registration rather than submitting directly to wgpu::Queue.
  - label: Run renderer unit & integration tests
    command: cargo test -p thrum-render
  - label: Visually verify sky & lighting changes
    command: cargo run -p thrum-lighthouse
    note: Interactive lighthouse scene exercising physically based sky, sun, and camera orbit.
