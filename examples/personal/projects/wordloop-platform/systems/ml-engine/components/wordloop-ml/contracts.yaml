interfaces:
  - id: ml-http
    kind: rest
    known_from: declared-spec
    entries:
      - id: streaming-start
        method: POST
        path: /streaming/start
        summary: Starts a live streaming transcription session.
        cites: [wordloop-platform:specs/ml-openapi.json]
      - id: streaming-audio
        method: POST
        path: /streaming/{session_id}/audio
        summary: Ingests live audio chunk into active streaming session.
        cites: [wordloop-platform:specs/ml-openapi.json]
      - id: voice-match
        method: POST
        path: /voice/match
        summary: Matches speaker voice embeddings against known people.
        cites: [wordloop-platform:specs/ml-openapi.json]
      - id: chat
        method: POST
        path: /chat
        summary: Runs AI chat completion over meeting context.
        cites: [wordloop-platform:specs/ml-openapi.json]
