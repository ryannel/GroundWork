lifecycle: "HTTP / WS / Webhook -> internal/entrypoints/api (Chi + Huma v2) -> internal/core/service -> internal/core/gateway -> internal/provider (Postgres / GCP / wordloop-ml)"
zones:
  - id: entrypoints-cli
    name: Executable Binaries
    role: infra
    summary: Three separate Go binaries — the HTTP/WS API server (cmd/api), the DB migration runner (cmd/migrate), and the OpenAPI spec exporter (cmd/openapi).
    paths:
      - cmd/api
      - cmd/migrate
      - cmd/openapi
  - id: inbound-api
    name: Inbound API & WebSockets
    role: contract
    summary: Chi + Huma v2 route registration, request/response DTOs, Clerk JWT / service-token / Svix webhook middleware, and the /ws live audio endpoint.
    paths:
      - internal/entrypoints
  - id: core-domain
    name: Core Domain & Services
    role: core
    summary: Hexagonal business logic (domain models, gateway interfaces, and services for meetings, transcripts, notes, tasks, people, and AI threads) isolated from transport and infrastructure.
    paths:
      - internal/core
  - id: outbound-providers
    name: Outbound Providers & Adapters
    role: adapter
    summary: Concrete gateway implementations for PostgreSQL (pgx), GCP Pub/Sub & Cloud Storage, WebSocket hub, wordloop-ml HTTP client, and generated database/API code.
    paths:
      - internal/provider
  - id: config-and-db
    name: Config, Schema & Migrations
    role: infra
    summary: Environment variable configuration (internal/config) plus the canonical Postgres schema.sql and manual SQL migration scripts (db/).
    paths:
      - internal/config
      - db
start_here:
  - path: cmd/api/main.go
    why: Full dependency-injection wiring — shows how config, Postgres, GCP providers, core services, and the HTTP router are assembled.
  - path: internal/entrypoints/api/router.go
    why: Single map of every REST route, WebSocket hub mount, auth middleware group, and debug/docs endpoint.
  - path: internal/core/service
    why: Where domain use-cases live; follow any handler from router.go into its corresponding service here.
  - path: db/schema.sql
    why: Canonical PostgreSQL schema backing all core entities and pgvector embeddings.
traps:
  - title: Debug routes are gated by APP_ENV=test
    detail: Endpoints under /debug/** are registered only when appEnv == 'test' and must never be relied on in production.
    cite: wordloop-core:internal/entrypoints/api/router.go#L21-126
  - title: Three binaries, not just an API server
    detail: Schema migrations and OpenAPI spec generation live in separate entrypoints (cmd/migrate and cmd/openapi) rather than running automatically on API startup.
    cite: wordloop-core:cmd/migrate/main.go#L1-30
tasks:
  - label: Add or modify a REST endpoint
    path: internal/entrypoints/api/router.go
    note: Register the Huma v2 route in router.go, implement the handler under internal/entrypoints/api, and put business logic in internal/core/service.
  - label: Update database schema
    path: db/schema.sql
    note: Edit db/schema.sql (and add a manual SQL patch under db/manual if needed), then run cmd/migrate.
  - label: Run the API server locally
    command: go run ./cmd/api
  - label: Run database migrations
    command: go run ./cmd/migrate
  - label: Regenerate OpenAPI spec
    command: go run ./cmd/openapi
  - label: Run Go test suite
    command: go test ./...
