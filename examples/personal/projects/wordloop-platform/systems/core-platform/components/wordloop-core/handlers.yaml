handlers:
  - id: ws-recording
    on: endpoint:wordloop-core/ws-recording
    summary: Receives live audio frames over WebSocket, streams them to wordloop-ml, persists segments, and emits Pub/Sub events.
    cite_base: wordloop-core:internal/entrypoints/api/router.go
    cites: ["#L110-113"]
    steps:
      - id: stream-audio
        say: Forward live audio chunks to ML streaming session
        call: endpoint:wordloop-ml/streaming-audio
      - id: save-meeting
        say: Persist meeting & recording state
        write: schema:wordloop-postgres/meetings
        to: store:wordloop-postgres
      - id: publish-event
        say: Publish recording & transcript lifecycle events
        publish: message:wordloop-pubsub/recording-event
