handlers:
  - id: record-meeting
    on: endpoint:wordloop-core/ws-recording
    summary: Captures browser audio, buffers locally in OPFS during disconnects, and streams frames to wordloop-core.
    steps:
      - id: open-ws
        say: Stream audio over WebSocket to Core
        call: endpoint:wordloop-core/ws-recording
      - id: fetch-meetings
        say: Load meetings list
        call: endpoint:wordloop-core/list-meetings
