<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Checkout Summary — Stock Reservation</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #f8fafc; color: #0f172a; }
    .card { max-width: 520px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .banner { padding: 12px 14px; border-radius: 8px; background: #ecfdf5; border: 1px solid #10b981; color: #065f46; margin: 12px 0; }
    .btn { background: #0f172a; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Checkout Summary</h2>
    <div id="hold-banner" class="banner" data-gw-region="hold-banner" data-gw-schema="schema:orders-api/create-order-response#reserve-until">
      Reserved for you — 47h 59m remaining
    </div>
    <button class="btn" data-gw-action="submit-order" data-gw-endpoint="endpoint:orders-api/create-order">
      Confirm &amp; Continue
    </button>
  </div>
</body>
</html>
