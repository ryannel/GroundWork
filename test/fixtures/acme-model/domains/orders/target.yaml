summary: Every order is paid before [[sys:ordering]] tells anyone about it.
stages:
  - id: order
    name: Order
    term: term:order
    owners:
      - sys:ordering
    summary: Recorded by [[svc:order-api]].
    from: []
  - id: payment
    name: Payment
    owners:
      - sys:payments
    from:
      - order
shifts:
