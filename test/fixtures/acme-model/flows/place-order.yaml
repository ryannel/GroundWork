id: flow:place-order
name: Place an order
actor: Customer
trigger: The customer presses **Place order** on the basket.
outcome: The order is paid for and the customer is emailed.
steps:
  - id: submit
    from: app:shop-web
    to: svc:shop-bff
    via: api:bff-place-order
    action: Send the basket
    screen: scr:basket
  - id: create
    from: svc:shop-bff
    to: svc:order-api
    via: api:orders-create
    action: Create the order
    writes:
      - sch:order
  - id: charge
    from: svc:order-api
    to: svc:payments
    via: api:payments-charge
    action: Take payment
    fails: A declined card leaves the order unpaid and the customer is asked to try again.
  - id: card
    from: svc:payments
    to: ext:card-provider
    via: api:card-charge
    action: Charge the card
  - id: publish
    from: svc:order-api
    to: top:order-events
    via: msg:order-placed
    action: Announce the order
    reads:
      - sch:order
  - id: email
    from: top:order-events
    to: svc:order-mailer
    via: msg:order-placed
    action: Email the confirmation
