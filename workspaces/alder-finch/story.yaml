summary:
  "A **product** is created in the PIM and passed on: Content translates it, Pricing prices it, Search
  indexes it, and the storefront shows it, through its BFF and through **the graph**, where each team adds its
  part of the product by a **key**. Fulfilment works out a **delivery promise** per SKU and region. A **cart**
  becomes an **order** at checkout, paid by card or by a financing partner. While the shopper pays, the
  **checkout session** holds a **reservation** per line in one warehouse; capture turns it into the line's
  **allocation**, the warehouse ships it and a carrier delivers it. Billing makes the invoice, and the
  Notifier tells the shopper what happened."
concepts:
  - id: con:product
    origin: seeded
    name: Product
    terms:
      - product
      - SKU
      - item
      - article
    means:
      'Something we sell: one SKU with its attributes, translations and images. Created in the PIM; every
      other system keeps a copy.'
    born_in: svc:pim
    aka:
      - in: svc:pim
        as: Product
        at: sch:product
      - in: svc:catalog-api
        as: CatalogProduct
        at: sch:catalog-product
        note: Read copy per locale.
      - in: svc:translation-hub
        as: ProductTranslation
        at: sch:product-translation
        note: One row per product and locale.
      - in: svc:pricing
        as: Price
        at: sch:price
        note: Pricing only knows the SKU and its price points.
      - in: svc:search-indexer
        as: SearchDocument
        at: sch:search-document
      - in: svc:storefront-bff
        as: ProductView
        at: sch:product-view
      - in: svc:wms
        as: StockLevel
        at: sch:stock-level
        note: The warehouse knows the SKU as a stock position per FC.
  - id: con:fulfilment-centre
    origin: seeded
    name: Fulfilment centre
    terms:
      - fulfilment centre
      - warehouse
      - FC
    means: One of the three warehouses. Each has its own stock, its own cutoffs and its own carriers.
    born_in: svc:wms
  - id: con:region
    origin: seeded
    name: Region
    terms:
      - region
      - delivery region
    means:
      'The area a price and a promise are given for. ProductPromise takes it as a variable, which puts it in
      the edge key: six regions are six cached copies, not a private response.'
    born_in: svc:customer-graph
  - id: con:delivery-promise
    origin: seeded
    name: Delivery promise
    terms:
      - promise
      - delivery promise
      - delivery date
      - promised date
    means:
      The date a product arrives in a region if ordered before the cutoff, from stock, cutoffs and carrier
      lead times. Created in Fulfilment, copied to everything the shopper looks at.
    born_in: svc:promise
    relates:
      - to: con:product
        as: is for one
      - to: con:region
        as: holds for one
      - to: con:fulfilment-centre
        as: assumes shipping from one
    aka:
      - in: svc:promise
        as: DeliveryPromise
        at: sch:delivery-promise
  - id: con:cart
    origin: seeded
    name: Cart
    terms:
      - cart
      - basket
      - mini cart
    means:
      What a shopper has picked. Owned by the cart subgraph and reached through the signed-in customer; its
      lines reference products by `sku`.
    born_in: svc:cart-graph
    relates:
      - to: con:product
        as: holds many
    aka:
      - in: svc:cart-graph
        as: Cart
        at: sch:gql-cart
      - in: svc:cart-graph
        as: Cart
        at: sch:cart
        note: The Redis record behind the type.
  - id: con:order
    origin: seeded
    name: Order
    terms:
      - order
    means:
      What the shopper bought, paid and expects. Created by Order capture at the end of checkout; followed by
      the OMS to delivery.
    born_in: svc:order-capture
    relates:
      - to: con:cart
        as: is made from one
    aka:
      - in: svc:order-capture
        as: Order
        at: sch:order
      - in: svc:oms
        as: Order
        at: sch:order
        note: Same table; the OMS owns the status after capture.
      - in: svc:financing-gateway
        as: FinancingQuote
        at: sch:financing-quote
        note: The partner knows the order as a loan.
  - id: con:order-line
    origin: seeded
    name: Order line
    terms:
      - order line
      - line
    means: One product and quantity in an order. Fulfilment allocates and ships it; the promise lives on it.
    part_of: con:order
    relates:
      - to: con:product
        as: is for one
      - to: con:delivery-promise
        as: carries one
    aka:
      - in: svc:order-capture
        as: OrderLine
        at: sch:order-line
      - in: svc:wms
        as: ShipmentLine
        at: sch:shipment
        note: Grouped into shipments per FC.
  - id: con:shipment
    origin: seeded
    name: Shipment
    terms:
      - shipment
      - parcel
      - consignment
    means: The order lines one warehouse ships together, booked with one carrier.
    born_in: svc:wms
    relates:
      - to: con:order
        as: fulfils part of one
      - to: con:fulfilment-centre
        as: leaves from one
  - id: con:reservation
    origin: seeded
    name: Reservation
    terms:
      - reservation
      - hold
      - stock hold
    means: A quantity of one SKU held in one warehouse for one checkout session until an expiry.
    born_in: svc:wms
    relates:
      - to: con:stock-level
        as: reduces the available part of
    aka:
      - in: svc:wms
        as: Reservation
        at: sch:reservation
      - in: svc:checkout
        as: reservation_ids
        at: sch:checkout-session#reservation_ids
  - id: con:stock-level
    origin: seeded
    name: Stock level
    terms:
      - stock
      - stock level
      - availability
      - on hand
    means: 'What a warehouse has of a SKU: on hand, and available after reservations.'
    born_in: svc:wms
    aka:
      - in: svc:wms
        as: StockLevel
        at: sch:stock-level
stages:
  - id: stage:create
    origin: seeded
    name: Create
    summary: A product is created, enriched, translated and given its reviews.
    services:
      - svc: svc:pim-admin
      - svc: svc:pim
      - svc: svc:enrichment
      - svc: svc:catalog-api
        from:
          - svc:pim
      - svc: svc:product-graph
        from:
          - svc:pim
      - svc: svc:translation-hub
        from:
          - svc:pim
      - svc: svc:translation-vendor
      - svc: svc:reviews-graph
    flows:
      - flow:create-product
  - id: stage:price
    origin: seeded
    name: Price
    summary: Each product gets a price per country.
    services:
      - svc: svc:price-rules-admin
      - svc: svc:pricing
        from:
          - svc:pim
      - svc: svc:pricing-graph
        from:
          - svc:pricing
    flows:
      - flow:price-product
  - id: stage:discover
    origin: seeded
    name: Discover
    summary: Products are indexed and shown, through the BFF and through the graph.
    services:
      - svc: svc:search-indexer
        from:
          - svc:pim
          - svc:pricing
          - svc:wms
      - svc: svc:search-api
      - svc: svc:search-graph
        from:
          - svc:search-api
      - svc: svc:graph-gateway
      - svc: svc:cache-purger
        from:
          - svc:pricing
          - svc:wms
          - svc:pim
      - svc: svc:fastly
      - svc: svc:storefront-web
      - svc: svc:storefront-bff
        from:
          - svc:catalog-api
          - svc:pricing
          - svc:search-api
          - svc:storefront-web
      - svc: svc:customer-graph
    flows:
      - flow:index-product
      - flow:browse-product
      - flow:search-results
      - flow:view-cart
      - flow:price-change-purge
      - flow:project-product
  - id: stage:buy
    origin: seeded
    name: Buy
    summary: Cart, checkout, stock held while the shopper pays, financing and payment.
    services:
      - svc: svc:cart
        from:
          - svc:storefront-bff
      - svc: svc:checkout
        from:
          - svc:cart
          - svc:storefront-bff
      - svc: svc:cart-graph
      - svc: svc:financing-gateway
        from:
          - svc:checkout
      - svc: svc:paylater-partner
      - svc: svc:instalments-bank
      - svc: svc:payments
        from:
          - svc:checkout
      - svc: svc:psp
    flows:
      - flow:add-to-cart
      - flow:checkout
      - flow:checkout-address
      - flow:reserve
  - id: stage:capture
    origin: seeded
    name: Capture
    summary: The order exists and is followed.
    services:
      - svc: svc:order-capture
        from:
          - svc:checkout
      - svc: svc:oms
        from:
          - svc:order-capture
  - id: stage:fulfil
    origin: seeded
    name: Fulfil
    summary: Stock is held and allocated, a warehouse ships it and a carrier delivers it.
    services:
      - svc: svc:allocation
        from:
          - svc:order-capture
      - svc: svc:wms
        from:
          - svc:checkout
          - svc:order-capture
      - svc: svc:carrier-gateway
      - svc: svc:carrier
      - svc: svc:inventory-graph
        from:
          - svc:wms
      - svc: svc:promise
      - svc: svc:reservation-sweep
    flows:
      - flow:fulfil-order
      - flow:sync-stock
      - flow:allocate
  - id: stage:bill
    origin: seeded
    name: Bill
    summary: The invoice is made and sent.
    services:
      - svc: svc:billing
        from:
          - svc:order-capture
    flows:
      - flow:issue-invoice
  - id: stage:tell
    origin: seeded
    name: Tell
    summary: The shopper hears what happened and can look it up.
    services:
      - svc: svc:notifier
        from:
          - svc:order-capture
          - svc:wms
          - svc:billing
    flows:
      - flow:track-order
