summary:
  "A **product** is created in the PIM and passed on: Content translates it, Pricing prices it, Search indexes
  it, and the storefront shows it, through its BFF and through **the graph**, where each team adds its part of the
  product by a **key**. Fulfilment works out a **delivery promise** per SKU and region. A **cart** becomes an **order**
  at checkout, paid by card or by a financing partner. While the shopper pays, the **checkout session** holds a
  **reservation** per line in one warehouse; capture turns it into the line's **allocation**, the warehouse ships it and
  a carrier delivers it. Billing makes the invoice, and the Notifier tells the shopper what happened."
stages:
  - id: stage:create
    origin: seeded
    name: Create
    summary: A product is created, enriched, translated and given its reviews.
    services:
      - svc: svc:pim-admin
      - svc: svc:pim
      - svc: svc:enrichment
      - svc: svc:catalog-api
        from:
          - svc:pim
      - svc: svc:product-graph
        from:
          - svc:pim
      - svc: svc:translation-hub
        from:
          - svc:pim
      - svc: svc:translation-vendor
      - svc: svc:reviews-graph
    flows:
      - flow:create-product
  - id: stage:price
    origin: seeded
    name: Price
    summary: Each product gets a price per country.
    services:
      - svc: svc:price-rules-admin
      - svc: svc:pricing
        from:
          - svc:pim
      - svc: svc:pricing-graph
        from:
          - svc:pricing
    flows:
      - flow:price-product
  - id: stage:discover
    origin: seeded
    name: Discover
    summary: Products are indexed and shown, through the BFF and through the graph.
    services:
      - svc: svc:search-indexer
        from:
          - svc:pim
          - svc:pricing
          - svc:wms
      - svc: svc:search-api
      - svc: svc:search-graph
        from:
          - svc:search-api
      - svc: svc:graph-gateway
      - svc: svc:cache-purger
        from:
          - svc:pricing
          - svc:wms
          - svc:pim
      - svc: svc:fastly
      - svc: svc:storefront-web
      - svc: svc:storefront-bff
        from:
          - svc:catalog-api
          - svc:pricing
          - svc:search-api
          - svc:storefront-web
      - svc: svc:customer-graph
    flows:
      - flow:index-product
      - flow:browse-product
      - flow:search-results
      - flow:view-cart
      - flow:price-change-purge
      - flow:project-product
  - id: stage:buy
    origin: seeded
    name: Buy
    summary: Cart, checkout, stock held while the shopper pays, financing and payment.
    services:
      - svc: svc:cart
        from:
          - svc:storefront-bff
      - svc: svc:checkout
        from:
          - svc:cart
          - svc:storefront-bff
      - svc: svc:cart-graph
      - svc: svc:financing-gateway
        from:
          - svc:checkout
      - svc: svc:paylater-partner
      - svc: svc:instalments-bank
      - svc: svc:payments
        from:
          - svc:checkout
      - svc: svc:psp
    flows:
      - flow:add-to-cart
      - flow:checkout
      - flow:checkout-address
      - flow:reserve
  - id: stage:capture
    origin: seeded
    name: Capture
    summary: The order exists and is followed.
    services:
      - svc: svc:order-capture
        from:
          - svc:checkout
      - svc: svc:oms
        from:
          - svc:order-capture
  - id: stage:fulfil
    origin: seeded
    name: Fulfil
    summary: Stock is held and allocated, a warehouse ships it and a carrier delivers it.
    services:
      - svc: svc:allocation
        from:
          - svc:order-capture
      - svc: svc:wms
        from:
          - svc:checkout
          - svc:order-capture
      - svc: svc:carrier-gateway
      - svc: svc:carrier
      - svc: svc:inventory-graph
        from:
          - svc:wms
      - svc: svc:promise
      - svc: svc:reservation-sweep
    flows:
      - flow:fulfil-order
      - flow:sync-stock
      - flow:allocate
  - id: stage:bill
    origin: seeded
    name: Bill
    summary: The invoice is made and sent.
    services:
      - svc: svc:billing
        from:
          - svc:order-capture
    flows:
      - flow:issue-invoice
  - id: stage:tell
    origin: seeded
    name: Tell
    summary: The shopper hears what happened and can look it up.
    services:
      - svc: svc:notifier
        from:
          - svc:order-capture
          - svc:wms
          - svc:billing
    flows:
      - flow:track-order
