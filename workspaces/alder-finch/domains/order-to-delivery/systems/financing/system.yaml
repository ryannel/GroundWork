id: financing
name: Financing
team: team:financing
repos:
  - alder-finch/financing-gateway
components:
  - id: svc:financing-gateway
    name: Financing gateway
    type: service
    tech: Java · Quarkus
    does: Gets instalment quotes from partners and confirms the loan
    talks_to:
      - to: svc:paylater-partner
        via: api
  - id: svc:paylater-partner
    name: Nordbank PayLater
    type: external
    tech: Partner REST API
    does: Pay in 3 and pay in 30 days for DE, NL, SE
  - id: svc:instalments-bank
    name: Fjordbank instalments
    type: external
    tech: Partner REST API
    does: 6 to 24 month instalments above 500
  - id: st:financing-db
    name: financing-db
    type: database
    tech: Postgres 15
    does: Quotes and loans per order
