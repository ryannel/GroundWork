components:
  - id: svc:payments
    origin: seeded
    sources:
      - repo: alder-finch/payments
        path: src/main/java/payments/PaymentsResource.java
        commit: 1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f
        lines: [18, 96]
stores:
  - id: st:payments-db
    origin: seeded
    name: payments-db
    kind: database
    tech: Postgres 15
    owner: svc:payments
    does: Authorisations and captures
interfaces:
  - id: if:payments-rest
    origin: seeded
    service: svc:payments
    protocol: rest
    endpoints:
      - id: api:payments-authorise
        sig: POST /payments
        request: sch:payment
        response: sch:payment
        auth: service token
        idempotent: true
      - id: api:payments-capture
        sig: POST /payments/{id}/capture
        response: sch:payment
        auth: service token
        idempotent: true
  - id: if:psp-api
    origin: seeded
    service: svc:psp
    protocol: rest
    endpoints:
      - id: api:psp-authorise
        sig: POST /v1/authorisations
        auth: API key
        idempotent: true
schemas:
  - id: sch:payment
    origin: seeded
    name: Payment
    kind: record
    store: st:payments-db
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: order_id
        type: uuid
        ref: sch:order#id
      - name: amount_cents
        type: int
        required: true
      - name: status
        type: enum(authorised, captured, refunded)
        required: true
      - name: psp_ref
        type: string
        required: true
        unique: true
