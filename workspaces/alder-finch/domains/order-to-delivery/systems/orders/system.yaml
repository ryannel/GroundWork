id: orders
name: Orders
team: team:orders
repos:
  - alder-finch/orders
components:
  - id: svc:order-capture
    name: Order capture
    type: service
    tech: Kotlin · Spring Boot
    does: Records the order and announces it
    talks_to:
      - to: st:order-events
        via: message
  - id: svc:oms
    name: Order management
    type: service
    tech: Kotlin · Spring Boot
    does: Follows each order from captured to delivered
  - id: st:orders-db
    name: orders-db
    type: database
    tech: Postgres 16
    does: Orders and their lines; shared with the OMS
  - id: st:order-events
    name: orders.events
    type: queue
    tech: Kafka
    does: order.placed, order.updated
    talks_to:
      - to: svc:notifier
        via: message
      - to: svc:allocation
        via: message
      - to: svc:oms
        via: message
      - to: svc:financing-gateway
        via: message
      - to: svc:billing
        via: message
