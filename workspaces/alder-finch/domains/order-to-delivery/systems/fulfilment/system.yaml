id: fulfilment
name: Fulfilment
team: team:fulfilment
repos:
  - alder-finch/fulfilment
components:
  - id: svc:allocation
    name: Allocation worker
    type: job
    tech: Python · Kafka consumer
    does: Picks the warehouse that ships each order line
    talks_to:
      - to: svc:wms
        via: api
      - to: svc:oms
        via: api
  - id: svc:wms
    name: WMS
    type: service
    tech: Manhattan Active · our integration layer
    does: Stock, picking and shipping in the three warehouses
    talks_to:
      - to: svc:carrier-gateway
        via: api
      - to: st:fulfilment-events
        via: message
  - id: svc:carrier-gateway
    name: Carrier gateway
    type: service
    tech: Python · FastAPI
    does: Books parcels and reads tracking from the carriers
    talks_to:
      - to: svc:carrier
        via: api
  - id: svc:carrier
    name: NordExpress
    type: external
    tech: Carrier API
    does: Delivers parcels in all four countries
  - id: svc:inventory-graph
    name: Inventory graph service
    type: service
    tech: Python · Strawberry
    does: Adds stock to Product from a Redis snapshot
  - id: svc:promise
    name: Promise
    type: service
    tech: Python · FastAPI · Kafka consumer
    does: Computes and publishes the delivery promise per SKU and region
    talks_to:
      - to: st:fulfilment-events
        via: message
  - id: st:wms-db
    name: wms-db
    type: database
    tech: Manhattan · Oracle
    does: Stock, shipments, waves per FC
  - id: st:fulfilment-events
    name: fulfilment.events
    type: queue
    tech: Kafka
    does: stock.changed, shipment.dispatched
    talks_to:
      - to: svc:search-indexer
        via: message
      - to: svc:storefront-bff
        via: message
      - to: svc:notifier
        via: message
      - to: svc:oms
        via: message
      - to: svc:inventory-graph
        via: message
      - to: svc:cache-purger
        via: message
      - to: svc:promise
        via: message
      - to: svc:pim
        via: message
  - id: st:stock-redis
    name: stock snapshot
    type: database
    tech: Redis 7
    does: One stock snapshot per sku, written from stock.changed
  - id: st:promise-db
    name: promise-db
    type: database
    tech: Postgres 15
    does: Promises, cutoffs and lead times
  - id: svc:reservation-sweep
    name: Reservation sweep
    type: job
    tech: Python · cron every minute
    does: Releases reservations past their expiry
    talks_to:
      - to: st:wms-db
        via: data
