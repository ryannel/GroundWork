components:
  - id: svc:allocation
    origin: seeded
    summary:
      Consumes `order.placed`, chooses an FC per line by stock and distance, and creates the shipments in
      the WMS.
    sources:
      - repo: alder-finch/fulfilment
        path: allocation/allocate.py
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [40, 210]
  - id: svc:wms
    origin: seeded
    summary:
      Our layer over Manhattan. Exposes stock, shipments and reservations; availability subtracts held
      reservations. Manhattan itself is not changed.
    sources:
      - repo: alder-finch/fulfilment
        path: wms/api/routes.py
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [1, 80]
  - id: svc:carrier-gateway
    origin: seeded
    summary: One adapter per carrier. Holds the lead-time tables each carrier publishes, updated by hand each quarter.
    sources:
      - repo: alder-finch/fulfilment
        path: carriers/leadtimes.csv
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [1, 30]
        note: the hand-kept lead-time table
  - id: svc:inventory-graph
    origin: seeded
    summary:
      Extends `Product` with `stock`. Keeps one snapshot per SKU in Redis, written from `stock.changed`;
      never calls the WMS on the request path.
    sources:
      - repo: alder-finch/fulfilment
        path: inventory-subgraph/app/schema.py
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [1, 60]
  - id: svc:promise
    origin: seeded
    summary:
      Holds one promise per SKU and region in [[st:promise-db]], serves [[api:promise-get]], publishes
      `promise.changed` when a date moves. Not in the graph today.
    sources:
      - repo: alder-finch/fulfilment
        path: promise/app/main.py
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [1, 80]
stores:
  - id: st:wms-db
    origin: seeded
    name: wms-db
    kind: database
    tech: Manhattan · Oracle
    owner: svc:wms
    does: Stock and shipments per warehouse
    access:
      - svc: svc:allocation
        mode: readwrite
      - svc: svc:reservation-sweep
        mode: readwrite
      - svc: svc:carrier-gateway
        mode: readwrite
  - id: st:fulfilment-events
    origin: seeded
    name: fulfilment.events
    kind: topic
    tech: Kafka
    owner: svc:wms
    does: stock.changed, shipment.dispatched
  - id: st:stock-redis
    origin: seeded
    name: stock snapshot
    kind: cache
    tech: Redis 7
    owner: svc:inventory-graph
    does: One stock snapshot per sku, written from stock.changed
    notes:
      A Redis used as a projection of `stock.changed`, not as a cache layer on the read path. It never falls
      through to the WMS.
  - id: st:promise-db
    origin: seeded
    name: promise-db
    kind: database
    tech: Postgres 15
    owner: svc:promise
    does: Promises, cutoffs and lead times
interfaces:
  - id: if:wms-rest
    origin: seeded
    service: svc:wms
    protocol: rest
    endpoints:
      - id: api:wms-stock
        sig: GET /stock/{sku}
        response: sch:stock-level
        auth: service token
        idempotent: true
      - id: api:wms-create-shipment
        sig: POST /shipments
        request: sch:shipment
        response: sch:shipment
        auth: service token
        idempotent: true
      - id: api:wms-reserve
        sig: POST /reservations
        request: sch:reservation
        response: sch:reservation
        auth: service token
        idempotent: true
        summary: Holds qty of sku in the nearest FC with availability; 409 `sold_out` when none has it.
        errors:
          - status: 409
            code: sold_out
            when: No FC has qty available.
      - id: api:wms-release
        sig: DELETE /reservations/{id}
        auth: service token
        idempotent: true
      - id: api:wms-confirm-reservation
        sig: POST /reservations/{id}/confirm
        request: sch:order-line
        response: sch:shipment
        auth: service token
        idempotent: true
        summary: Turns a held reservation into an allocation and a shipment line.
  - id: if:carrier-gateway-rest
    origin: seeded
    service: svc:carrier-gateway
    protocol: rest
    endpoints:
      - id: api:carrier-book
        sig: POST /bookings
        request: sch:shipment
        auth: service token
        idempotent: true
      - id: api:carrier-lead-time
        sig: GET /lead-times?fc=&region=
        response: sch:carrier-lead-time
        auth: service token
        idempotent: true
  - id: if:carrier-api
    origin: seeded
    service: svc:carrier
    protocol: rest
    endpoints:
      - id: api:nordexpress-book
        sig: POST /shipments
        auth: API key
        idempotent: false
  - id: if:promise-rest
    origin: seeded
    service: svc:promise
    protocol: rest
    summary: Lookups for checkout and the PIM. The graph does not call it today.
    endpoints:
      - id: api:promise-get
        sig: GET /promises/{sku}?region=
        response: sch:delivery-promise
        auth: service token
        idempotent: true
schemas:
  - id: sch:stock-level
    origin: seeded
    name: StockLevel
    kind: record
    store: st:wms-db
    fields:
      - name: sku
        type: string
        required: true
        key: true
      - name: fc
        type: string
        required: true
        key: true
      - name: on_hand
        type: int
        required: true
      - name: allocated
        type: int
        required: true
        note: Taken by allocation after capture. Nothing holds stock before that.
      - name: reserved
        type: int
        required: true
        note: Sum of `held` reservations. Available = on_hand − allocated − reserved.
  - id: sch:stock-changed-v1
    origin: seeded
    name: stock.changed v1
    kind: payload
    fields:
      - name: sku
        type: string
        required: true
      - name: fc
        type: string
        required: true
      - name: available
        type: int
        required: true
  - id: sch:shipment
    origin: seeded
    name: Shipment
    kind: record
    store: st:wms-db
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: order_id
        type: uuid
        required: true
        ref: sch:order#id
      - name: fc
        type: string
        required: true
      - name: lines
        type: ShipmentLine[]
        required: true
      - name: carrier_ref
        type: string
      - name: status
        type: enum(created, picked, dispatched, delivered)
        required: true
  - id: sch:shipment-dispatched-v1
    origin: seeded
    name: shipment.dispatched v1
    kind: payload
    fields:
      - name: shipment_id
        type: uuid
        required: true
      - name: order_id
        type: uuid
        required: true
      - name: carrier_ref
        type: string
        required: true
      - name: dispatched_at
        type: timestamptz
        required: true
  - id: sch:carrier-lead-time
    origin: seeded
    name: CarrierLeadTime
    kind: dto
    summary: 'A CSV in the carrier gateway repo: carrier, from FC, to region, working days.'
    fields:
      - name: carrier
        type: string
        required: true
      - name: fc
        type: string
        required: true
      - name: region
        type: string
        required: true
      - name: working_days
        type: int
        required: true
      - name: cost_cents
        type: int
        required: true
        note: What the carrier charges us per parcel.
  - id: sch:stock-snapshot
    origin: seeded
    name: StockSnapshot
    kind: record
    store: st:stock-redis
    summary: 'What the inventory subgraph knows about a SKU: the sum over FCs and which FCs have it.'
    fields:
      - name: sku
        type: string
        required: true
        key: true
        ref: sch:catalog-product#sku
      - name: available
        type: int
        required: true
      - name: fcs
        type: string[]
        required: true
      - name: updated_at
        type: timestamptz
        required: true
  - id: sch:delivery-promise
    origin: seeded
    name: DeliveryPromise
    kind: record
    store: st:promise-db
    summary: The current promise for one SKU in one region. Owned by Fulfilment.
    fields:
      - name: sku
        type: string
        required: true
        key: true
        ref: sch:catalog-product#sku
      - name: region
        type: enum(DE-N, DE-S, NL, FR, SE-S, SE-N)
        required: true
        key: true
      - name: promised_date
        type: date
        required: true
      - name: order_by
        type: timestamptz
        required: true
      - name: confidence
        type: enum(high, low)
        required: true
      - name: computed_at
        type: timestamptz
        required: true
  - id: sch:promise-changed-v1
    origin: seeded
    name: promise.changed v1
    kind: payload
    summary: One SKU, all regions, whenever any date moves.
    fields:
      - name: sku
        type: string
        required: true
      - name: promises
        type: RegionPromise[]
        required: true
        note: region, promised_date, order_by, confidence
      - name: computed_at
        type: timestamptz
        required: true
  - id: sch:reservation
    origin: seeded
    name: Reservation
    kind: record
    store: st:wms-db
    summary: A hold on stock for one checkout session.
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: session_id
        type: uuid
        required: true
        ref: sch:checkout-session#id
        note: Idempotency key with sku.
      - name: sku
        type: string
        required: true
      - name: fc
        type: string
        required: true
      - name: qty
        type: int
        required: true
      - name: expires_at
        type: timestamptz
        required: true
        note: 15 minutes from creation.
      - name: status
        type: enum(held, confirmed, released, expired)
        required: true
        default: held
messages:
  - id: msg:stock-changed
    origin: seeded
    name: stock.changed
    version: v1
    topic: st:fulfilment-events
    payload: sch:stock-changed-v1
    producer: svc:wms
    consumers:
      - svc:search-indexer
      - svc:storefront-bff
      - svc:inventory-graph
      - svc:cache-purger
      - svc:promise
    semantics: At least once per SKU and FC; the indexer ORs them into one `in_stock`.
  - id: msg:shipment-dispatched
    origin: seeded
    name: shipment.dispatched
    version: v1
    topic: st:fulfilment-events
    payload: sch:shipment-dispatched-v1
    producer: svc:wms
    consumers:
      - svc:oms
      - svc:notifier
    semantics: Once per shipment when the carrier scans it.
  - id: msg:promise-changed
    origin: seeded
    name: promise.changed
    version: v1
    topic: st:fulfilment-events
    payload: sch:promise-changed-v1
    producer: svc:promise
    consumers:
      - svc:pim
    key: sku
    semantics: At least once, compacted. Published only when a date or confidence moved.
subgraphs:
  - id: sg:inventory
    origin: seeded
    name: Inventory subgraph
    graph: graph:storefront
    service: svc:inventory-graph
    summary: Extends `Product` with `stock`; owns `Stock`.
    batching: dataloader
    cache_control_default: 30
    timeout_ms: 300
    observed:
      latency_ms: 35
      source: Grafana · gateway → subgraph p50, last 30 days
    sources:
      - repo: alder-finch/fulfilment
        path: inventory-subgraph/app/schema.py
        commit: 6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
        lines: [1, 60]
