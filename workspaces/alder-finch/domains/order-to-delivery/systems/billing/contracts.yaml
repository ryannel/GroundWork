components:
  - id: svc:billing
    origin: seeded
    summary:
      Consumes `order.placed`, renders the invoice from a template, stores it and asks the notifier to
      attach it.
    sources:
      - repo: alder-finch/billing
        path: app/invoice.py
        commit: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        lines: [1, 120]
stores:
  - id: st:billing-db
    origin: seeded
    name: billing-db
    kind: database
    tech: Postgres 15
    owner: svc:billing
    does: Invoices and their PDFs
schemas:
  - id: sch:invoice
    origin: seeded
    name: Invoice
    kind: record
    store: st:billing-db
    fields:
      - name: id
        type: uuid
        required: true
      - name: order_id
        type: uuid
        required: true
      - name: number
        type: string
        required: true
        note: Sequential per country, by law.
      - name: bill_to
        type: Address
        required: true
        note: Copied from the delivery address.
      - name: pdf_key
        type: string
        required: true
      - name: reissued_from
        type: uuid
        note: Set when Billing re-issues by hand.
screens:
  - id: scr:invoice-pdf
    origin: seeded
    name: Invoice PDF
    service: svc:billing
    kind: print
    device: any
    summary: The invoice attached to the confirmation email. Bill-to is the delivery address.
    image: assets/invoice-pdf.svg
    regions:
      - id: scr:invoice-pdf#bill-to
        name: Bill to
        shows: Name and delivery address. No company, no VAT number.
        reads:
          - sch:invoice#bill_to
        at:
          x: 8
          y: 16
          w: 44
          h: 16
      - id: scr:invoice-pdf#lines
        name: Lines and totals
        shows: Items, net, VAT per rate, total.
        at:
          x: 8
          y: 36
          w: 84
          h: 50
    sources:
      - repo: alder-finch/billing
        path: app/templates/invoice_de.html
        commit: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        lines: [1, 90]
