# The words order-to-delivery uses and what each means. A word lives in the domain where it is born.

concepts:
  - id: con:fulfilment-centre
    origin: seeded
    name: Fulfilment centre
    terms:
      - fulfilment centre
      - warehouse
      - FC
    means: One of the three warehouses. Each has its own stock, its own cutoffs and its own carriers.
    born_in: svc:wms
  - id: con:delivery-promise
    origin: seeded
    name: Delivery promise
    terms:
      - promise
      - delivery promise
      - delivery date
      - promised date
    means:
      The date a product arrives in a region if ordered before the cutoff, from stock, cutoffs and carrier lead times.
      Created in Fulfilment, copied to everything the shopper looks at.
    born_in: svc:promise
    relates:
      - to: con:product
        as: is for one
      - to: con:region
        as: holds for one
      - to: con:fulfilment-centre
        as: assumes shipping from one
    aka:
      - in: svc:promise
        as: DeliveryPromise
        at: sch:delivery-promise
  - id: con:order
    origin: seeded
    name: Order
    terms:
      - order
    means:
      What the shopper bought, paid and expects. Created by Order capture at the end of checkout; followed by the OMS
      to delivery.
    born_in: svc:order-capture
    relates:
      - to: con:cart
        as: is made from one
    aka:
      - in: svc:order-capture
        as: Order
        at: sch:order
      - in: svc:oms
        as: Order
        at: sch:order
        note: Same table; the OMS owns the status after capture.
      - in: svc:financing-gateway
        as: FinancingQuote
        at: sch:financing-quote
        note: The partner knows the order as a loan.
  - id: con:order-line
    origin: seeded
    name: Order line
    terms:
      - order line
      - line
    means: One product and quantity in an order. Fulfilment allocates and ships it; the promise lives on it.
    part_of: con:order
    relates:
      - to: con:product
        as: is for one
      - to: con:delivery-promise
        as: carries one
    aka:
      - in: svc:order-capture
        as: OrderLine
        at: sch:order-line
      - in: svc:wms
        as: ShipmentLine
        at: sch:shipment
        note: Grouped into shipments per FC.
  - id: con:shipment
    origin: seeded
    name: Shipment
    terms:
      - shipment
      - parcel
      - consignment
    means: The order lines one warehouse ships together, booked with one carrier.
    born_in: svc:wms
    relates:
      - to: con:order
        as: fulfils part of one
      - to: con:fulfilment-centre
        as: leaves from one
  - id: con:reservation
    origin: seeded
    name: Reservation
    terms:
      - reservation
      - hold
      - stock hold
    means: A quantity of one SKU held in one warehouse for one checkout session until an expiry.
    born_in: svc:wms
    relates:
      - to: con:stock-level
        as: reduces the available part of
    aka:
      - in: svc:wms
        as: Reservation
        at: sch:reservation
      - in: svc:checkout
        as: reservation_ids
        at: sch:checkout-session#reservation_ids
  - id: con:stock-level
    origin: seeded
    name: Stock level
    terms:
      - stock
      - stock level
      - availability
      - on hand
    means: 'What a warehouse has of a SKU: on hand, and available after reservations.'
    born_in: svc:wms
    aka:
      - in: svc:wms
        as: StockLevel
        at: sch:stock-level
