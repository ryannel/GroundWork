id: content
name: Content and translation
team: team:content
repos:
  - alder-finch/translation-hub
components:
  - id: svc:translation-hub
    name: Translation hub
    type: service
    tech: Python · FastAPI
    does: Sends product copy to translators and stores the results
    talks_to:
      - to: svc:translation-vendor
        via: api
  - id: svc:translation-vendor
    name: LinguaCloud
    type: external
    tech: Third-party translation API
    does: Translates product copy into NL, FR and SE
  - id: svc:reviews-graph
    name: Reviews graph service
    type: service
    tech: Node · Apollo Server
    does: Adds customer reviews to Product
  - id: st:translation-db
    name: translation-db
    type: database
    tech: Postgres 15
    does: Translation jobs and results per locale
  - id: st:reviews-db
    name: reviews-db
    type: database
    tech: Postgres 15
    does: Customer reviews and ratings
