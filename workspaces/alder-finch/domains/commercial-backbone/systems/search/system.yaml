id: search
name: Search
team: team:discovery
repos:
  - alder-finch/search
components:
  - id: svc:search-indexer
    name: Search indexer
    type: job
    tech: Go · Kafka consumer
    does: Builds the search index from catalogue, price and stock events
  - id: svc:search-api
    name: Search API
    type: service
    tech: Go
    does: Answers search and listing queries
  - id: svc:search-graph
    name: Search graph service
    type: service
    tech: Go · gqlgen
    does: Owns the search root and answers it from the search API
    talks_to:
      - to: svc:search-api
        via: api
  - id: st:search-index
    name: search-index
    type: database
    tech: OpenSearch
    does: One document per SKU and locale
