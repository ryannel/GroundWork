id: pim
name: Product information
team: team:catalog
repos:
  - alder-finch/pim
components:
  - id: svc:pim-admin
    name: PIM editor
    type: website
    tech: React · internal
    does: Category managers create and enrich products
    talks_to:
      - to: svc:pim
        via: api
  - id: svc:pim
    name: PIM API
    type: service
    tech: Java · Spring Boot
    does: Source of truth for products and their attributes
    talks_to:
      - to: st:catalog-events
        via: message
  - id: svc:enrichment
    name: Enrichment worker
    type: job
    tech: Java · worker
    does: Checks products are complete enough to publish
  - id: svc:catalog-api
    name: Catalog read API
    type: service
    tech: Java · Spring Boot
    does: Fast read copy of published products
  - id: svc:product-graph
    name: Product graph service
    type: service
    tech: Node · Apollo Server
    does: Serves Product, its name, images and lead time
  - id: st:pim-db
    name: pim-db
    type: database
    tech: Postgres 15
    does: Products, attributes, completeness
  - id: st:catalog-events
    name: catalog.events
    type: queue
    tech: Kafka
    does: product.published and friends
    talks_to:
      - to: svc:catalog-api
        via: message
      - to: svc:translation-hub
        via: message
      - to: svc:pricing
        via: message
      - to: svc:search-indexer
        via: message
      - to: svc:product-graph
        via: message
      - to: svc:cache-purger
        via: message
  - id: st:catalog-read-db
    name: catalog-read-db
    type: database
    tech: Postgres 15
    does: Read projection of published products
