id: price-engine
name: Price engine
team: team:pricing
repos:
  - alder-finch/pricing
components:
  - id: svc:price-rules-admin
    name: Price rules console
    type: website
    tech: Vue · internal
    does: Analysts set list prices and rules per country
    talks_to:
      - to: svc:pricing
        via: api
  - id: svc:pricing
    name: Pricing
    type: service
    tech: Kotlin · Ktor
    does: Prices every SKU for every country
    talks_to:
      - to: st:price-events
        via: message
  - id: svc:pricing-graph
    name: Pricing graph service
    type: service
    tech: Kotlin · GraphQL Kotlin
    does: Adds price to Product by calling Pricing
    talks_to:
      - to: svc:pricing
        via: api
  - id: st:pricing-db
    name: pricing-db
    type: database
    tech: Postgres 15
    does: List prices, rules, promotions
  - id: st:price-events
    name: pricing.events
    type: queue
    tech: Kafka
    does: price.published
    talks_to:
      - to: svc:search-indexer
        via: message
      - to: svc:storefront-bff
        via: message
      - to: svc:pricing-graph
        via: message
      - to: svc:cache-purger
        via: message
  - id: st:price-redis
    name: price cache
    type: database
    tech: Redis 7
    does: Price per sku and market, 5 min, purged on price.published
