# The words website uses and what each means. A word lives in the domain where it is born.

concepts:
  - id: con:region
    origin: seeded
    name: Region
    terms:
      - region
      - delivery region
    means:
      'The area a price and a promise are given for. ProductPromise takes it as a variable, which puts it in the edge
      key: six regions are six cached copies, not a private response.'
    born_in: svc:customer-graph
  - id: con:cart
    origin: seeded
    name: Cart
    terms:
      - cart
      - basket
      - mini cart
    means:
      What a shopper has picked. Owned by the cart subgraph and reached through the signed-in customer; its lines
      reference products by `sku`.
    born_in: svc:cart-graph
    relates:
      - to: con:product
        as: holds many
    aka:
      - in: svc:cart-graph
        as: Cart
        at: sch:gql-cart
      - in: svc:cart-graph
        as: Cart
        at: sch:cart
        note: The Redis record behind the type.
