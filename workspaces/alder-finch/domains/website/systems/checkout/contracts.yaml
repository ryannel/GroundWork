components:
  - id: svc:cart
    origin: seeded
    sources:
      - repo: alder-finch/checkout
        path: cart/main.go
        commit: 5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        lines: [1, 60]
  - id: svc:checkout
    origin: seeded
    summary:
      Runs the checkout steps (address, delivery, payment), takes payment or financing, then creates the
      order. Shipping is a constant in its config today.
    sources:
      - repo: alder-finch/checkout
        path: checkout/config.go
        commit: 5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        lines: [14, 22]
        note: '`ShippingFlatCents = 495`'
  - id: svc:cart-graph
    origin: seeded
    summary:
      Owns the `Cart` entity and the `addToCart` mutation, and makes the cart a field of `Customer`. Lines
      hold the SKU and a price re-read from Pricing at add time; `product` on a line is a bare reference by
      `sku` the gateway completes. Batches with DataLoader.
    sources:
      - repo: alder-finch/checkout
        path: cart-subgraph/schema.graphqls
        commit: 5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        lines: [1, 50]
stores:
  - id: st:cart-cache
    origin: seeded
    name: cart-cache
    kind: cache
    tech: Redis 7
    owner: svc:cart
    does: Carts, 30-day TTL; the store of record for a cart
    notes: A Redis used as the primary store, not as a cache layer on the read path.
    access:
      - svc: svc:checkout
        mode: readwrite
      - svc: svc:cart-graph
        mode: readwrite
interfaces:
  - id: if:cart-rest
    origin: seeded
    service: svc:cart
    protocol: rest
    endpoints:
      - id: api:cart-add-line
        sig: POST /carts/{id}/lines
        request: sch:cart
        response: sch:cart
        auth: service token
        idempotent: false
  - id: if:checkout-rest
    origin: seeded
    service: svc:checkout
    protocol: rest
    endpoints:
      - id: api:checkout-step
        sig: POST /sessions/{id}/steps/{step}
        response: sch:checkout-session
        auth: service token
        idempotent: true
      - id: api:checkout-place
        sig: POST /sessions/{id}/place
        response: sch:order
        auth: service token
        idempotent: true
schemas:
  - id: sch:cart
    origin: seeded
    name: Cart
    kind: record
    store: st:cart-cache
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: customer_id
        type: uuid
        ref: sch:customer#id
      - name: region
        type: string
        required: true
      - name: lines
        type: CartLine[]
        required: true
        note: id, sku, qty, unit_cents
      - name: subtotal_cents
        type: int
        required: true
      - name: currency
        type: string
        required: true
      - name: estimated_delivery_text
        type: string
        note: '*3–5 working days*, from the largest `leadTimeDays` across lines. Static.'
      - name: status
        type: enum(open, checked_out)
        required: true
        default: open
      - name: country
        type: string
        required: true
  - id: sch:checkout-session
    origin: seeded
    name: CheckoutSession
    kind: record
    store: st:cart-cache
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: lines
        type: CartLine[]
        required: true
        note: sku, qty
      - name: country
        type: string
        required: true
      - name: step
        type: enum(address, delivery, payment, placed)
        required: true
      - name: reservation_ids
        type: uuid[]
        note: One per line, set on entering payment.
      - name: cart_id
        type: uuid
        required: true
        ref: sch:cart#id
      - name: address
        type: Address
      - name: shipping_cents
        type: int
        required: true
        note: Always 495 today (`ShippingFlatCents`).
      - name: payment_method
        type: enum(card, paylater, instalments)
      - name: total_cents
        type: int
        required: true
subgraphs:
  - id: sg:cart
    origin: seeded
    name: Cart subgraph
    graph: graph:storefront
    service: svc:cart-graph
    summary:
      "Owns `Cart`, `CartLine`, `Customer.cart` and `addToCart`. It holds only a reference to `Product` by
      `sku`: a line's `product` is a bare reference."
    batching: dataloader
    cache_control_default: 0
    timeout_ms: 500
    observed:
      latency_ms: 22
      source: Grafana · gateway → subgraph p50, last 30 days
    sources:
      - repo: alder-finch/checkout
        path: cart-subgraph/schema.graphqls
        commit: 5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        lines: [1, 50]
