components:
  - id: svc:customer-graph
    origin: seeded
    summary:
      Owns `Customer` and the `me` root field, which needs the shopper session. Everything reached through
      `me` is therefore private.
    sources:
      - repo: alder-finch/customers
        path: subgraph/src/main/resources/schema/customer.graphqls
        commit: 0f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6
        lines: [1, 30]
stores:
  - id: st:customer-db
    origin: seeded
    name: customer-db
    kind: database
    tech: Postgres 15
    owner: svc:customer-graph
    does: Customers, addresses, consents
schemas:
  - id: sch:customer
    origin: seeded
    name: Customer
    kind: record
    store: st:customer-db
    fields:
      - name: id
        type: uuid
        required: true
        key: true
      - name: email
        type: string
        required: true
        unique: true
      - name: region
        type: string
        note: From the saved address; falls back to the IP region at the router.
      - name: saved_address
        type: Address
subgraphs:
  - id: sg:customer
    origin: seeded
    name: Customer subgraph
    graph: graph:storefront
    service: svc:customer-graph
    summary: Owns `Customer` and `me`. Everything it serves is private.
    batching: none
    cache_control_default: 0
    timeout_ms: 400
    observed:
      latency_ms: 18
      source: Grafana · gateway → subgraph p50, last 30 days
    sources:
      - repo: alder-finch/customers
        path: subgraph/src/main/resources/schema/customer.graphqls
        commit: 0f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6
        lines: [1, 30]
