components:
  - id: svc:storefront-web
    origin: seeded
    summary: Server-rendered pages in four locales. Every data need is a named operation against
      [[graph:storefront]]; queries go out as persisted GETs so the edge can cache them.
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/graphql/client.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 60]
        note: persisted-query link, GET for queries
  - id: svc:storefront-bff
    origin: seeded
    sources:
      - repo: alder-finch/storefront
        path: apps/bff/src/schema.graphql
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 120]
interfaces:
  - id: if:bff-graphql
    origin: seeded
    service: svc:storefront-bff
    protocol: graphql
    summary: The storefront's only API.
    endpoints:
      - id: api:bff-product
        sig: query product(sku, locale, country)
        response: sch:product-view
        auth: public
        idempotent: true
      - id: api:bff-add-to-cart
        sig: mutation addToCart(sku, qty)
        response: sch:cart
        auth: shopper session
        idempotent: false
      - id: api:bff-checkout-step
        sig: mutation checkoutStep(sessionId, input)
        response: sch:checkout-session
        auth: shopper session
        idempotent: true
      - id: api:bff-place-order
        sig: mutation placeOrder(sessionId)
        response: sch:order
        auth: shopper session
        idempotent: true
      - id: api:bff-order
        sig: query order(number, email)
        response: sch:order-view
        auth: order number + email
        idempotent: true
schemas:
  - id: sch:product-view
    origin: seeded
    name: ProductView
    kind: dto
    summary: What the BFF hands the product page.
    fields:
      - name: sku
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: price
        type: Money
        required: true
        note: List or promo price. Shipping is not in it.
      - name: in_stock
        type: bool
        required: true
      - name: lead_time_text
        type: string
        note: Shown as *Delivery 3–5 working days*.
  - id: sch:order-view
    origin: seeded
    name: OrderView
    kind: dto
    summary: What the OMS hands the tracking page.
    fields:
      - name: number
        type: string
        required: true
      - name: status
        type: string
        required: true
      - name: lines
        type: OrderLineView[]
        required: true
      - name: tracking_url
        type: uri
screens:
  - id: scr:pdp
    origin: seeded
    name: Product page
    service: svc:storefront-web
    kind: page
    route: /{locale}/p/{sku}
    device: desktop
    summary:
      One operation, [[gql:product-page]], fills the hero, price and stock; [[gql:product-reviews]] fills
      the reviews on scroll. The delivery text is the catalogue's static `leadTimeDays`.
    image: assets/pdp.svg
    regions:
      - id: scr:pdp#hero
        name: Hero
        shows: Gallery and name.
        reads:
          - sch:gql-product#name
          - sch:gql-product#imageUrl
        at:
          x: 2
          y: 14
          w: 50
          h: 70
      - id: scr:pdp#price
        name: Price
        shows: The price for the shopper's market.
        reads:
          - sch:gql-product#price
        at:
          x: 55
          y: 26
          w: 43
          h: 10
      - id: scr:pdp#stock
        name: Stock and delivery
        shows: '*In stock · ships in 3 days*. The number is `leadTimeDays`, the same in every region.'
        reads:
          - sch:gql-product#stock
          - sch:gql-product#leadTimeDays
        at:
          x: 55
          y: 38
          w: 43
          h: 8
      - id: scr:pdp#add-to-cart
        name: Add to cart
        shows: Size picker and the **Add to cart** button.
        at:
          x: 55
          y: 48
          w: 43
          h: 14
      - id: scr:pdp#reviews
        name: Reviews
        shows: Average rating and the latest reviews.
        reads:
          - sch:gql-product#reviews
        at:
          x: 55
          y: 66
          w: 43
          h: 26
      - id: scr:pdp#gallery
        name: Gallery
        shows: Product images.
        at:
          x: 2
          y: 14
          w: 50
          h: 70
      - id: scr:pdp#delivery
        name: Delivery line
        shows: '*Delivery 3–5 working days*, straight from `lead_time_text`, the same in every country.'
        reads:
          - sch:product-view#lead_time_text
        at:
          x: 55
          y: 38
          w: 43
          h: 8
    sources:
      - repo: alder-finch/storefront
        path: apps/web/app/%5Blocale%5D/p/%5Bsku%5D/page.tsx
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 90]
  - id: scr:search-results
    origin: seeded
    name: Search results
    service: svc:storefront-web
    kind: page
    route: /{locale}/search
    device: desktop
    summary:
      Tiles from [[gql:search-results]]. A tile is an image and a name; price and stock are on the product
      page.
    image: assets/search-results.svg
    regions:
      - id: scr:search-results#facets
        name: Facets
        shows: Category, size, colour, price, in stock.
        at:
          x: 2
          y: 14
          w: 20
          h: 80
      - id: scr:search-results#tiles
        name: Result tiles
        shows: Image and name. No price, stock or delivery text.
        reads:
          - sch:gql-product#name
          - sch:gql-product#imageUrl
        at:
          x: 24
          y: 14
          w: 74
          h: 80
    sources:
      - repo: alder-finch/storefront
        path: apps/web/app/%5Blocale%5D/search/page.tsx
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 120]
  - id: scr:cart
    origin: seeded
    name: Cart
    service: svc:storefront-web
    kind: page
    route: /{locale}/cart
    device: desktop
    summary: Lines and a subtotal. *Shipping calculated at checkout.*
    image: assets/cart.svg
    regions:
      - id: scr:cart#lines
        name: Lines
        shows: Each line with image, name, qty and price.
        reads:
          - sch:cart#lines
        at:
          x: 2
          y: 14
          w: 62
          h: 80
      - id: scr:cart#summary
        name: Summary
        shows: Subtotal, *Shipping calculated at checkout*, and the **Checkout** button.
        reads:
          - sch:cart#subtotal_cents
        at:
          x: 66
          y: 14
          w: 32
          h: 40
  - id: scr:checkout-delivery
    origin: seeded
    name: Checkout · delivery
    service: svc:storefront-web
    kind: page
    route: /{locale}/checkout/delivery
    device: desktop
    summary: Address and the single delivery option. Where 9.1% of shoppers leave.
    image: assets/checkout-delivery.svg
    regions:
      - id: scr:checkout-delivery#address
        name: Address
        shows: Name, street, postcode, city, country.
        reads:
          - sch:checkout-session#address
        at:
          x: 2
          y: 14
          w: 62
          h: 40
      - id: scr:checkout-delivery#delivery-option
        name: Delivery option
        shows: '*Standard · 3–5 working days · 4.95*. The first time the shopper sees the shipping cost.'
        reads:
          - sch:checkout-session#shipping_cents
        at:
          x: 2
          y: 56
          w: 62
          h: 18
      - id: scr:checkout-delivery#totals
        name: Totals
        shows: Subtotal, shipping, total.
        reads:
          - sch:checkout-session#total_cents
        at:
          x: 66
          y: 14
          w: 32
          h: 40
  - id: scr:checkout-payment
    origin: seeded
    name: Checkout · payment
    service: svc:storefront-web
    kind: page
    route: /{locale}/checkout/payment
    device: desktop
    summary: Card or a financing partner. The financing amount is the subtotal.
    image: assets/checkout-payment.svg
    regions:
      - id: scr:checkout-payment#methods
        name: Payment methods
        shows: Card, *Pay in 3* (Nordbank), *Instalments* (Fjordbank above 500).
        reads:
          - sch:checkout-session#payment_method
        at:
          x: 2
          y: 14
          w: 62
          h: 44
      - id: scr:checkout-payment#financing-quote
        name: Financing quote
        shows: '*3 × 140.00*. Below it in small print: *shipping 4.95 charged to your card*.'
        reads:
          - sch:financing-quote#amount_cents
        at:
          x: 2
          y: 60
          w: 62
          h: 14
      - id: scr:checkout-payment#pay
        name: Place order
        shows: Totals and the **Place order** button.
        reads:
          - sch:checkout-session#total_cents
        at:
          x: 66
          y: 14
          w: 32
          h: 46
  - id: scr:order-tracking
    origin: seeded
    name: Where is my order
    service: svc:storefront-web
    kind: page
    route: /{locale}/orders/{number}
    device: desktop
    summary: Status and lines; a carrier link once shipped. No date before that.
    image: assets/order-tracking.svg
    regions:
      - id: scr:order-tracking#lookup
        name: Lookup
        shows: Order number and email.
        at:
          x: 2
          y: 14
          w: 96
          h: 12
      - id: scr:order-tracking#status
        name: Status
        shows: Placed → Allocated → Shipped → Delivered, with the current one lit. No date.
        reads:
          - sch:order-view#status
        at:
          x: 2
          y: 28
          w: 96
          h: 22
      - id: scr:order-tracking#lines
        name: Lines
        shows: The items and, once shipped, the carrier's tracking link.
        reads:
          - sch:order-view#lines
          - sch:order-view#tracking_url
        at:
          x: 2
          y: 52
          w: 96
          h: 42
  - id: scr:checkout-address
    origin: seeded
    name: Checkout · address
    service: svc:storefront-web
    kind: page
    route: /{locale}/checkout/address
    device: desktop
    summary: The delivery address form. No place for a company or a VAT number.
    image: assets/checkout-address.svg
    regions:
      - id: scr:checkout-address#address
        name: Address form
        shows: Name, street, postcode, city, country and the **Continue** button.
        reads:
          - sch:checkout-session#address
        at:
          x: 2
          y: 14
          w: 62
          h: 60
      - id: scr:checkout-address#summary
        name: Order summary
        shows: Lines and total.
        reads:
          - sch:checkout-session#total_cents
        at:
          x: 66
          y: 14
          w: 32
          h: 40
    sources:
      - repo: alder-finch/storefront
        path: apps/web/app/%5Blocale%5D/checkout/address/page.tsx
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 140]
  - id: scr:mini-cart
    origin: seeded
    name: Mini cart
    service: svc:storefront-web
    kind: sheet
    device: any
    summary: Slides in after add-to-cart or from the header. [[gql:cart-summary]] fills it.
    image: assets/mini-cart.svg
    regions:
      - id: scr:mini-cart#lines
        name: Lines
        shows: Each line with image, name, qty and unit price.
        reads:
          - sch:gql-cart#lines
        at:
          x: 2
          y: 14
          w: 62
          h: 80
      - id: scr:mini-cart#summary
        name: Summary
        shows: Subtotal and *Delivery 3–5 working days*.
        reads:
          - sch:gql-cart#subtotalCents
          - sch:gql-cart#estimatedDelivery
        at:
          x: 66
          y: 14
          w: 32
          h: 30
      - id: scr:mini-cart#checkout
        name: Checkout
        shows: The **Checkout** button.
        at:
          x: 66
          y: 46
          w: 32
          h: 8
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/cart/MiniCart.tsx
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 80]
operations:
  - id: gql:product-page
    origin: seeded
    name: ProductPage
    kind: query
    graph: graph:storefront
    screens:
      - scr:pdp#hero
      - scr:pdp#price
      - scr:pdp#stock
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: load
    summary:
      'Sent once when the page is server-rendered; the hero, price and stock come from it. The edge keeps
      it longer than stock changes: the page shows only *In stock* or not, and the purger removes the cached
      page when stock moves.'
    document: |
      query ProductPage($sku: ID!) {
        product(sku: $sku) {
          sku
          name
          imageUrl
          price { amount currency }
          stock { available }
          leadTimeDays
        }
      }
    cache:
      - at: st:edge-cache
        ttl: 600
        key:
          operation: id
          variables:
            - sku
          headers:
            - Accept-Language
        reason:
          Stock is shown as in or out only and `stock.changed` purges the page by sku, so ten minutes is
          acceptable, although the cache rules alone would give 30 s.
    plan_check:
      fetches: 3
      round_trips: 2
      source: https://studio.apollographql.com/graph/alderfinch-storefront/operations/ProductPage/plan
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/pdp/queries.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [10, 30]
  - id: gql:product-reviews
    origin: seeded
    name: ProductReviews
    kind: query
    graph: graph:storefront
    screens:
      - scr:pdp#reviews
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: scroll
    summary:
      Sent when the reviews scroll into view. The reviews subgraph only knows a product by `id`, so the
      product subgraph is asked first.
    document: |
      query ProductReviews($sku: ID!) {
        product(sku: $sku) {
          sku
          reviews { rating title body author }
        }
      }
    cache:
      - at: st:edge-cache
        ttl: 300
        key:
          operation: id
          variables:
            - sku
          headers:
            - Accept-Language
    plan_check:
      fetches: 2
      round_trips: 2
      source: https://studio.apollographql.com/graph/alderfinch-storefront/operations/ProductReviews/plan
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/pdp/reviews.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 30]
  - id: gql:search-results
    origin: seeded
    name: SearchResults
    kind: query
    graph: graph:storefront
    screens:
      - scr:search-results#tiles
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: load
    summary:
      'Sent on page load, and again with a larger `first` when the shopper asks for more. One fetch: the
      search subgraph provides the name and image of every hit itself.'
    document: |
      query SearchResults($q: String!, $first: Int) {
        search(q: $q, first: $first) {
          sku
          name
          imageUrl
        }
      }
    cache:
      - at: st:edge-cache
        ttl: 120
        key:
          operation: id
          variables:
            - q
            - first
          headers:
            - Accept-Language
    plan_check:
      fetches: 1
      round_trips: 1
      source: https://studio.apollographql.com/graph/alderfinch-storefront/operations/SearchResults/plan
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/search/queries.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 40]
  - id: gql:add-to-cart
    origin: seeded
    name: AddToCart
    kind: mutation
    graph: graph:storefront
    screens:
      - scr:pdp#add-to-cart
    client: svc:storefront-web
    method: POST
    persisted: safelist
    trigger: click
    summary: Sent when the button is pressed. The response feeds the mini cart directly, with no second query.
    document: |
      mutation AddToCart($sku: ID!, $qty: Int!) {
        addToCart(sku: $sku, qty: $qty) {
          id
          lines { id sku qty unitCents }
          subtotalCents
          currency
          estimatedDelivery
        }
      }
    writes:
      - sch:cart
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/cart/mutations.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 30]
  - id: gql:cart-summary
    origin: seeded
    name: CartSummary
    kind: query
    graph: graph:storefront
    screens:
      - scr:mini-cart
    client: svc:storefront-web
    method: POST
    persisted: safelist
    trigger: click
    summary:
      Sent when the mini cart opens from the header. Private, because the cart is reached through `me`, so
      nothing above the gateway caches it.
    document: |
      query CartSummary {
        me {
          cart {
            id
            lines {
              id
              qty
              unitCents
              product { sku name imageUrl }
            }
            subtotalCents
            currency
            estimatedDelivery
          }
        }
      }
    cache:
      - at: st:gateway-entity-cache
        key: subgraph · type · sku · scope
    plan_check:
      fetches: 3
      round_trips: 3
      source: https://studio.apollographql.com/graph/alderfinch-storefront/operations/CartSummary/plan
    sources:
      - repo: alder-finch/storefront
        path: apps/web/src/cart/queries.ts
        commit: 4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 40]
