components:
  - id: svc:fastly
    origin: seeded
    summary: The edge in front of the gateway. Its cache is [[st:edge-cache]]; its purge API is [[if:fastly-api]].
  - id: svc:graph-gateway
    origin: seeded
    summary:
      'Works out which subgraphs answer each operation, runs the fetches and merges the result. Keeps an
      entity cache in Redis (one entry per subgraph, type and key). Owns the graph: composition runs in its
      repo on every subgraph publish.'
    sources:
      - repo: alder-finch/storefront-graph
        path: router.yaml
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 80]
        note: 'gateway config: persisted queries, entity cache, headers'
      - repo: alder-finch/storefront-graph
        path: supergraph.yaml
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 30]
        note: the seven subgraphs
  - id: svc:cache-purger
    origin: seeded
    summary:
      Consumes `product.published`, `price.published` and `stock.changed` and purges the SKU's surrogate
      key at Fastly and the Product entity in the gateway's cache.
    sources:
      - repo: alder-finch/storefront-graph
        path: purger/main.go
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [20, 140]
stores:
  - id: st:edge-cache
    origin: seeded
    name: edge cache
    kind: cache
    tech: Fastly
    owner: svc:fastly
    does: Caches persisted GET responses at the edge
    layer: edge
    granularity: response
    keyed_by: operation id · variables · Accept-Language
    stale:
      while_revalidate: 30
      if_error: 3600
    access:
      - svc: svc:cache-purger
        mode: write
    purge: surrogate key per sku, sent by the cache purger
    invalidated_by:
      - msg:price-published
      - msg:product-published
      - msg:stock-changed
    observed:
      hit_ratio: 0.92
      latency_ms:
        hit: 15
        miss: 120
    notes:
      Only operations the client sends as GET with a persisted id are cacheable; mutations and POSTs pass
      through. 92 % is ProductPage over the last 30 days; SearchResults sits at about 71 %.
    sources:
      - repo: alder-finch/storefront-graph
        path: fastly/vcl/graph.vcl
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 90]
        note:
          cache key = operation id + sorted variables + Accept-Language; surrogate keys from the gateway's
          response header
  - id: st:gateway-entity-cache
    origin: seeded
    name: gateway entity cache
    kind: cache
    tech: Apollo Router entity caching · Redis 7
    owner: svc:graph-gateway
    does: Remembers entity pieces per subgraph, so a fetch can be skipped
    layer: gateway
    granularity: entity
    keyed_by: subgraph · type · key fields · selection hash · scope
    access:
      - svc: svc:cache-purger
        mode: write
    purge: entity type and key (sku) through the gateway's invalidation endpoint
    invalidated_by:
      - msg:price-published
      - msg:product-published
      - msg:stock-changed
    observed:
      hit_ratio: 0.62
      latency_ms:
        hit: 8
        miss: 95
    notes:
      "Caches per entity, not per response, so it answers `pricing: hit · inventory: miss` inside one
      operation. Entries honour each subgraph's `cache_control` and keep private data apart by scope."
    sources:
      - repo: alder-finch/storefront-graph
        path: router.yaml
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [40, 72]
interfaces:
  - id: if:storefront-graph
    origin: seeded
    service: svc:graph-gateway
    protocol: graphql
    summary:
      '`POST /graphql` and persisted `GET /graphql?extensions=…`. The only API the storefront calls; what
      it asks is in `operations`.'
    sources:
      - repo: alder-finch/storefront-graph
        path: router.yaml
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 20]
  - id: if:gateway-admin
    origin: seeded
    service: svc:graph-gateway
    protocol: rest
    summary: The gateway's invalidation endpoint, called by the cache purger.
    endpoints:
      - id: api:gateway-invalidate
        sig: POST /invalidate
        summary: Drop cached entities of a type with this key (sku).
        auth: service token
        idempotent: true
  - id: if:fastly-api
    origin: seeded
    service: svc:fastly
    protocol: rest
    endpoints:
      - id: api:fastly-purge
        sig: POST /service/{id}/purge/{surrogate_key}
        auth: API token
        idempotent: true
schemas:
  - id: sch:gql-query
    origin: seeded
    name: Query
    kind: graph-type
    graph: graph:storefront
    root: query
    summary: The root. Each root field belongs to the subgraph the gateway asks first.
    fields:
      - name: product
        args: 'sku: ID!'
        type: Product
        subgraphs:
          - sg:product
      - name: search
        args: 'q: String!, first: Int'
        type: '[Product!]!'
        subgraphs:
          - sg:search
        via: api:search-query
        provides:
          - sch:gql-product#name
          - sch:gql-product#imageUrl
        cache_control:
          max_age: 120
        note:
          The search subgraph asks the search API and returns each hit with its name and image, so a result list
          is one fetch.
      - name: me
        type: Customer
        subgraphs:
          - sg:customer
        auth: shopper session
        note: Everything selected through `me` is private to the session.
    sources:
      - repo: alder-finch/storefront-graph
        path: supergraph.graphql
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 40]
        note: composed SDL, Query
  - id: sch:gql-mutation
    origin: seeded
    name: Mutation
    kind: graph-type
    graph: graph:storefront
    root: mutation
    fields:
      - name: addToCart
        args: 'sku: ID!, qty: Int!'
        type: Cart!
        subgraphs:
          - sg:cart
        via: api:pricing-get-price
        auth: shopper session
        note: Re-reads the price from Pricing so the cart never trusts the page.
    sources:
      - repo: alder-finch/storefront-graph
        path: supergraph.graphql
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [42, 60]
  - id: sch:gql-product
    origin: seeded
    name: Product
    kind: graph-type
    graph: graph:storefront
    keys:
      - fields:
          - sku
        in:
          - sg:product
          - sg:pricing
          - sg:inventory
          - sg:cart
          - sg:search
      - fields:
          - id
        in:
          - sg:product
          - sg:reviews
    summary:
      'The product as the front end sees it. Four subgraphs contribute fields: product, pricing and
      inventory join by `sku`, reviews by `id`. The cart and search subgraphs are in the `sku` list because
      they hold a reference to a product, not a product: they own none of its fields. Whether the gateway may
      ask them for one by `sku`, or they should be stubs it never fetches from, is open.'
    fields:
      - name: sku
        type: ID!
        subgraphs:
          - sg:product
        note:
          The key. The product, pricing and inventory subgraphs can be asked for a product by it; the cart and
          search subgraphs only hold it. The catalogue copy is `sch:catalog-product#sku`.
      - name: id
        type: ID!
        subgraphs:
          - sg:product
        note: The catalogue's internal id. Content only knows reviews by this.
      - name: name
        type: String!
        subgraphs:
          - sg:product
        cache_control:
          max_age: 3600
        note:
          From the catalogue copy (`sch:catalog-product#name`) in the product subgraph. The search subgraph
          declares it @external and provides it on `Query.search` hits from its index, so a search result
          needs no second fetch; asked for a Product by key, only the product subgraph answers.
      - name: imageUrl
        type: String
        subgraphs:
          - sg:product
        cache_control:
          max_age: 3600
        note:
          'The first image: `sch:catalog-product#images` in the product subgraph; search provides it on
          `Query.search` hits.'
      - name: price
        type: Money!
        subgraphs:
          - sg:pricing
        reads:
          - sch:price#list_cents
          - sch:price#promo_cents
          - sch:price#currency
        via: api:pricing-get-price
        cache:
          - at: st:price-redis
            ttl: 300
        cache_control:
          max_age: 300
        note: "For the market of the request's locale. Public: the edge key varies on `Accept-Language`."
      - name: stock
        type: Stock!
        subgraphs:
          - sg:inventory
        reads:
          - sch:stock-snapshot#available
          - sch:stock-snapshot#fcs
        cache_control:
          max_age: 30
      - name: leadTimeDays
        type: Int
        subgraphs:
          - sg:product
        reads:
          - sch:catalog-product#lead_time_days
        usage:
          clients:
            - web
            - ios ≤ 4.2
          per_day: 1.2M
          last_seen: 2026-09-30
          source: https://studio.apollographql.com/graph/alderfinch-storefront/fields/Product.leadTimeDays
        note: Static; the same number in every region.
      - name: reviews
        type: '[Review!]!'
        subgraphs:
          - sg:reviews
        reads:
          - sch:review#rating
          - sch:review#title
          - sch:review#body
          - sch:review#author
        cache_control:
          max_age: 300
    sources:
      - repo: alder-finch/storefront-graph
        path: supergraph.graphql
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [62, 110]
        note: '`type Product @key(fields: "sku") @key(fields: "id")` with `@join__field(graph:)` per field'
  - id: sch:gql-money
    origin: seeded
    name: Money
    kind: graph-type
    graph: graph:storefront
    summary:
      "A value type: amount in minor units and the currency. Pricing's; resolved inside the fetch that
      returns a price, so it has no key."
    fields:
      - name: amount
        type: Int!
        subgraphs:
          - sg:pricing
      - name: currency
        type: String!
        subgraphs:
          - sg:pricing
  - id: sch:gql-stock
    origin: seeded
    name: Stock
    kind: graph-type
    graph: graph:storefront
    fields:
      - name: available
        type: Int!
        subgraphs:
          - sg:inventory
        reads:
          - sch:stock-snapshot#available
      - name: fc
        type: String
        subgraphs:
          - sg:inventory
        reads:
          - sch:stock-snapshot#fcs
        note: The warehouse that would ship it first. Only the admin tooling selects it today.
  - id: sch:gql-review
    origin: seeded
    name: Review
    kind: graph-type
    graph: graph:storefront
    fields:
      - name: rating
        type: Int!
        subgraphs:
          - sg:reviews
        reads:
          - sch:review#rating
      - name: title
        type: String
        subgraphs:
          - sg:reviews
        reads:
          - sch:review#title
      - name: body
        type: String!
        subgraphs:
          - sg:reviews
        reads:
          - sch:review#body
      - name: author
        type: String!
        subgraphs:
          - sg:reviews
        reads:
          - sch:review#author
  - id: sch:gql-customer
    origin: seeded
    name: Customer
    kind: graph-type
    graph: graph:storefront
    keys:
      - fields:
          - id
        in:
          - sg:customer
          - sg:cart
    summary: The signed-in shopper. The cart belongs to it, which is why a cart is only ever reached through `me`.
    fields:
      - name: id
        type: ID!
        subgraphs:
          - sg:customer
        reads:
          - sch:customer#id
      - name: email
        type: String!
        subgraphs:
          - sg:customer
        reads:
          - sch:customer#email
      - name: region
        type: String!
        subgraphs:
          - sg:customer
        reads:
          - sch:customer#region
        note: Saved address first, IP region second. The storefront passes it as the `region` variable.
      - name: savedAddress
        type: String
        subgraphs:
          - sg:customer
        reads:
          - sch:customer#saved_address
      - name: cart
        type: Cart
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#id
  - id: sch:gql-cart
    origin: seeded
    name: Cart
    kind: graph-type
    graph: graph:storefront
    summary: Everything on a cart is reached through the signed-in customer.
    fields:
      - name: id
        type: ID!
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#id
      - name: lines
        type: '[CartLine!]!'
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#lines
      - name: subtotalCents
        type: Int!
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#subtotal_cents
      - name: currency
        type: String!
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#currency
      - name: estimatedDelivery
        type: String
        subgraphs:
          - sg:cart
        reads:
          - sch:cart#estimated_delivery_text
        usage:
          clients:
            - web
          per_day: 310k
          last_seen: 2026-09-30
          source: https://studio.apollographql.com/graph/alderfinch-storefront/fields/Cart.estimatedDelivery
        note: "*3–5 working days*. Computed by the cart subgraph from the lines' `leadTimeDays`. Static."
    sources:
      - repo: alder-finch/checkout
        path: cart-subgraph/schema.graphqls
        commit: 5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        lines: [1, 50]
  - id: sch:gql-cart-line
    origin: seeded
    name: CartLine
    kind: graph-type
    graph: graph:storefront
    fields:
      - name: id
        type: ID!
        subgraphs:
          - sg:cart
      - name: sku
        type: ID!
        subgraphs:
          - sg:cart
      - name: qty
        type: Int!
        subgraphs:
          - sg:cart
      - name: unitCents
        type: Int!
        subgraphs:
          - sg:cart
        note: The price at add time, from the cart record; not re-resolved by Pricing.
      - name: product
        type: Product!
        subgraphs:
          - sg:cart
        note: A bare reference `{ sku }`; the gateway fetches the rest from the subgraphs that own it.
graphs:
  - id: graph:storefront
    origin: seeded
    name: Storefront graph
    gateway: svc:graph-gateway
    registry: https://studio.apollographql.com/graph/alderfinch-storefront
    summary:
      One schema for the shop, composed from seven subgraphs by Apollo Router. The storefront is its only
      client. Fastly sits in front for persisted GETs, and the gateway keeps an entity cache of its own. Every
      subgraph is a service owned by its team; a `Product` is four of them joined by `sku` and a fifth joined
      by `id`.
    sources:
      - repo: alder-finch/storefront-graph
        path: supergraph.yaml
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 30]
      - repo: alder-finch/storefront-graph
        path: supergraph.graphql
        commit: a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e
        lines: [1, 160]
        note: the composed SDL, checked in by CI
