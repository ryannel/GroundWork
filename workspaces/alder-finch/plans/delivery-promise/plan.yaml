      - modify: "flow:track-order#show"
        set:
          logic: "Status, lines, *Arriving Thu 8 Oct*, and any slip with its reason."
      - modify: scr:order-tracking
        set:
          summary: "Status with the promised date, and every slip explained."
          image: assets/order-tracking-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=95-40"
      - modify: "scr:order-tracking#status"
        set:
          shows: "Placed → Allocated → Shipped → Delivered with the current one lit, and **Arriving Thu 8 Oct** beside it."
          reads: ["sch:order-view#status", "sch:order-view#promised_date"]
      - add: region
        into: scr:order-tracking
        value:
          id: scr:order-tracking#slips
          name: Date changes
          shows: "*Was Thu 8 Oct, now Fri 9 Oct: it missed the collection from Berlin.* Hidden when there are none."
          reads: ["sch:order-view#slips"]
          at: { x: 2, y: 52, w: 96, h: 12 }
      - modify: "scr:order-tracking#lines"
        set:
          at: { x: 2, y: 66, w: 96, h: 28 }
  # ── Remove
  - id: chg:retire-static-lead-time
    title: "Remove the typed lead time, the flat shipping constant and the v1 events"
    why: "Two sources of a promise are one too many. Once M4 is live nothing reads them."
    rollout: "M4 + two weeks of clean dual-publish metrics. Columns dropped in a scheduled migration."
    ops:
      - remove: "sch:product#lead_time_text"
      - remove: "sch:product-translation#lead_time_text"
      - remove: "sch:catalog-product#lead_time_text"
      - remove: "sch:search-document#lead_time_text"
      - remove: "sch:product-view#lead_time_text"
      - remove: msg:product-published
      - remove: sch:product-published-v1
      - remove: msg:order-placed
      - remove: sch:order-placed-v1
      - modify: "flow:index-product#stock"
        set:
          logic: "`in_stock` is true if any FC has stock; the promise now says which and when."

# ─────────────────────────────────────────────── chapter 6: How we prove it
tests:
  - id: tst:promise-berlin-malmo
    level: unit
    name: "A tent in Berlin, ordered Sunday from Malmö, is promised Thursday"
    given: "Stock in Berlin only; Berlin cutoff Mon 14:00; NordExpress Berlin→SE-S is 2 working days"
    when: "The promise is computed for SE-S on Sunday 20:00"
    then: "`promised_date` is Thursday, `order_by` is Monday 14:00, `fc` is berlin, `confidence` high"
    proves: [chg:promise-service]
    walks: ["flow:compute-promise#compute"]
    owner: team:fulfilment
    env: ci
  - id: tst:promise-backtest
    level: e2e
    name: "Six weeks of real orders would have been promised a date we met 95% of the time"
    given: "Stock, cutoffs and carrier scans for Aug–Sep replayed"
    when: "Promises are computed for every order at its capture time"
    then: "At least 95% of actual deliveries land on or before the computed date, per region"
    proves: [chg:promise-service]
    walks: ["flow:compute-promise#compute"]
    owner: team:fulfilment
    env: staging
  - id: tst:promise-no-stock
    level: unit
    name: "No stock anywhere means no promise, not a wrong one"
    given: "A SKU with zero available in every FC"
    when: "The promise is computed"
    then: "No `DeliveryPromise` row; `promise.changed` carries the region with `promised_date: null`"
    proves: [chg:promise-service]
    walks: ["flow:compute-promise#compute", "flow:compute-promise#publish"]
    owner: team:fulfilment
    env: ci
  - id: tst:lead-time-api-matches-csv
    level: integration
    name: "The lead-time API returns what the CSV said"
