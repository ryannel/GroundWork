  - { team: team:product, confidence: 3, note: "Two open questions and one proposed one-way decision are ours." }
  - { team: team:legal, confidence: 2, note: "The price opinion is on file for DE, NL and SE. FR's is deferred to M4 and owed before it, and the slip wording is not yet written." }

story:
  chapters:
    why:
      headline: "Shoppers do not mind waiting. They mind not knowing."
      recap:
        - "22% of contacts ask where an order is; 9.1% of checkouts die on the delivery step."
        - "One dated promise, created in Fulfilment, shown everywhere, with shipping in the price."
    today:
      headline: "A product passes through eleven teams on its way to a doorstep, and the delivery date is a text field."
      recap:
        - "One PIM event reaches translation, pricing, search and the storefront."
        - "The real lead time is first known at allocation, after the money has moved."
    runs:
      headline: "Today the product page says 3–5 days, checkout adds 4.95, and the warehouse decides later."
      recap:
        - "Financing quotes the subtotal; shipping goes to the card separately."
        - "Allocation picks the nearest warehouse with stock, whatever the shopper was told."
    new:
      headline: "A Promise service computes one date per region; after capture the order copies it and never recomputes it."
      recap:
        - "promise.changed carries the date to the PIM, search and the BFF."
        - "promise.slipped carries a missed date to the order and the shopper."
    changes:
      headline: "One promise reaches every screen: sixteen changes in the systems of ten teams, two events get a v2, and the typed lead time, the shipping constant and the CSV are removed."
      recap:
        - "Pricing folds a shipping component into the display price per region."
        - "Nine screens change and two are new, an email and a push; the typed lead time is removed."
    prove:
      headline: "A backtest gates the promise; one staging run walks Anna's Sunday end to end."
      recap:
        - "Contract tests pin every v2 consumer and both financing partners."
        - "Promise down means no date, never an error."
    build:
      headline: "Fulfilment first, Sweden first, then the order keeps the promise, then everywhere."
      recap:
        - "M1 computes without showing; M2 is Sweden only, read for two weeks."
        - "M3 freezes the date on the order and sends the slip email; M4 removes the old."
    commit:
      headline: "Two price decisions are still proposed and ten are made; Legal owes the FR opinion before M4."
      recap:
        - "Shipping in the display price and the free-shipping threshold are proposed."
        - "Legal is at 2; Pricing, Storefront and Product are at 3; everyone else is at 4 or 5."
