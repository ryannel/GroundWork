# A worked example at enterprise scale. Alder & Finch, its teams, repos and code links are fictional. The plan
# follows one change end to end through product creation, pricing, translation, search, the storefront, cart,
# checkout, financing partners, payment, order capture, fulfilment and tracking: a real delivery date on every
# product, with shipping priced into what the shopper sees. The `sources` links follow the permalink format but
# point at repositories that do not exist; the screenshots are drawn stand-ins (tools/fixtures/make-screens.mjs).

meta:
  id: delivery-promise
  title: "Show a real delivery date on every product, and price shipping into it"
  version: "0.7"
  date: "2026-09-28"
  start: "2026-10-19"
  status: review
  authors: ["Fulfilment", "Storefront", "Pricing", "Checkout", "Orders"]
  appetite: "14 weeks · 4 milestones"
  repos:
    - alder-finch/pim
    - alder-finch/translation-hub
    - alder-finch/pricing
    - alder-finch/search
    - alder-finch/storefront
    - alder-finch/checkout
    - alder-finch/financing-gateway
    - alder-finch/payments
    - alder-finch/orders
    - alder-finch/fulfilment
    - alder-finch/notifier

# ─────────────────────────────────────────────── chapter 1: Why
problem:
  summary: >-
    Every product page says **Delivery 3–5 working days** and every checkout adds a flat **4.95** for shipping,
    whatever the product, the warehouse or the country. The real date is only known after the order is captured
    and Fulfilment has allocated it. This plan computes a **delivery promise** per product and region in
    Fulfilment, carries it through the catalogue, pricing and search into the product page, cart, checkout and
    the financing quote, keeps it on the order, and tells the shopper when it slips.
  why: >-
    "Where is my order" is **22% of all customer contacts** (31,000 last quarter). Swedish shoppers see 3–5
    days and wait **7.4 on average**, because the Malmö warehouse rarely stocks what Berlin does. **9.1% of
    checkouts are abandoned on the delivery step**, where the shopper first sees the shipping cost and still no
    date. Two competitors show a date on the product page; our own test on 2% of German traffic in June lifted
    add-to-cart by **6.8%** with a hand-maintained spreadsheet behind it. The spreadsheet is the current
    "system" ([[sch:product#lead_time_text]]).
  goals:
    - "A shopper sees a dated promise (*Get it by Thu 8 Oct*) on the product page, the cart, the checkout and the order."
    - "The price a shopper sees on the product page is what they pay, shipping included, in every country we sell in."
    - "A promise that slips is told to the shopper before they ask."
    - "Fulfilment is the single source of the promise; no other team keeps a lead-time table."
  non_goals:
    - "Express or timed delivery options. One promise per product and region first ([[dec:no-express-in-v1]])."
    - "Postcode-level promises. v1 works per region: a country, or the regions a carrier prices by ([[dec:region-not-postcode]])."
    - "Changing the financing partners' products or rates. They receive a different amount, nothing else."
    - "Store pickup and click & collect."
  metrics:
    - { name: "Contacts asking where an order is", today: "22% of contacts", target: "under 10%" }
    - { name: "Checkouts abandoned on the delivery step", today: "9.1%", target: "under 5%" }
    - { name: "Orders delivered on or before the promised date", today: "n/a (no promise)", target: "95%" }
    - { name: "Product pages showing a dated promise", today: "0% (2% test, by hand)", target: "100% of in-stock products in all four countries" }
    - { name: "Add-to-cart rate", today: "4.2%", target: "4.5%" }
  scenarios:
    - id: sc:anna-malmo
      title: "Anna in Malmö sees Thursday, not 3–5 days"
      story: >-
        Anna opens the Fjäll 2 tent on Sunday evening from Malmö. The page says **Get it by Thu 8 Oct · order by
        14:00 Mon** and **2,499 kr, shipping included**. The tent is in the Berlin warehouse, two carrier days to
        Skåne plus Monday's cutoff. The cart and the checkout repeat Thursday; the order confirmation says
        Thursday; the tracking page says Thursday until the parcel is scanned.
      flows: [flow:browse-product, flow:checkout, flow:track-order]
    - id: sc:tomas-paylater
      title: "Tomas pays in three, shipping included"
      story: >-
        Tomas in Hamburg picks *Pay in 3* for a 420.00 jacket. Today the partner quotes 3 × 140.00 and the
        4.95 shipping is charged to his card separately, which confuses him and costs a contact. With the plan the
        quote is for 424.95 and the three instalments cover everything.
      flows: [flow:checkout]
    - id: sc:category-manager
      title: "Mette creates a product and sees its promise appear"
      story: >-
        Mette creates the new Birch 40 backpack in the PIM on Tuesday. Enrichment flags the missing weight,
        translation runs overnight for NL, FR and SE, and on Wednesday morning the product editor shows a
        read-only **Delivery promise** panel: DE Thu, NL Fri, SE Mon, FR not yet (no stock in Lyon). She no
        longer types *3–5 working days* into the lead-time field.
      flows: [flow:create-product, flow:propagate-promise]
    - id: sc:berlin-slip
      title: "The Berlin cutoff is missed and Anna hears first"
      story: >-
        Monday's Berlin picking wave is late and Anna's tent misses the 16:00 carrier collection. The warehouse
        publishes the slip, the order moves to Friday, and Anna gets an email before she looks: *Your tent now
        arrives Fri 9 Oct. Sorry.* The tracking page shows the new date and why.
      flows: [flow:fulfil-order, flow:promise-slipped]
  glossary:
    - { term: "Delivery promise", means: "The date we tell the shopper a product arrives if they order now, for their region. Computed by Fulfilment from stock, cutoffs and carrier lead times ([[con:delivery-promise]])." }
    - { term: "Cutoff", means: "The time of day by which an order must be captured for the warehouse to ship it the same day." }
    - { term: "FC", means: "Fulfilment centre: one of our three warehouses (Berlin, Malmö, Lyon)." }
    - { term: "Region", means: "The area a carrier prices and promises by: a country, or part of one (DE-North, DE-South, SE-South, SE-North, NL, FR)." }
    - { term: "PIM", means: "Product information management: the system where products are created and enriched before anything else sees them." }
    - { term: "Enrichment", means: "Filling and checking a product's attributes (weight, materials, images) until it is complete enough to publish." }
    - { term: "Display price", means: "The price shown on the product page. With this plan it includes the shipping component for the shopper's region." }
    - { term: "Shipping component", means: "The part of the display price that pays for shipping: a per-region rule, zero above a free-shipping threshold." }
    - { term: "BFF", means: "Backend for frontend: the one service the storefront talks to; it shapes data from many services into what a page needs." }
    - { term: "PSP", means: "Payment service provider: the third party that authorises and captures card payments." }
    - { term: "Pay later", means: "A financing partner pays us at capture and collects from the shopper in instalments." }
    - { term: "OMS", means: "Order management: the service that follows an order from captured to delivered." }
    - { term: "WMS", means: "Warehouse management: the system that holds stock, picks and ships." }
    - { term: "Allocation", means: "Choosing which warehouse ships which order line." }
    - { term: "Slip", means: "A promise we will miss: the shipment will not make the promised date." }
    - { term: "Walking skeleton", means: "A thin slice of the whole feature that runs end to end first, then gets fleshed out." }
    - { term: "Contract test", means: "A test pinning what one service expects from another's API or event, so either side can change safely." }
    - { term: "Dual-publish", means: "Publishing both the old and the new version of an event until every consumer has moved." }

domain:
  summary: >-
    A **product** is created in the PIM and passed on: Content translates it, Pricing prices it, Search indexes it, the
    Storefront shows it. A **cart** becomes an **order** at checkout, paid by card or by a financing partner.
    Fulfilment allocates each **order line** to a warehouse, ships it and hands it to a carrier. This plan adds the
    **delivery promise**: created in Fulfilment, copied onto the product, folded into the price, shown on every
    screen, and kept on the order so a slip can be told.
  concepts:
    - id: con:product
      name: Product
      terms: [product, SKU, item, article]
      means: "Something we sell: one SKU with its attributes, translations and images. Created in the PIM; every other system keeps a copy."
      born_in: svc:pim
      aka:
        - { in: svc:pim, as: Product, at: sch:product }
        - { in: svc:catalog-api, as: CatalogProduct, at: sch:catalog-product, note: "Read copy per locale." }
        - { in: svc:translation-hub, as: ProductTranslation, at: sch:product-translation, note: "One row per product and locale." }
        - { in: svc:pricing, as: Price, at: sch:price, note: "Pricing only knows the SKU and its price points." }
        - { in: svc:search-indexer, as: SearchDocument, at: sch:search-document }
        - { in: svc:storefront-bff, as: ProductView, at: sch:product-view }
        - { in: svc:wms, as: StockLevel, at: sch:stock-level, note: "The warehouse knows the SKU as a stock position per FC." }
    - id: con:fulfilment-centre
      name: Fulfilment centre
      terms: [fulfilment centre, warehouse, FC]
      means: "One of the three warehouses. Each has its own stock, its own cutoffs and its own carriers."
      born_in: svc:wms
    - id: con:region
      name: Region
      terms: [region, delivery region, zone]
      means: "The area a promise and a shipping cost are given for. Today a country; the carriers price six regions."
      born_in: svc:carrier-gateway
    - id: con:delivery-promise
      name: Delivery promise
      terms: [promise, delivery promise, delivery date, promised date]
      means: "The date a product arrives in a region if ordered before the cutoff, from stock, cutoffs and carrier lead times. Created in Fulfilment, copied to everything the shopper looks at."
      born_in: svc:promise
      relates:
        - { to: con:product, as: "is for one" }
        - { to: con:region, as: "holds for one" }
        - { to: con:fulfilment-centre, as: "assumes shipping from one" }
      aka:
        - { in: svc:promise, as: DeliveryPromise, at: sch:delivery-promise }
        - { in: svc:pim, as: delivery_promise, at: "sch:product#delivery_promise", note: "Per region, refreshed by event." }
        - { in: svc:storefront-bff, as: delivery_promise_date, at: "sch:product-view#delivery_promise_date" }
        - { in: svc:order-capture, as: promised_date, at: "sch:order-line#promised_date", note: "Frozen at capture; moves only on a slip." }
      introduced_by: [chg:promise-service, chg:pim-promise-attribute, chg:order-carries-promise]
    - id: con:shipping-component
      name: Shipping component
      terms: [shipping component, shipping cost, shipping]
      means: "What a shopper pays for delivery in their region: a Pricing rule, zero above the free-shipping threshold. Today a constant in Checkout."
      born_in: svc:pricing
      relates: [{ to: con:region, as: "is set per" }]
      introduced_by: [chg:pricing-shipping-component]
    - id: con:display-price
      name: Display price
      terms: [display price, shelf price, price incl. shipping]
      means: "The price on the product page. With this plan it is the list price plus the shipping component for the shopper's region, so what they see is what they pay."
      part_of: con:product
      relates: [{ to: con:shipping-component, as: "includes the" }]
      introduced_by: [chg:pricing-shipping-component, chg:pdp-delivery-promise]
    - id: con:cart
      name: Cart
      terms: [cart, basket]
      means: "What a shopper has picked but not yet bought. Lives in a cache for 30 days."
      born_in: svc:cart
      relates: [{ to: con:product, as: "holds many" }]
    - id: con:order
      name: Order
      terms: [order]
      means: "What the shopper bought, paid and expects. Created by Order capture at the end of checkout; followed by the OMS to delivery."
      born_in: svc:order-capture
      relates: [{ to: con:cart, as: "is made from one" }]
      aka:
        - { in: svc:order-capture, as: Order, at: sch:order }
        - { in: svc:oms, as: Order, at: sch:order, note: "Same table; the OMS owns the status after capture." }
        - { in: svc:financing-gateway, as: FinancingQuote, at: sch:financing-quote, note: "The partner knows the order as a loan." }
    - id: con:order-line
      name: Order line
      terms: [order line, line]
      means: "One product and quantity in an order. Fulfilment allocates and ships it; the promise lives on it."
      part_of: con:order
      relates: [{ to: con:product, as: "is for one" }, { to: con:delivery-promise, as: "carries one" }]
      aka:
        - { in: svc:order-capture, as: OrderLine, at: sch:order-line }
        - { in: svc:wms, as: ShipmentLine, at: sch:shipment, note: "Grouped into shipments per FC." }
    - id: con:shipment
      name: Shipment
      terms: [shipment, parcel, consignment]
      means: "The order lines one warehouse ships together, booked with one carrier."
      born_in: svc:wms
      relates: [{ to: con:order, as: "fulfils part of one" }, { to: con:fulfilment-centre, as: "leaves from one" }]
  stages:
    - id: stage:create
      name: Create
      summary: "A product is created, enriched and translated."
      services:
        - { svc: svc:pim-admin }
        - { svc: svc:pim }
        - { svc: svc:enrichment }
        - { svc: svc:translation-hub, from: [svc:pim] }
        - { svc: svc:translation-vendor }
      flows: [flow:create-product]
    - id: stage:price
      name: Price
      summary: "Each product gets a price per country."
      services:
        - { svc: svc:price-rules-admin }
        - { svc: svc:pricing, from: [svc:pim] }
      flows: [flow:price-product]
    - id: stage:discover
      name: Discover
      summary: "Products are indexed and shown."
      services:
        - { svc: svc:search-indexer, from: [svc:pim, svc:pricing, svc:wms] }
        - { svc: svc:search-api }
        - { svc: svc:catalog-api, from: [svc:pim] }
        - { svc: svc:storefront-bff, from: [svc:catalog-api, svc:pricing, svc:search-api] }
        - { svc: svc:storefront-web }
      flows: [flow:index-product, flow:browse-product]
    - id: stage:buy
      name: Buy
      summary: "Cart, checkout, financing and payment."
      services:
        - { svc: svc:cart, from: [svc:storefront-bff] }
        - { svc: svc:checkout, from: [svc:cart] }
        - { svc: svc:financing-gateway, from: [svc:checkout] }
        - { svc: svc:paylater-partner }
        - { svc: svc:instalments-bank }
        - { svc: svc:payments, from: [svc:checkout] }
        - { svc: svc:psp }
      flows: [flow:add-to-cart, flow:checkout]
    - id: stage:capture
      name: Capture
      summary: "The order exists and is followed."
      services:
        - { svc: svc:order-capture, from: [svc:checkout] }
        - { svc: svc:oms, from: [svc:order-capture] }
      flows: [flow:checkout]
    - id: stage:fulfil
      name: Fulfil
      summary: "A warehouse ships it and a carrier delivers it."
      services:
        - { svc: svc:allocation, from: [svc:order-capture] }
        - { svc: svc:wms }
        - { svc: svc:carrier-gateway }
        - { svc: svc:carrier }
      flows: [flow:fulfil-order, flow:sync-stock]
    - id: stage:tell
      name: Tell
      summary: "The shopper hears what happened and can look it up."
      services:
        - { svc: svc:notifier, from: [svc:order-capture, svc:wms] }
      flows: [flow:track-order]

# ─────────────────────────────────────────────── chapter 2: The system today
teams:
  - { id: team:catalog, name: "Catalog", channel: "#team-catalog", colour: 5 }
  - { id: team:content, name: "Content & Translation", channel: "#team-content", colour: 8 }
  - { id: team:pricing, name: "Pricing", channel: "#team-pricing", colour: 6 }
  - { id: team:discovery, name: "Discovery", channel: "#team-discovery", colour: 7 }
  - { id: team:storefront, name: "Storefront", channel: "#team-storefront", colour: 2 }
  - { id: team:checkout, name: "Checkout", channel: "#team-checkout", colour: 1 }
  - { id: team:financing, name: "Financing", channel: "#team-financing", colour: 9 }
  - { id: team:payments, name: "Payments", channel: "#team-payments", colour: 12 }
  - { id: team:orders, name: "Orders", channel: "#team-orders", colour: 3 }
  - { id: team:fulfilment, name: "Fulfilment", channel: "#team-fulfilment", colour: 4 }
  - { id: team:notifications, name: "Notifications", channel: "#team-notifications", colour: 10 }
  - { id: team:product, name: "Product management", channel: "#product-commerce", colour: 11 }
  - { id: team:legal, name: "Legal", channel: "#legal-commerce", colour: 13 }

systems:
  - id: sys:pim
    name: "PIM"
    team: team:catalog
    does: "Where products are created and made complete"
    summary: "One repo, one database: the editor UI, the API and the enrichment worker ship together."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/catalog-info.yaml#L4-L9" }]
  - id: sys:storefront
    name: "Storefront"
    team: team:storefront
    does: "The shop the customer uses"
    summary: "The Next.js site and its GraphQL BFF are one monorepo and one deploy."
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/catalog-info.yaml#L3-L8" }]
  - id: sys:checkout
    name: "Checkout"
    team: team:checkout
    does: "Cart and checkout as one deployable pair"
    summary: "Cart and Checkout share the repo and the Redis cluster; Checkout is Cart's only reader."
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/catalog-info.yaml#L3-L10" }]
  - id: sys:fulfilment
    name: "Fulfilment platform"
    team: team:fulfilment
    does: "Stock, allocation, shipping and carriers"
    summary: "The WMS integration, the allocation worker and the carrier gateway deploy from one repo against one warehouse database."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/catalog-info.yaml#L3-L12" }]

services:
  # ── Create
  - id: svc:pim-admin
    name: PIM editor
    team: team:catalog
    system: sys:pim
    kind: ui
    tech: "React · internal"
    does: "Category managers create and enrich products"
    summary: "The internal product editor. Writes only through [[if:pim-rest]]."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/editor/src/App.tsx#L1-L40" }]
  - id: svc:pim
    name: PIM API
    team: team:catalog
    system: sys:pim
    kind: service
    tech: "Java · Spring Boot"
    does: "Source of truth for products and their attributes"
    summary: "Holds every product and attribute; publishes `product.published` whenever a product changes."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/api/src/main/java/pim/PimApplication.java" }]
  - id: svc:enrichment
    name: Enrichment worker
    team: team:catalog
    system: sys:pim
    kind: job
    tech: "Java · worker"
    does: "Checks products are complete enough to publish"
    summary: "Runs the completeness rules (weight, dimensions, images, hazard class) after every save and marks the product publishable or not."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/worker/src/main/java/pim/enrich/CompletenessWorker.java#L22-L140" }]
  - id: svc:translation-hub
    name: Translation hub
    team: team:content
    kind: service
    tech: "Python · FastAPI"
    does: "Sends product copy to translators and stores the results"
    summary: "Turns a published product into translation jobs per locale, calls the vendor, and publishes the translations back."
    sources: [{ url: "https://github.com/alder-finch/translation-hub/blob/7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b/app/main.py#L1-L60" }]
  - id: svc:translation-vendor
    name: LinguaCloud
    team: team:content
    kind: external
    tech: "Third-party translation API"
    does: "Translates product copy into NL, FR and SE"
    summary: "Machine translation with human review for the four locales; 24-hour SLA on review."
  # ── Price
  - id: svc:price-rules-admin
    name: Price rules console
    team: team:pricing
    kind: ui
    tech: "Vue · internal"
    does: "Analysts set list prices and rules per country"
    summary: "Internal console over [[if:pricing-rest]]."
    sources: [{ url: "https://github.com/alder-finch/pricing/blob/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c/console/src/views/Rules.vue#L1-L80" }]
  - id: svc:pricing
    name: Pricing
    team: team:pricing
    kind: service
    tech: "Kotlin · Ktor"
    does: "Prices every SKU for every country"
    summary: "Holds list prices and promotions; answers price lookups and publishes `price.published`."
    sources: [{ url: "https://github.com/alder-finch/pricing/blob/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c/src/main/kotlin/pricing/Application.kt" }]
  # ── Discover
  - id: svc:search-indexer
    name: Search indexer
    team: team:discovery
    kind: job
    tech: "Go · Kafka consumer"
    does: "Builds the search index from catalogue, price and stock events"
    summary: "Consumes product, price and stock events and writes one search document per SKU and locale."
    sources: [{ url: "https://github.com/alder-finch/search/blob/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d/indexer/main.go#L30-L120" }]
  - id: svc:search-api
    name: Search API
    team: team:discovery
    kind: service
    tech: "Go"
    does: "Answers search and listing queries"
    sources: [{ url: "https://github.com/alder-finch/search/blob/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d/api/main.go#L1-L50" }]
  - id: svc:catalog-api
    name: Catalog read API
    team: team:catalog
    kind: service
    tech: "Java · Spring Boot"
    does: "Fast read copy of published products"
    summary: "A read-optimised projection of the PIM for the storefront; rebuilt from `product.published`."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/read-api/src/main/java/catalog/CatalogReadApplication.java" }]
  - id: svc:storefront-web
    name: Storefront
    team: team:storefront
    system: sys:storefront
    kind: ui
    tech: "Next.js"
    does: "The shop: product pages, cart, checkout, order tracking"
    summary: "Server-rendered pages in four locales. Talks only to the BFF."
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/app/%5Blocale%5D/p/%5Bsku%5D/page.tsx#L1-L90" }]
  - id: svc:storefront-bff
    name: Storefront BFF
    team: team:storefront
    system: sys:storefront
    kind: service
    tech: "Node · GraphQL"
    does: "Shapes catalogue, price, cart and order data for the pages"
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/bff/src/schema.graphql#L1-L120" }]
  # ── Buy
  - id: svc:cart
    name: Cart
    team: team:checkout
    system: sys:checkout
    kind: service
    tech: "Go"
    does: "Holds what a shopper has picked"
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/cart/main.go#L1-L60" }]
  - id: svc:checkout
    name: Checkout
    team: team:checkout
    system: sys:checkout
    kind: service
    tech: "Go"
    does: "Turns a cart into a paid order"
    summary: "Runs the checkout steps (address, delivery, payment), takes payment or financing, then creates the order. Shipping is a constant in its config today."
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/checkout/config.go#L14-L22", note: "`ShippingFlatCents = 495`" }]
  - id: svc:financing-gateway
    name: Financing gateway
    team: team:financing
    kind: service
    tech: "Java · Quarkus"
    does: "Gets instalment quotes from partners and confirms the loan"
    summary: "One adapter per partner. Asks for a quote during checkout and confirms the loan after the order is captured."
    sources: [{ url: "https://github.com/alder-finch/financing-gateway/blob/0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e/src/main/java/financing/GatewayResource.java#L20-L140" }]
  - id: svc:paylater-partner
    name: Nordbank PayLater
    team: team:financing
    kind: external
    tech: "Partner REST API"
    does: "Pay in 3 and pay in 30 days for DE, NL, SE"
  - id: svc:instalments-bank
    name: Fjordbank instalments
    team: team:financing
    kind: external
    tech: "Partner REST API"
    does: "6 to 24 month instalments above 500"
  - id: svc:payments
    name: Payments
    team: team:payments
    kind: service
    tech: "Java · Quarkus"
    does: "Authorises and captures card payments"
    sources: [{ url: "https://github.com/alder-finch/payments/blob/1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f/src/main/java/payments/PaymentsResource.java#L18-L96" }]
  - id: svc:psp
    name: Nordpay
    team: team:payments
    kind: external
    tech: "Payment service provider"
    does: "Charges the shopper's card"
  # ── Capture
  - id: svc:order-capture
    name: Order capture
    team: team:orders
    kind: service
    tech: "Kotlin · Spring Boot"
    does: "Records the order and announces it"
    summary: "Creates the order from the checkout session in one transaction and publishes `order.placed` from an outbox."
    sources: [{ url: "https://github.com/alder-finch/orders/blob/2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a/capture/src/main/kotlin/orders/CaptureController.kt#L24-L118" }]
  - id: svc:oms
    name: Order management
    team: team:orders
    kind: service
    tech: "Kotlin · Spring Boot"
    does: "Follows each order from captured to delivered"
    summary: "Owns the order status after capture; serves order lookups to the storefront and customer care."
    sources: [{ url: "https://github.com/alder-finch/orders/blob/2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a/oms/src/main/kotlin/orders/oms/OrderStatusService.kt#L15-L160" }]
  # ── Fulfil
  - id: svc:allocation
    name: Allocation worker
    team: team:fulfilment
    system: sys:fulfilment
    kind: job
    tech: "Python · Kafka consumer"
    does: "Picks the warehouse that ships each order line"
    summary: "Consumes `order.placed`, chooses an FC per line by stock and distance, and creates the shipments in the WMS."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/allocation/allocate.py#L40-L210" }]
  - id: svc:wms
    name: WMS
    team: team:fulfilment
    system: sys:fulfilment
    kind: service
    tech: "Manhattan Active · our integration layer"
    does: "Stock, picking and shipping in the three warehouses"
    summary: "The warehouse system of record, wrapped by our integration layer which exposes stock, shipments and publishes `shipment.dispatched` and `stock.changed`."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/wms/api/routes.py#L1-L80" }]
  - id: svc:carrier-gateway
    name: Carrier gateway
    team: team:fulfilment
    system: sys:fulfilment
    kind: service
    tech: "Python · FastAPI"
    does: "Books parcels and reads tracking from the carriers"
    summary: "One adapter per carrier. Holds the lead-time tables each carrier publishes, updated by hand each quarter."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/carriers/leadtimes.csv#L1-L30", note: "the hand-kept lead-time table" }]
  - id: svc:carrier
    name: NordExpress
    team: team:fulfilment
    kind: external
    tech: "Carrier API"
    does: "Delivers parcels in all four countries"
  # ── Tell
  - id: svc:notifier
    name: Notifier
    team: team:notifications
    kind: service
    tech: "Python · FastAPI"
    does: "Sends order emails and pushes"
    summary: "Templates for confirmation, shipped and delivered emails, rendered per locale."
    sources: [{ url: "https://github.com/alder-finch/notifier/blob/3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b/app/templates/__init__.py#L1-L40" }]

stores:
  - { id: st:pim-db, name: pim-db, kind: database, tech: "Postgres 15", owner: svc:pim, does: "Products, attributes, completeness", access: [{ svc: svc:enrichment, mode: readwrite }] }
  - { id: st:catalog-events, name: catalog.events, kind: topic, tech: "Kafka", owner: svc:pim, does: "product.published and friends" }
  - { id: st:catalog-read-db, name: catalog-read-db, kind: database, tech: "Postgres 15", owner: svc:catalog-api, does: "Read projection of published products" }
  - { id: st:translation-db, name: translation-db, kind: database, tech: "Postgres 15", owner: svc:translation-hub, does: "Translation jobs and results per locale" }
  - { id: st:pricing-db, name: pricing-db, kind: database, tech: "Postgres 15", owner: svc:pricing, does: "List prices, rules, promotions" }
  - { id: st:price-events, name: pricing.events, kind: topic, tech: "Kafka", owner: svc:pricing, does: "price.published" }
  - { id: st:search-index, name: search-index, kind: database, tech: "OpenSearch", owner: svc:search-indexer, does: "One document per SKU and locale" }
  - { id: st:cart-cache, name: cart-cache, kind: cache, tech: "Redis", owner: svc:cart, does: "Carts and checkout sessions, 30-day TTL", access: [{ svc: svc:checkout, mode: readwrite }] }
  - { id: st:financing-db, name: financing-db, kind: database, tech: "Postgres 15", owner: svc:financing-gateway, does: "Quotes and loans per order" }
  - { id: st:payments-db, name: payments-db, kind: database, tech: "Postgres 15", owner: svc:payments, does: "Authorisations and captures" }
  - { id: st:orders-db, name: orders-db, kind: database, tech: "Postgres 16", owner: svc:order-capture, does: "Orders and their lines; shared with the OMS", access: [{ svc: svc:oms, mode: readwrite }] }
  - { id: st:order-events, name: orders.events, kind: topic, tech: "Kafka", owner: svc:order-capture, does: "order.placed, order.updated" }
  - { id: st:wms-db, name: wms-db, kind: database, tech: "Manhattan · Oracle", owner: svc:wms, does: "Stock, shipments, waves per FC", access: [{ svc: svc:allocation, mode: read }, { svc: svc:carrier-gateway, mode: readwrite }] }
  - { id: st:fulfilment-events, name: fulfilment.events, kind: topic, tech: "Kafka", owner: svc:wms, does: "stock.changed, shipment.dispatched" }

schemas:
  - id: sch:product
    name: Product
    kind: record
    store: st:pim-db
    summary: "One row per SKU; attributes as columns and a JSON bag."
    fields:
      - { name: sku, type: string, required: true, key: true }
      - { name: name, type: string, required: true, note: "Source language (DE)." }
      - { name: weight_g, type: int, note: "Needed for shipping cost; 11% of products still lack it." }
      - { name: dimensions_mm, type: "int[3]" }
      - { name: hazard_class, type: "enum(none, battery, aerosol)", required: true }
      - { name: lead_time_text, type: string, note: "Typed by the category manager, e.g. *3–5 working days*. The source of today's promise." }
      - { name: publishable, type: bool, required: true, note: "Set by the enrichment worker." }
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/api/src/main/resources/db/migration/V12__products.sql#L1-L40" }]
  - id: sch:product-published-v1
    name: product.published v1
    kind: payload
    summary: "The whole product, every time it changes."
    fields:
      - { name: sku, type: string, required: true }
      - { name: name, type: string, required: true }
      - { name: weight_g, type: int }
      - { name: lead_time_text, type: string }
      - { name: publishable, type: bool, required: true }
      - { name: published_at, type: timestamptz, required: true }
  - id: sch:catalog-product
    name: CatalogProduct
    kind: record
    store: st:catalog-read-db
    summary: "The read copy per SKU and locale: what the storefront and search see."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
      - { name: locale, type: string, required: true, key: true }
      - { name: name, type: string, required: true }
      - { name: lead_time_text, type: string }
      - { name: publishable, type: bool, required: true }
  - id: sch:product-translation
    name: ProductTranslation
    kind: record
    store: st:translation-db
    summary: "One row per SKU and locale with the translated copy."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
      - { name: locale, type: "enum(de, nl, fr, sv)", required: true, key: true }
      - { name: name, type: string, required: true }
      - { name: description, type: text }
      - { name: lead_time_text, type: string, note: "Translated by hand, per locale. Often stale." }
      - { name: status, type: "enum(pending, machine, reviewed)", required: true, default: pending }
  - id: sch:price
    name: Price
    kind: record
    store: st:pricing-db
    summary: "List price per SKU and country."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
      - { name: country, type: "enum(DE, FR, NL, SE)", required: true, key: true }
      - { name: list_cents, type: int, required: true }
      - { name: currency, type: "enum(EUR, SEK)", required: true }
      - { name: promo_cents, type: int, note: "Active promotion, if any." }
  - id: sch:price-published-v1
    name: price.published v1
    kind: payload
    fields:
      - { name: sku, type: string, required: true }
      - { name: country, type: string, required: true }
      - { name: list_cents, type: int, required: true }
      - { name: promo_cents, type: int }
      - { name: currency, type: string, required: true }
  - id: sch:search-document
    name: SearchDocument
    kind: record
    store: st:search-index
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
      - { name: locale, type: string, required: true, key: true }
      - { name: name, type: string, required: true }
      - { name: price_cents, type: int, required: true }
      - { name: in_stock, type: bool, required: true, note: "From stock.changed, any FC." }
      - { name: lead_time_text, type: string }
  - id: sch:product-view
    name: ProductView
    kind: dto
    summary: "What the BFF hands the product page."
    fields:
      - { name: sku, type: string, required: true }
      - { name: name, type: string, required: true }
      - { name: price, type: Money, required: true, note: "List or promo price. Shipping is not in it." }
      - { name: in_stock, type: bool, required: true }
      - { name: lead_time_text, type: string, note: "Shown as *Delivery 3–5 working days*." }
  - id: sch:cart
    name: Cart
    kind: record
    store: st:cart-cache
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: country, type: string, required: true }
      - { name: lines, type: "CartLine[]", required: true, note: "sku, qty, unit_cents" }
      - { name: subtotal_cents, type: int, required: true }
  - id: sch:checkout-session
    name: CheckoutSession
    kind: record
    store: st:cart-cache
    summary: "The cart plus what the shopper has told checkout so far."
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: cart_id, type: uuid, required: true, ref: "sch:cart#id" }
      - { name: address, type: Address }
      - { name: shipping_cents, type: int, required: true, note: "Always 495 today (`ShippingFlatCents`)." }
      - { name: payment_method, type: "enum(card, paylater, instalments)" }
      - { name: total_cents, type: int, required: true }
  - id: sch:financing-quote
    name: FinancingQuote
    kind: record
    store: st:financing-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: checkout_session_id, type: uuid, required: true, ref: "sch:checkout-session#id" }
      - { name: partner, type: "enum(nordbank, fjordbank)", required: true }
      - { name: amount_cents, type: int, required: true, note: "The cart subtotal. Shipping is charged to the card separately today." }
      - { name: instalments, type: int, required: true }
      - { name: status, type: "enum(quoted, confirmed, declined)", required: true, default: quoted }
  - id: sch:payment
    name: Payment
    kind: record
    store: st:payments-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: order_id, type: uuid, ref: "sch:order#id" }
      - { name: amount_cents, type: int, required: true }
      - { name: status, type: "enum(authorised, captured, refunded)", required: true }
      - { name: psp_ref, type: string, required: true, unique: true }
  - id: sch:order
    name: Order
    kind: record
    store: st:orders-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: number, type: string, required: true, unique: true, note: "What the shopper sees: AF-2026-…" }
      - { name: country, type: string, required: true }
      - { name: status, type: "enum(placed, allocated, shipped, delivered, cancelled)", required: true, default: placed }
      - { name: shipping_cents, type: int, required: true }
      - { name: total_cents, type: int, required: true }
      - { name: payment_method, type: "enum(card, paylater, instalments)", required: true }
  - id: sch:order-line
    name: OrderLine
    kind: record
    store: st:orders-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: order_id, type: uuid, required: true, ref: "sch:order#id" }
      - { name: sku, type: string, required: true, ref: "sch:product#sku" }
      - { name: qty, type: int, required: true }
      - { name: unit_cents, type: int, required: true }
      - { name: fc, type: "enum(berlin, malmo, lyon)", note: "Set by allocation." }
  - id: sch:order-placed-v1
    name: order.placed v1
    kind: payload
    fields:
      - { name: order_id, type: uuid, required: true }
      - { name: number, type: string, required: true }
      - { name: country, type: string, required: true }
      - { name: lines, type: "OrderLine[]", required: true }
      - { name: payment_method, type: string, required: true }
      - { name: placed_at, type: timestamptz, required: true }
  - id: sch:stock-level
    name: StockLevel
    kind: record
    store: st:wms-db
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
      - { name: fc, type: string, required: true, key: true }
      - { name: on_hand, type: int, required: true }
      - { name: reserved, type: int, required: true }
  - id: sch:stock-changed-v1
    name: stock.changed v1
    kind: payload
    fields:
      - { name: sku, type: string, required: true }
      - { name: fc, type: string, required: true }
      - { name: available, type: int, required: true }
  - id: sch:shipment
    name: Shipment
    kind: record
    store: st:wms-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: order_id, type: uuid, required: true, ref: "sch:order#id" }
      - { name: fc, type: string, required: true }
      - { name: lines, type: "ShipmentLine[]", required: true }
      - { name: carrier_ref, type: string }
      - { name: status, type: "enum(created, picked, dispatched, delivered)", required: true }
  - id: sch:shipment-dispatched-v1
    name: shipment.dispatched v1
    kind: payload
    fields:
      - { name: shipment_id, type: uuid, required: true }
      - { name: order_id, type: uuid, required: true }
      - { name: carrier_ref, type: string, required: true }
      - { name: dispatched_at, type: timestamptz, required: true }
  - id: sch:carrier-lead-time
    name: CarrierLeadTime
    kind: dto
    summary: "A CSV in the carrier gateway repo: carrier, from FC, to region, working days."
    fields:
      - { name: carrier, type: string, required: true }
      - { name: fc, type: string, required: true }
      - { name: region, type: string, required: true }
      - { name: working_days, type: int, required: true }
      - { name: cost_cents, type: int, required: true, note: "What the carrier charges us per parcel." }
  - id: sch:order-view
    name: OrderView
    kind: dto
    summary: "What the OMS hands the tracking page."
    fields:
      - { name: number, type: string, required: true }
      - { name: status, type: string, required: true }
      - { name: lines, type: "OrderLineView[]", required: true }
      - { name: tracking_url, type: uri }

interfaces:
  - id: if:pim-rest
    service: svc:pim
    protocol: rest
    summary: "The PIM's write and read API, used by the editor."
    endpoints:
      - { id: api:pim-save-product, sig: "PUT /products/{sku}", request: sch:product, response: sch:product, auth: "staff SSO", idempotent: true }
      - { id: api:pim-get-product, sig: "GET /products/{sku}", response: sch:product, auth: "staff SSO", idempotent: true }
  - id: if:translation-vendor-api
    service: svc:translation-vendor
    protocol: rest
    summary: "LinguaCloud's job API."
    endpoints:
      - { id: api:vendor-translate, sig: "POST /v2/jobs", request: sch:product-translation, response: sch:product-translation, auth: "API key", idempotent: false }
  - id: if:pricing-rest
    service: svc:pricing
    protocol: rest
    endpoints:
      - { id: api:pricing-get-price, sig: "GET /prices/{sku}?country=", response: sch:price, auth: "service token", idempotent: true }
      - { id: api:pricing-set-rule, sig: "PUT /rules/{id}", auth: "staff SSO", idempotent: true }
  - id: if:catalog-read
    service: svc:catalog-api
    protocol: rest
    endpoints:
      - { id: api:catalog-get-product, sig: "GET /catalog/{locale}/{sku}", response: sch:product, auth: "service token", idempotent: true }
  - id: if:search-rest
    service: svc:search-api
    protocol: rest
    endpoints:
      - { id: api:search-query, sig: "GET /search?q=&locale=&filters=", response: sch:search-document, auth: "public", idempotent: true }
  - id: if:bff-graphql
    service: svc:storefront-bff
    protocol: graphql
    summary: "The storefront's only API."
    endpoints:
      - { id: api:bff-product, sig: "query product(sku, locale, country)", response: sch:product-view, auth: "public", idempotent: true }
      - { id: api:bff-add-to-cart, sig: "mutation addToCart(sku, qty)", response: sch:cart, auth: "shopper session", idempotent: false }
      - { id: api:bff-checkout-step, sig: "mutation checkoutStep(sessionId, input)", response: sch:checkout-session, auth: "shopper session", idempotent: true }
      - { id: api:bff-place-order, sig: "mutation placeOrder(sessionId)", response: sch:order, auth: "shopper session", idempotent: true }
      - { id: api:bff-order, sig: "query order(number, email)", response: sch:order-view, auth: "order number + email", idempotent: true }
  - id: if:cart-rest
    service: svc:cart
    protocol: rest
    endpoints:
      - { id: api:cart-add-line, sig: "POST /carts/{id}/lines", request: sch:cart, response: sch:cart, auth: "service token", idempotent: false }
  - id: if:checkout-rest
    service: svc:checkout
    protocol: rest
    endpoints:
      - { id: api:checkout-step, sig: "POST /sessions/{id}/steps/{step}", response: sch:checkout-session, auth: "service token", idempotent: true }
      - { id: api:checkout-place, sig: "POST /sessions/{id}/place", response: sch:order, auth: "service token", idempotent: true }
  - id: if:financing-rest
    service: svc:financing-gateway
    protocol: rest
    endpoints:
      - { id: api:financing-quote, sig: "POST /quotes", request: sch:financing-quote, response: sch:financing-quote, auth: "service token", idempotent: true }
      - { id: api:financing-confirm, sig: "POST /quotes/{id}/confirm", response: sch:financing-quote, auth: "service token", idempotent: true }
  - id: if:paylater-partner-api
    service: svc:paylater-partner
    protocol: rest
    summary: "Nordbank PayLater merchant API."
    endpoints:
      - { id: api:nordbank-quote, sig: "POST /merchant/v3/sessions", auth: "mTLS", idempotent: true }
      - { id: api:nordbank-confirm, sig: "POST /merchant/v3/sessions/{id}/authorize", auth: "mTLS", idempotent: true }
  - id: if:instalments-bank-api
    service: svc:instalments-bank
    protocol: https
    summary: "Fjordbank's instalment loan API."
    endpoints:
      - { id: api:fjordbank-quote, sig: "GetInstalmentOffer", auth: "certificate", idempotent: true }
  - id: if:payments-rest
    service: svc:payments
    protocol: rest
    endpoints:
      - { id: api:payments-authorise, sig: "POST /payments", request: sch:payment, response: sch:payment, auth: "service token", idempotent: true }
      - { id: api:payments-capture, sig: "POST /payments/{id}/capture", response: sch:payment, auth: "service token", idempotent: true }
  - id: if:psp-api
    service: svc:psp
    protocol: rest
    endpoints:
      - { id: api:psp-authorise, sig: "POST /v1/authorisations", auth: "API key", idempotent: true }
  - id: if:orders-rest
    service: svc:order-capture
    protocol: rest
    endpoints:
      - { id: api:orders-create, sig: "POST /orders", request: sch:checkout-session, response: sch:order, auth: "service token", idempotent: true }
  - id: if:oms-rest
    service: svc:oms
    protocol: rest
    endpoints:
      - { id: api:oms-get-order, sig: "GET /orders/{number}", response: sch:order-view, auth: "service token", idempotent: true }
      - { id: api:oms-allocate, sig: "POST /orders/{id}/allocation", request: sch:order-line, response: sch:order, auth: "service token", idempotent: true }
  - id: if:wms-rest
    service: svc:wms
    protocol: rest
    summary: "Our integration layer over Manhattan."
    endpoints:
      - { id: api:wms-create-shipment, sig: "POST /shipments", request: sch:shipment, response: sch:shipment, auth: "service token", idempotent: true }
      - { id: api:wms-stock, sig: "GET /stock/{sku}", response: sch:stock-level, auth: "service token", idempotent: true }
  - id: if:carrier-gateway-rest
    service: svc:carrier-gateway
    protocol: rest
    endpoints:
      - { id: api:carrier-book, sig: "POST /bookings", request: sch:shipment, auth: "service token", idempotent: true }
      - { id: api:carrier-lead-time, sig: "GET /lead-times?fc=&region=", response: sch:carrier-lead-time, auth: "service token", idempotent: true }
  - id: if:carrier-api
    service: svc:carrier
    protocol: rest
    endpoints:
      - { id: api:nordexpress-book, sig: "POST /shipments", auth: "API key", idempotent: false }
  - id: if:notifier-rest
    service: svc:notifier
    protocol: rest
    endpoints:
      - { id: api:notifier-send, sig: "POST /notifications", auth: "service token", idempotent: true }

messages:
  - id: msg:product-published
    name: product.published
    version: v1
    topic: st:catalog-events
    payload: sch:product-published-v1
    producer: svc:pim
    consumers: [svc:catalog-api, svc:translation-hub, svc:pricing, svc:search-indexer]
    key: sku
    semantics: "At least once. The whole product every time."
  - id: msg:price-published
    name: price.published
    version: v1
    topic: st:price-events
    payload: sch:price-published-v1
    producer: svc:pricing
    consumers: [svc:search-indexer, svc:storefront-bff]
    key: "sku, country"
    semantics: "At least once. The BFF keeps a 60-second cache."
  - id: msg:order-placed
    name: order.placed
    version: v1
    topic: st:order-events
    payload: sch:order-placed-v1
    producer: svc:order-capture
    consumers: [svc:allocation, svc:oms, svc:notifier, svc:financing-gateway]
    key: order_id
    semantics: "At least once from an outbox."
  - id: msg:stock-changed
    name: stock.changed
    version: v1
    topic: st:fulfilment-events
    payload: sch:stock-changed-v1
    producer: svc:wms
    consumers: [svc:search-indexer, svc:storefront-bff]
    semantics: "At least once per SKU and FC; the indexer ORs them into one `in_stock`."
  - id: msg:shipment-dispatched
    name: shipment.dispatched
    version: v1
    topic: st:fulfilment-events
    payload: sch:shipment-dispatched-v1
    producer: svc:wms
    consumers: [svc:oms, svc:notifier]
    semantics: "Once per shipment when the carrier scans it."

# ─────────────────────────────────────────────── chapter 3: How it runs today
flows:
  - id: flow:create-product
    name: Create and publish a product
    actor: Category manager
    trigger: "Mette saves a new product in the PIM editor."
    outcome: "The product is complete, translated into three locales, and every downstream copy knows about it."
    steps:
      - id: flow:create-product#save
        from: svc:pim-admin
        to: svc:pim
        via: api:pim-save-product
        action: Save the product
        screen: scr:pim-product-editor#attributes
        logic: "Writes the attributes. `lead_time_text` is a free-text field the manager types by hand."
        writes: [sch:product]
      - id: flow:create-product#enrich
        from: svc:pim
        to: svc:enrichment
        via: internal
        action: Check completeness
        logic: "Runs the completeness rules; sets `publishable` when weight, dimensions, images and hazard class are present."
        reads: [sch:product]
        writes: [sch:product]
        fails: "The editor shows the missing attributes; nothing is published."
      - id: flow:create-product#publish
        from: svc:pim
        to: st:catalog-events
        via: msg:product-published
        action: Announce the product
        reads: [sch:product]
      - id: flow:create-product#project
        from: st:catalog-events
        to: svc:catalog-api
        via: msg:product-published
        action: Update the read copy
        writes: [sch:catalog-product]
      - id: flow:create-product#translate
        from: st:catalog-events
        to: svc:translation-hub
        via: msg:product-published
        action: Create translation jobs
        logic: "One job per locale for every text attribute that changed, including `lead_time_text`."
        writes: [sch:product-translation]
      - id: flow:create-product#vendor
        from: svc:translation-hub
        to: svc:translation-vendor
        via: api:vendor-translate
        action: Send to LinguaCloud
        logic: "Machine translation now; human review within 24 hours updates the row to `reviewed`."
        fails: "The job stays `pending` and is retried hourly; the storefront falls back to German."
  - id: flow:price-product
    name: Price a product
    actor: Pricing analyst
    trigger: "A product is published, or an analyst changes a rule."
    outcome: "Every country has a list price for the SKU and everyone who shows a price knows it."
    steps:
      - id: flow:price-product#rule
        from: svc:price-rules-admin
        to: svc:pricing
        via: api:pricing-set-rule
        action: Set the price or rule
        screen: scr:price-rules-console#rules
        writes: [sch:price]
      - id: flow:price-product#from-catalog
        from: st:catalog-events
        to: svc:pricing
        via: msg:product-published
        action: Price a new SKU from its category rule
        writes: [sch:price]
      - id: flow:price-product#publish
        from: svc:pricing
        to: st:price-events
        via: msg:price-published
        action: Announce the price
        reads: [sch:price]
  - id: flow:index-product
    name: Index a product for search
    actor: System
    trigger: "A product, price or stock event arrives."
    outcome: "The search document for each locale is current."
    steps:
      - id: flow:index-product#product
        from: st:catalog-events
        to: svc:search-indexer
        via: msg:product-published
        action: Take the product
        writes: [sch:search-document]
      - id: flow:index-product#price
        from: st:price-events
        to: svc:search-indexer
        via: msg:price-published
        action: Take the price
        writes: [sch:search-document]
      - id: flow:index-product#stock
        from: st:fulfilment-events
        to: svc:search-indexer
        via: msg:stock-changed
        action: Take stock
        logic: "`in_stock` is true if any FC has stock. The indexer does not know which."
        writes: [sch:search-document]
  - id: flow:browse-product
    name: Look at a product
    actor: Shopper
    trigger: "The shopper opens a product page."
    outcome: "The shopper sees the product, its price and *Delivery 3–5 working days*."
    steps:
      - id: flow:browse-product#open
        from: svc:storefront-web
        to: svc:storefront-bff
        via: api:bff-product
        action: Ask for the product
        screen: scr:pdp
      - id: flow:browse-product#catalog
        from: svc:storefront-bff
        to: svc:catalog-api
        via: api:catalog-get-product
        action: Read the product
        reads: [sch:catalog-product]
      - id: flow:browse-product#price
        from: svc:storefront-bff
        to: svc:pricing
        via: api:pricing-get-price
        action: Read the price
        logic: "Cached 60 seconds per SKU and country."
        reads: [sch:price]
      - id: flow:browse-product#render
        from: svc:storefront-bff
        to: svc:storefront-web
        via: internal
        action: Render the page
        screen: scr:pdp#delivery
        logic: "`lead_time_text` is shown as-is under the price. The price excludes shipping."
        reads: [sch:product-view]
  - id: flow:add-to-cart
    name: Add to cart
    actor: Shopper
    trigger: "The shopper presses **Add to cart**."
    outcome: "The cart holds the line and shows a subtotal."
    steps:
      - id: flow:add-to-cart#press
        from: svc:storefront-web
        to: svc:storefront-bff
        via: api:bff-add-to-cart
        action: Add the line
        screen: scr:pdp#add-to-cart
      - id: flow:add-to-cart#cart
        from: svc:storefront-bff
        to: svc:cart
        via: api:cart-add-line
        action: Store the line
        logic: "Re-reads the price so the cart never trusts the page."
        writes: [sch:cart]
      - id: flow:add-to-cart#show
        from: svc:storefront-bff
        to: svc:storefront-web
        via: internal
        action: Show the cart
        screen: scr:cart#summary
        logic: "The cart shows the subtotal and *Shipping calculated at checkout*."
  - id: flow:checkout
    name: Check out and pay
    actor: Shopper
    trigger: "The shopper presses **Checkout**."
    outcome: "An order exists, is paid or financed, and the shopper has a confirmation email."
    steps:
      - id: flow:checkout#address
        from: svc:storefront-web
        to: svc:storefront-bff
        via: api:bff-checkout-step
        action: Give the address
        screen: scr:checkout-delivery#address
      - id: flow:checkout#session
        from: svc:storefront-bff
        to: svc:checkout
        via: api:checkout-step
        action: Store the address
        logic: "Country comes from the address. `shipping_cents` is set to the constant here."
        writes: [sch:checkout-session]
      - id: flow:checkout#delivery
        from: svc:checkout
        to: svc:storefront-web
        via: internal
        action: Show delivery
        screen: scr:checkout-delivery#delivery-option
        logic: "One option: *Standard · 3–5 working days · 4.95*. `shipping_cents` is the constant 495, whatever the country or cart."
      - id: flow:checkout#quote
        from: svc:checkout
        to: svc:financing-gateway
        via: api:financing-quote
        action: Ask for financing quotes
        logic: "For carts above 100 in DE/NL/SE. The amount quoted is the **subtotal**, not the total."
        writes: [sch:financing-quote]
        fails: "The payment step shows card only."
      - id: flow:checkout#partner-quote
        from: svc:financing-gateway
        to: svc:paylater-partner
        via: api:nordbank-quote
        action: Get the pay-later offer
        logic: "Nordbank returns the instalment plan for the amount. Fjordbank ([[api:fjordbank-quote]]) is asked above 500."
      - id: flow:checkout#pay
        from: svc:storefront-web
        to: svc:storefront-bff
        via: api:bff-place-order
        action: Choose how to pay and place the order
        screen: scr:checkout-payment#pay
      - id: flow:checkout#place
        from: svc:storefront-bff
        to: svc:checkout
        via: api:checkout-place
        action: Place the order
        logic: "Card: authorise the total with Payments. Financing: confirm the quote for the subtotal, and authorise the **shipping on the card** separately. See [[sc:tomas-paylater]]."
      - id: flow:checkout#authorise
        from: svc:checkout
        to: svc:payments
        via: api:payments-authorise
        action: Authorise the card
        writes: [sch:payment]
        fails: "Checkout shows *Payment declined* and stays on the payment step."
      - id: flow:checkout#psp
        from: svc:payments
        to: svc:psp
        via: api:psp-authorise
        action: Authorise with Nordpay
      - id: flow:checkout#confirm-loan
        from: svc:checkout
        to: svc:financing-gateway
        via: api:financing-confirm
        action: Confirm the loan
        logic: "Only when the shopper chose financing."
        writes: [sch:financing-quote]
      - id: flow:checkout#create
        from: svc:checkout
        to: svc:order-capture
        via: api:orders-create
        action: Create the order
        logic: "Copies the session into an order and its lines in one transaction."
        writes: [sch:order, sch:order-line]
        fails: "Checkout voids the authorisation and shows *Something went wrong*."
      - id: flow:checkout#publish
        from: svc:order-capture
        to: st:order-events
        via: msg:order-placed
        action: Announce the order
        reads: [sch:order, sch:order-line]
      - id: flow:checkout#capture
        from: svc:checkout
        to: svc:payments
        via: api:payments-capture
        action: Capture the payment
        logic: "Captured at order creation, not at dispatch ([[dec:capture-at-order]] explains why that stays)."
        writes: [sch:payment]
      - id: flow:checkout#confirmation
        from: st:order-events
        to: svc:notifier
        via: msg:order-placed
        action: Send the confirmation email
        screen: scr:email-order-confirmation
        logic: "The email says *Delivery 3–5 working days*, from the template, not the product."
  - id: flow:fulfil-order
    name: Fulfil an order
    actor: System
    trigger: "`order.placed` arrives at the allocation worker."
    outcome: "A warehouse ships the order and the carrier has it."
    steps:
      - id: flow:fulfil-order#allocate
        from: st:order-events
        to: svc:allocation
        via: msg:order-placed
        action: Choose a warehouse per line
        logic: "Nearest FC with stock; else any FC with stock; else backorder. This is the first moment anyone knows the real lead time."
        reads: [sch:stock-level]
      - id: flow:fulfil-order#shipment
        from: svc:allocation
        to: svc:wms
        via: api:wms-create-shipment
        action: Create the shipment
        writes: [sch:shipment]
        fails: "Retried; after an hour the order is flagged for Fulfilment ops."
      - id: flow:fulfil-order#update-order
        from: svc:allocation
        to: svc:oms
        via: api:oms-allocate
        action: Mark the order allocated
        logic: "Writes the FC onto each line and sets status `allocated`."
        writes: [sch:order, sch:order-line]
      - id: flow:fulfil-order#pick
        from: svc:wms
        to: svc:wms
        via: internal
        action: Pick and pack in a wave
        logic: "Waves run at 10:00 and 14:00; the carrier collects at 16:00. Orders captured after 14:00 ship the next working day."
        writes: [sch:shipment]
      - id: flow:fulfil-order#book
        from: svc:wms
        to: svc:carrier-gateway
        via: api:carrier-book
        action: Book the parcel
      - id: flow:fulfil-order#carrier
        from: svc:carrier-gateway
        to: svc:carrier
        via: api:nordexpress-book
        action: Book with NordExpress
        fails: "The shipment stays `picked` and ops rebook by hand."
      - id: flow:fulfil-order#dispatched
        from: svc:wms
        to: st:fulfilment-events
        via: msg:shipment-dispatched
        action: Announce dispatch
      - id: flow:fulfil-order#shipped-email
        from: st:fulfilment-events
        to: svc:notifier
        via: msg:shipment-dispatched
        action: Send the shipped email
        logic: "With the carrier's tracking link. The first time the shopper sees a date is the carrier's."
      - id: flow:fulfil-order#oms-shipped
        from: st:fulfilment-events
        to: svc:oms
        via: msg:shipment-dispatched
        action: Mark the order shipped
        writes: [sch:order]
  - id: flow:track-order
    name: Track an order
    actor: Shopper
    trigger: "The shopper opens *Where is my order*."
    outcome: "The shopper sees the status and, once shipped, the carrier's tracking link."
    steps:
      - id: flow:track-order#open
        from: svc:storefront-web
        to: svc:storefront-bff
        via: api:bff-order
        action: Look up the order
        screen: scr:order-tracking#lookup
      - id: flow:track-order#oms
        from: svc:storefront-bff
        to: svc:oms
        via: api:oms-get-order
        action: Read the order
        reads: [sch:order, sch:order-line]
      - id: flow:track-order#show
        from: svc:storefront-bff
        to: svc:storefront-web
        via: internal
        action: Show the status
        screen: scr:order-tracking#status
        logic: "Status and lines. No date until the carrier has the parcel, so most shoppers contact us instead."
        reads: [sch:order-view]
  - id: flow:sync-stock
    name: Keep stock in sync
    actor: System
    trigger: "Stock moves in a warehouse."
    outcome: "Search and the storefront know whether a SKU is in stock."
    steps:
      - id: flow:sync-stock#publish
        from: svc:wms
        to: st:fulfilment-events
        via: msg:stock-changed
        action: Announce the change
        reads: [sch:stock-level]
      - id: flow:sync-stock#bff
        from: st:fulfilment-events
        to: svc:storefront-bff
        via: msg:stock-changed
        action: Update the in-stock flag
        logic: "One boolean per SKU in the BFF's cache. Which FC has it is lost here."

screens:
  - id: scr:pim-product-editor
    name: Product editor
    service: svc:pim-admin
    kind: page
    route: /products/{sku}
    device: desktop
