# ─────────────────────────────────────────────── chapters 4–5: What's new and what changes
changes:
  # ── Fulfilment: the promise is created
  - id: chg:promise-service
    title: "Fulfilment runs a Promise service that computes a delivery date per SKU and region"
    why: >-
      Only Fulfilment knows stock per FC, the cutoffs and the carrier lead times ([[flow:fulfil-order#allocate]]).
      Today that knowledge is used *after* the order. [[dec:fulfilment-owns-promise]] puts it in one service that
      answers *when would this arrive* before anyone buys. The carrier lead-time CSV becomes data it owns.
    decisions: [dec:fulfilment-owns-promise, dec:region-not-postcode, dec:promise-is-a-date]
    rollout: >-
      Deploy behind `promise_service`; compute for all SKUs nightly and on every `stock.changed` from day one,
      but publish nothing until [[tst:promise-berlin-malmo]] passes against six weeks of real orders. Then open
      the API and the event in the same release.
    ops:
      - add: service
        value:
          id: svc:promise
          name: Promise
          team: team:fulfilment
          system: sys:fulfilment
          kind: service
          tech: "Python · FastAPI · Kafka consumer"
          does: "Computes and publishes the delivery promise per SKU and region"
          summary: >-
            Listens to stock, holds the cutoffs and carrier lead times, and keeps one promise per SKU and region
            in [[st:promise-db]]. Answers lookups and publishes `promise.changed` when a date moves.
      - add: store
        value: { id: st:promise-db, name: promise-db, kind: database, tech: "Postgres 15", owner: svc:promise, does: "Promises, cutoffs and lead times" }
      - add: schema
        value:
          id: sch:delivery-promise
          name: DeliveryPromise
          kind: record
          store: st:promise-db
          summary: "The current promise for one SKU in one region, and how it was computed."
          fields:
            - { name: sku, type: string, required: true, key: true, ref: "sch:product#sku" }
            - { name: region, type: "enum(DE-N, DE-S, NL, FR, SE-S, SE-N)", required: true, key: true }
            - { name: promised_date, type: date, required: true, note: "A date, not a range ([[dec:promise-is-a-date]])." }
            - { name: order_by, type: timestamptz, required: true, note: "Order before this to get `promised_date`." }
            - { name: fc, type: "enum(berlin, malmo, lyon)", required: true, note: "The FC the promise assumes." }
            - { name: carrier_days, type: int, required: true }
            - { name: confidence, type: "enum(high, low)", required: true, note: "Low when stock is under 3 or the FC has a backlog." }
            - { name: computed_at, type: timestamptz, required: true }
      - add: schema
        value:
          id: sch:promise-changed-v1
          name: promise.changed v1
          kind: payload
          summary: "One SKU, all regions, whenever any date moves."
          fields:
            - { name: sku, type: string, required: true }
            - { name: promises, type: "RegionPromise[]", required: true, note: "region, promised_date, order_by, confidence" }
            - { name: computed_at, type: timestamptz, required: true }
      - add: schema
        value:
          id: sch:cutoff
          name: Cutoff
          kind: record
          store: st:promise-db
          fields:
            - { name: fc, type: string, required: true, key: true }
            - { name: weekday, type: int, required: true, key: true }
            - { name: cutoff_local, type: time, required: true, note: "14:00 everywhere today; Malmö moves to 12:00 in winter." }
      - add: interface
        value:
          id: if:promise-rest
          service: svc:promise
          protocol: rest
          summary: "Lookups for the storefront, checkout and the PIM."
          endpoints:
            - id: api:promise-get
              sig: "GET /promises/{sku}?region="
              response: sch:delivery-promise
              auth: "service token"
              idempotent: true
              errors:
                - { status: 404, code: unknown_sku, when: "Fulfilment has no stock record for the SKU" }
                - { status: 422, code: unknown_region, when: "The region is not one of the six" }
            - id: api:promise-for-cart
              sig: "POST /promises/cart"
              request: sch:cart
              response: sch:delivery-promise
              auth: "service token"
              idempotent: true
              errors:
                - { status: 400, code: empty_cart, when: "The cart has no lines" }
                - { status: 404, code: unknown_sku, when: "A line's SKU is unknown to Fulfilment" }
                - { status: 422, code: unknown_region, when: "The region is not one of the six" }
      - add: message
        value:
          id: msg:promise-changed
          name: promise.changed
          version: v1
          topic: st:fulfilment-events
          payload: sch:promise-changed-v1
          producer: svc:promise
          consumers: [svc:pim, svc:search-indexer, svc:storefront-bff]
          key: sku
          semantics: "At least once, compacted. Consumers keep the latest `computed_at`."
      - add: flow
        value:
          id: flow:compute-promise
          name: Compute a promise
          actor: System
          trigger: "Stock changes, a cutoff passes, or the nightly run starts."
          outcome: "Every SKU has a dated promise per region, and anyone who shows one hears when it moves."
          steps:
            - id: flow:compute-promise#stock
              from: st:fulfilment-events
              to: svc:promise
              via: msg:stock-changed
              action: Take stock per FC
              logic: "Keeps `available` per SKU and FC. Zero everywhere means no promise."
              reads: [sch:stock-changed-v1]
            - id: flow:compute-promise#lead-times
              from: svc:promise
              to: svc:carrier-gateway
              via: api:carrier-lead-time
              action: Read carrier days FC → region
              logic: "Cached a day. The CSV moves into the gateway's database as part of [[chg:carrier-lead-time-api]]."
              reads: [sch:carrier-lead-time]
            - id: flow:compute-promise#compute
              from: svc:promise
              to: svc:promise
              via: internal
              action: Compute per region
              logic: >-
                For each region: the FC with stock that gives the earliest date wins. Date = next cutoff at that
                FC (skipping its non-working days) + carrier working days to the region. `confidence: low` when
                available < 3 or the FC's open-shipment backlog exceeds a day.
              reads: [sch:cutoff]
              writes: [sch:delivery-promise]
            - id: flow:compute-promise#publish
              from: svc:promise
              to: st:fulfilment-events
              via: msg:promise-changed
              action: Publish when a date moved
              logic: "Only when `promised_date` or `confidence` changed for at least one region."
              reads: [sch:delivery-promise]
      - modify: msg:stock-changed
        append: { consumers: [svc:promise] }
      - modify: svc:carrier-gateway
        set:
          summary: "One adapter per carrier. Holds the lead-time and cost tables in its own database and serves them over the API; the quarterly CSV is history."
  - id: chg:carrier-lead-time-api
    title: "The carrier gateway serves lead times and costs from a table, not a CSV in the repo"
    why: "Promise and Pricing both need the carrier tables ([[flow:compute-promise#lead-times]], [[chg:pricing-shipping-component]]). A CSV in a repo cannot be read by another service or changed without a deploy."
    rollout: "Load the CSV into the table; serve both for one sprint; delete the CSV when the Promise service reads the API."
    ops:
      - modify: sch:carrier-lead-time
        set:
          kind: record
          store: st:wms-db
          summary: "Lead times and costs per carrier, FC and region, in the fulfilment database. Updated through an admin endpoint when a carrier publishes new rates."
      - add: field
        into: sch:carrier-lead-time
        value: { name: valid_from, type: date, required: true }
      - add: endpoint
        into: if:carrier-gateway-rest
        value: { id: api:carrier-set-lead-time, sig: "PUT /lead-times", request: sch:carrier-lead-time, auth: "staff SSO", idempotent: true }
  # ── Catalog: the promise lands on the product
  - id: chg:pim-promise-attribute
    title: "The PIM carries the promise per region as a read-only attribute, and deprecates the typed lead time"
    why: >-
      Downstream copies (the catalogue read API, search, the storefront) all follow `product.published`
      ([[flow:create-product#publish]]). If the promise is on the product, the event we already publish carries
      it. The hand-typed `lead_time_text` is the old system and is removed ([[dec:retire-lead-time-text]]).
    decisions: [dec:retire-lead-time-text]
    rollout: >-
      Add the attribute and the consumer first, publishing `product.published` v2 **and** v1 side by side.
      Hide the lead-time field in the editor once v2 is everywhere; drop the column after M4.
    ops:
      - add: field
        into: sch:product
        value: { name: delivery_promise, type: "RegionPromise[]", note: "Read-only; written by the `promise.changed` consumer. Per region: date, order_by, confidence." }
      - deprecate: "sch:product#lead_time_text"
        replaced_by: "sch:product#delivery_promise"
      - add: schema
        value:
          id: sch:product-published-v2
          name: product.published v2
          kind: payload
          summary: "v1 plus the promise per region; `lead_time_text` gone."
          fields:
            - { name: sku, type: string, required: true }
            - { name: name, type: string, required: true }
            - { name: weight_g, type: int, required: true, note: "Required now: Pricing needs it ([[chg:enrichment-weight-required]])." }
            - { name: delivery_promise, type: "RegionPromise[]", required: true }
            - { name: publishable, type: bool, required: true }
            - { name: published_at, type: timestamptz, required: true }
      - add: message
        value:
          id: msg:product-published-v2
          name: product.published
          version: v2
          topic: st:catalog-events
          payload: sch:product-published-v2
          producer: svc:pim
          consumers: [svc:catalog-api, svc:translation-hub, svc:pricing, svc:search-indexer]
          key: sku
          supersedes: msg:product-published
          semantics: "As v1. Dual-published with v1 until M4."
      - deprecate: msg:product-published
        replaced_by: msg:product-published-v2
      - deprecate: sch:product-published-v1
        replaced_by: sch:product-published-v2
      - add: flow
        value:
          id: flow:propagate-promise
          name: Carry a promise to the product and the shelf
          actor: System
          trigger: "`promise.changed` for a SKU."
          outcome: "The PIM, the catalog read copy, search and the storefront all show the new date within a minute."
          steps:
            - id: flow:propagate-promise#pim
              from: st:fulfilment-events
              to: svc:pim
              via: msg:promise-changed
              action: Write the promise onto the product
              logic: "Idempotent on `computed_at`; a stale event is dropped."
              writes: ["sch:product#delivery_promise"]
            - id: flow:propagate-promise#republish
              from: svc:pim
              to: st:catalog-events
              via: msg:product-published-v2
              action: Republish the product
              logic: "A promise change is a product change. Translation ignores events where only the promise moved ([[chg:localise-promise-copy]])."
              reads: [sch:product]
            - id: flow:propagate-promise#catalog
              from: st:catalog-events
              to: svc:catalog-api
              via: msg:product-published-v2
              action: Update the read copy
              beat: "The republish fans out"
              writes: [sch:catalog-product]
            - id: flow:propagate-promise#search
              from: st:catalog-events
              to: svc:search-indexer
              via: msg:product-published-v2
              action: Update the search document
              beat: "The republish fans out"
              logic: "Writes `promise_days` per region so a facet can sort on it ([[chg:search-promise-facet]])."
              writes: [sch:search-document]
            - id: flow:propagate-promise#translation
              from: st:catalog-events
              to: svc:translation-hub
              via: msg:product-published-v2
              action: Skip a promise-only change
              beat: "The republish fans out"
              logic: "Compares the text attributes with the last event. Only the promise moved, so no translation job is created."
            - id: flow:propagate-promise#bff
              from: st:fulfilment-events
              to: svc:storefront-bff
              via: msg:promise-changed
              action: Refresh the BFF cache
              logic: "The BFF listens directly too, so a product page is never more than a minute behind the warehouse ([[dec:bff-reads-promise-directly]])."
      - modify: "flow:create-product#save"
        set:
          logic: "Writes the attributes. The lead-time field is gone; the editor shows the promise panel instead."
      - modify: "flow:create-product#publish"
        set:
          via: msg:product-published-v2
      - modify: "flow:create-product#project"
        set:
          via: msg:product-published-v2
      - add: field
        into: sch:catalog-product
        value: { name: delivery_promise, type: "RegionPromise[]", note: "Copied from `product.published` v2." }
      - modify: scr:pim-product-editor
        set:
          summary: "Where a category manager creates and enriches a product. The promise is shown, not typed."
          image: assets/pim-product-editor-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF1pimEditor/PIM-editor?node-id=12-440"
      - remove: "scr:pim-product-editor#lead-time"
      - add: region
        into: scr:pim-product-editor
        value:
          id: scr:pim-product-editor#promise
          name: Delivery promise panel
          shows: "Read-only: one row per region with the date, the FC it assumes and the confidence. *FR: no stock in Lyon* when there is none."
          reads: ["sch:product#delivery_promise"]
          at: { x: 24, y: 82, w: 50, h: 14 }
      - modify: "scr:pim-product-editor#attributes"
        set:
          shows: "Name, weight (now required), dimensions, hazard class, images, with the completeness checklist beside them."
  - id: chg:enrichment-weight-required
    title: "Enrichment refuses to publish a product without a weight"
    why: "Shipping cost per region needs the weight ([[chg:pricing-shipping-component]]). 11% of live products lack one."
    rollout: "Report-only for two weeks (list in #team-catalog), then enforce. A one-off script fills weights from the supplier feed where it can."
    ops:
      - modify: svc:enrichment
        set:
          summary: "Runs the completeness rules after every save. Weight is now required alongside dimensions, images and hazard class."
      - modify: "sch:product#weight_g"
        set:
          required: true
          note: "Required for publishing: Pricing computes the shipping component from it."
      - modify: "flow:create-product#enrich"
        set:
          logic: "Runs the completeness rules; sets `publishable` only when weight, dimensions, images and hazard class are present."
  # ── Content: nothing to translate, one phrase to localise
  - id: chg:localise-promise-copy
    title: "Translation stops translating lead times; the storefront formats the promise per locale"
    why: >-
      `lead_time_text` was translated by hand per locale and went stale ([[sch:product-translation#lead_time_text]]).
      A date needs formatting, not translation: *Get it by Thu 8 Oct* / *Levering do 8 okt* / *Få det tors 8 okt*.
    rollout: "Translation ignores `product.published` v2 events where only the promise changed. Copy strings land in the storefront's message bundles."
    ops:
      - deprecate: "sch:product-translation#lead_time_text"
      - modify: "flow:create-product#translate"
        set:
          via: msg:product-published-v2
          logic: "One job per locale for every text attribute that changed. Promise-only republishes are skipped."
      - modify: svc:translation-hub
        set:
          summary: "Turns a published product into translation jobs per locale, calls the vendor, and publishes the translations back. Skips republishes that only moved the promise."
  # ── Pricing: shipping goes into the price
  - id: chg:pricing-shipping-component
    title: "Pricing adds a shipping component per region so the display price includes delivery"
    why: >-
      The 4.95 constant in Checkout ([[sch:checkout-session#shipping_cents]]) is wrong in both directions: a tent to
      northern Sweden costs us 19, a pair of socks to Berlin costs 3. [[dec:shipping-in-display-price]] moves
      shipping into the price the shopper sees first, computed from weight, region and the carrier cost table.
    decisions: [dec:shipping-in-display-price, dec:free-shipping-threshold]
    rollout: >-
      Compute and store the component for every SKU and region without showing it (M1). Switch the storefront to
      the display price country by country in M2, Sweden first where the gap is largest. Checkout reads the
      component from Pricing and sets its constant to zero in the same release.
    ops:
      - add: schema
        value:
          id: sch:shipping-rule
          name: ShippingRule
          kind: record
          store: st:pricing-db
          summary: "How the shipping component is computed per region: weight bands and the free-shipping threshold."
          fields:
            - { name: region, type: "enum(DE-N, DE-S, NL, FR, SE-S, SE-N)", required: true }
            - { name: weight_band_g, type: "int[]", required: true, note: "Upper bounds, e.g. 500, 2000, 10000, 30000." }
            - { name: component_cents, type: "int[]", required: true, note: "One per band, from the carrier cost table plus packaging." }
            - { name: free_above_cents, type: int, note: "Cart subtotal above which the component is zero ([[dec:free-shipping-threshold]])." }
      - add: field
        into: sch:price
        value: { name: shipping_component_cents, type: "map<region,int>", required: true, note: "Per region, from the rule and the product's weight." }
      - add: field
        into: sch:price
        value: { name: display_cents, type: "map<region,int>", required: true, note: "List (or promo) plus the shipping component. What the product page shows." }
      - add: field
        into: sch:price-published-v1
        value: { name: display_cents, type: "map<region,int>", note: "Optional until every consumer reads it." }
      - add: endpoint
        into: if:pricing-rest
        value:
          id: api:pricing-shipping-component
          sig: "GET /shipping/{sku}?region=&cart_subtotal="
          response: sch:price
          auth: "service token"
          idempotent: true
          summary: "Checkout's view: the component after the free-shipping threshold."
          errors:
            - { status: 404, code: unknown_sku, when: "Pricing has no price row for the SKU" }
            - { status: 409, code: weight_missing, when: "The product has no weight yet, so no band applies; Checkout falls back to the flat 4.95 until enrichment enforces weight" }
            - { status: 422, code: unknown_region, when: "The region is not one of the six" }
      - add: step
        into: flow:price-product
        after: "flow:price-product#from-catalog"
        value:
          id: flow:price-product#shipping
          from: svc:pricing
          to: svc:pricing
          via: internal
          action: Compute the shipping component per region
          logic: "Weight from `product.published` v2 → band → component per region. Recomputed when the rule or the weight changes."
          reads: [sch:shipping-rule, "sch:product-published-v2#weight_g"]
          writes: ["sch:price#shipping_component_cents", "sch:price#display_cents"]
      - modify: "flow:price-product#from-catalog"
        set:
          via: msg:product-published-v2
      - modify: scr:price-rules-console
        set:
          image: assets/price-rules-console-tobe.svg
          mockup: mockups/walking.html
          summary: "Analysts set list prices, per-country rules and now the shipping bands per region."
      - add: region
        into: scr:price-rules-console
        value:
          id: scr:price-rules-console#shipping-rules
          name: Shipping rules
          shows: "A second table: region, weight bands, component per band, free-shipping threshold. Carrier cost shown beside each band for comparison."
          reads: [sch:shipping-rule]
          at: { x: 2, y: 62, w: 96, h: 32 }
      - modify: "scr:price-rules-console#rules"
        set:
          at: { x: 2, y: 18, w: 96, h: 42 }
  # ── Discovery
  - id: chg:search-promise-facet
    title: "Search indexes the promise per region and offers a *Delivery by* facet"
    why: "Shoppers filter by *arrives by Friday* on competitor sites; our index does not know the date ([[sch:search-document]])."
    rollout: "Index first (M2); the facet ships in M4 after the storefront's PDP and cart."
    ops:
      - add: field
        into: sch:search-document
        value: { name: promise_days, type: "map<region,int>", note: "Working days to the promised date, per region. Empty when there is no promise." }
      - deprecate: "sch:search-document#lead_time_text"
        replaced_by: "sch:search-document#promise_days"
      - modify: "flow:index-product#product"
        set:
          via: msg:product-published-v2
          logic: "Takes name, price fields and `delivery_promise`, folded into `promise_days` per region."
      - modify: scr:search-results
        set:
          image: assets/search-results-tobe.svg
          mockup: mockups/walking.html
          summary: "Listing with facets, including *Delivery by*. Each tile shows its promise."
      - add: region
        into: scr:search-results
        value:
          id: scr:search-results#delivery-facet
          name: Delivery by facet
          shows: "*Tomorrow · This week · Any time*, for the shopper's region."
          reads: ["sch:search-document#promise_days"]
          at: { x: 2, y: 64, w: 20, h: 14 }
      - modify: "scr:search-results#tiles"
        set:
          shows: "Image, name, display price (shipping included) and *Get it by Thu*."
  # ── Storefront
  - id: chg:pdp-delivery-promise
    title: "The product page shows the dated promise and the price with shipping included"
    why: >-
      This is what the June test did by hand and lifted add-to-cart 6.8% ([[sc:anna-malmo]]). The BFF gets the
      promise from its own cache ([[dec:bff-reads-promise-directly]]) and the display price from Pricing.
    decisions: [dec:bff-reads-promise-directly, dec:shipping-in-display-price]
    rollout: "Feature flag `pdp_promise` per country: SE first (M2), then DE, NL, FR (M4). The old delivery line stays for countries not yet switched."
    ops:
      - add: field
        into: sch:product-view
        value: { name: delivery_promise_date, type: date, note: "For the shopper's region. With no promise the page shows *Delivery date on request*." }
      - add: field
        into: sch:product-view
        value: { name: order_by, type: timestamptz }
      - add: field
        into: sch:product-view
        value: { name: promise_confidence, type: "enum(high, low)" }
      - modify: "sch:product-view#price"
        set:
          note: "The display price for the shopper's region: list or promo plus the shipping component. Shipping is in it."
      - deprecate: "sch:product-view#lead_time_text"
        replaced_by: "sch:product-view#delivery_promise_date"
      - add: step
        into: flow:browse-product
        after: "flow:browse-product#price"
        value:
          id: flow:browse-product#promise
          from: svc:storefront-bff
          to: svc:promise
          via: api:promise-get
          action: Read the promise
          logic: "Only on a cache miss; `promise.changed` keeps the cache warm. Region from the shopper's IP or saved address."
          reads: [sch:delivery-promise]
          fails: "The page shows the price with shipping and *Delivery date on request*; never a stale date."
      - modify: "flow:browse-product#price"
        set:
          logic: "Reads `display_cents` for the shopper's region. Cached 60 seconds per SKU and region."
      - modify: "flow:browse-product#render"
        set:
          logic: "Shows the display price and *Get it by Thu 8 Oct · order by 14:00 Mon*, formatted per locale."
      - modify: scr:pdp
        set:
          summary: "The product page. Price with shipping included; a dated promise under it."
          image: assets/pdp-tobe.svg
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=88-1201"
          mockup: mockups/walking.html
      - modify: "scr:pdp#price"
        set:
          shows: "The display price for the shopper's region, with *incl. shipping* beside it."
      - modify: "scr:pdp#delivery"
        set:
          shows: "*Get it by Thu 8 Oct · order by 14:00 Mon*. Low confidence shows *Likely Thu 8 Oct*. No promise shows *Delivery date on request*."
          reads: ["sch:product-view#delivery_promise_date", "sch:product-view#order_by", "sch:product-view#promise_confidence"]
          at: { x: 55, y: 38, w: 43, h: 10 }
      - modify: "scr:pdp#add-to-cart"
        set:
          at: { x: 55, y: 50, w: 43, h: 14 }
  - id: chg:cart-shipping-and-promise
    title: "The cart shows one promise for the whole cart and no shipping line"
    why: "*Shipping calculated at checkout* is the surprise this plan removes. A cart with lines from two FCs arrives on the later date."
    decisions: [dec:one-promise-per-cart]
    rollout: "With `pdp_promise` per country."
    ops:
      - add: field
        into: sch:cart
        value: { name: promised_date, type: date, note: "The latest line promise for the cart's region ([[dec:one-promise-per-cart]])." }
      - add: field
        into: sch:cart
        value: { name: region, type: string, note: "From the shopper's saved address or IP; refined at checkout." }
      - add: step
        into: flow:add-to-cart
        after: "flow:add-to-cart#cart"
        value:
          id: flow:add-to-cart#promise
          from: svc:cart
          to: svc:promise
          via: api:promise-for-cart
          action: Promise for the whole cart
          logic: "Latest date across lines; a line with no promise leaves the cart without one."
          reads: [sch:delivery-promise]
      - add: step
        into: flow:add-to-cart
        after: "flow:add-to-cart#promise"
        value:
          id: flow:add-to-cart#store-promise
          from: svc:cart
          to: svc:cart
          via: internal
          action: Keep the cart's date
          writes: ["sch:cart#promised_date", "sch:cart#region"]
      - modify: "flow:add-to-cart#show"
        set:
          logic: "The cart shows the subtotal with shipping included and *Everything by Thu 8 Oct*."
      - modify: scr:cart
        set:
          summary: "Lines with their promises; one date for the cart; no shipping line."
          image: assets/cart-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=88-1402"
      - modify: "scr:cart#lines"
        set:
          shows: "Each line with image, name, qty, display price and its own *Get it by*."
      - modify: "scr:cart#summary"
        set:
          shows: "Total (shipping included), *Everything by Thu 8 Oct*, and the **Checkout** button. The *Shipping calculated at checkout* line is gone."
          reads: ["sch:cart#subtotal_cents", "sch:cart#promised_date"]
  # ── Checkout
  - id: chg:checkout-delivery-options
    title: "Checkout reads shipping from Pricing and shows the promise on the delivery step"
    why: "The delivery step is where 9.1% leave. It should confirm what the shopper already saw, not introduce a cost. `ShippingFlatCents` goes."
    rollout: "Behind `pdp_promise` per country; the constant is read as a fallback for countries not switched, then deleted in M4."
    ops:
      - modify: "sch:checkout-session#shipping_cents"
        set:
          note: "The sum of the lines' shipping components for the delivery region, after the free-shipping threshold. Zero when every line's display price already includes it; see [[dec:shipping-in-display-price]]."
      - add: field
        into: sch:checkout-session
        value: { name: promised_date, type: date, required: true, note: "Recomputed for the delivery address's region on the delivery step." }
      - add: field
        into: sch:checkout-session
        value: { name: region, type: "enum(DE-N, DE-S, NL, FR, SE-S, SE-N)", required: true }
      - add: step
        into: flow:checkout
        after: "flow:checkout#session"
        value:
          id: flow:checkout#region-promise
          from: svc:checkout
          to: svc:promise
          via: api:promise-for-cart
          action: Promise for the delivery region
          logic: "The address gives the region, which may differ from the cart's guess. If the date moves, the delivery step says so: *Delivery to Kiruna takes a day longer: Fri 9 Oct*."
          reads: [sch:delivery-promise]
          fails: "The step shows *Delivery date on request* and lets the shopper continue."
      - add: step
        into: flow:checkout
        after: "flow:checkout#region-promise"
        value:
          id: flow:checkout#shipping
          from: svc:checkout
          to: svc:pricing
          via: api:pricing-shipping-component
          action: Read the shipping component
          logic: "Per line for the region, after the free-shipping threshold. Replaces the constant."
          reads: [sch:price]
      - add: step
        into: flow:checkout
        after: "flow:checkout#shipping"
        value:
          id: flow:checkout#price-session
          from: svc:checkout
          to: svc:checkout
          via: internal
          action: Price the session for the region
          logic: "Writes the region, the promised date and the shipping component onto the session."
          writes: ["sch:checkout-session#region", "sch:checkout-session#promised_date", "sch:checkout-session#shipping_cents"]
      - modify: "flow:checkout#session"
        set:
          logic: "Country comes from the address. Shipping is no longer a constant; see the next steps."
      - modify: "flow:checkout#delivery"
        set:
          logic: "One option: *Standard · Get it by Thu 8 Oct · included*. The total matches the cart."
      - modify: svc:checkout
        set:
          summary: "Runs the checkout steps (address, delivery, payment), takes payment or financing, then creates the order. Shipping comes from Pricing per region."
      - modify: scr:checkout-delivery
        set:
          summary: "Address and the delivery option, now with the date the shopper already saw."
          image: assets/checkout-delivery-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=91-200"
      - modify: "scr:checkout-delivery#delivery-option"
        set:
          shows: "*Standard · Get it by Thu 8 Oct · included*. If the address changed the region: *Delivery to Kiruna takes a day longer: Fri 9 Oct*."
          reads: ["sch:checkout-session#promised_date", "sch:checkout-session#shipping_cents"]
      - modify: "scr:checkout-delivery#totals"
        set:
          shows: "Total, shipping included. The separate shipping row is gone."
  - id: chg:financing-includes-shipping
    title: "Financing quotes are for the full total, shipping included"
    why: "Tomas's 3 × 140.00 plus a 4.95 card charge ([[sc:tomas-paylater]]) is the top financing complaint. Both partners accept any amount; only our code splits it."
    decisions: [dec:financing-full-total]
    rollout: "Nordbank was given its contractual 30 days' notice on 26 Sep 2026 and Fjordbank needs none. Switch on with `pdp_promise` per country."
    ops:
      - modify: "sch:financing-quote#amount_cents"
        set:
          note: "The checkout total, shipping included ([[dec:financing-full-total]])."
      - modify: "flow:checkout#quote"
        set:
          logic: "For carts above 100 in DE/NL/SE. The amount quoted is the **total**, shipping included."
      - modify: "flow:checkout#place"
        set:
          logic: "Card: authorise the total with Payments. Financing: confirm the quote for the total. No separate card charge."
      - modify: scr:checkout-payment
        set:
          image: assets/checkout-payment-tobe.svg
          mockup: mockups/walking.html
          summary: "Card or a financing partner. The financing amount is the total."
      - modify: "scr:checkout-payment#financing-quote"
        set:
          shows: "*3 × 141.65 · nothing else to pay*. The small print about shipping is gone."
      - modify: svc:financing-gateway
        set:
          summary: "One adapter per partner. Quotes the full checkout total during checkout and confirms the loan after the order is captured."
  # ── Orders: the promise is kept
  - id: chg:order-carries-promise
    title: "The order and its lines carry the promised date, frozen at capture"
    why: "A promise that is not on the order cannot be kept, shown or measured. [[dec:promise-frozen-at-capture]]: it moves only on a slip."
    decisions: [dec:promise-frozen-at-capture]
    rollout: "Nullable columns, written from the checkout session. `order.placed` v2 dual-published until the OMS, allocation, the notifier and financing read it."
    ops:
      - add: field
        into: sch:order
        value: { name: promised_date, type: date, note: "Frozen at capture from the checkout session. Moves only through a slip." }
      - add: field
        into: sch:order
        value: { name: region, type: string }
      - add: field
        into: sch:order-line
        value: { name: promised_date, type: date, note: "Per line, so a two-FC order can slip one line." }
      - add: field
        into: sch:order-line
        value: { name: promised_fc, type: "enum(berlin, malmo, lyon)", note: "The FC the promise assumed. Allocation should honour it ([[chg:allocation-honours-promise]])." }
      - add: schema
        value:
          id: sch:order-placed-v2
          name: order.placed v2
          kind: payload
          summary: "v1 plus the promise per line and the region."
          fields:
            - { name: order_id, type: uuid, required: true }
            - { name: number, type: string, required: true }
            - { name: country, type: string, required: true }
            - { name: region, type: string, required: true }
            - { name: lines, type: "OrderLine[]", required: true, note: "Each with promised_date and promised_fc." }
            - { name: promised_date, type: date, required: true }
            - { name: payment_method, type: string, required: true }
            - { name: placed_at, type: timestamptz, required: true }
      - add: message
        value:
          id: msg:order-placed-v2
          name: order.placed
          version: v2
          topic: st:order-events
          payload: sch:order-placed-v2
          producer: svc:order-capture
          consumers: [svc:allocation, svc:oms, svc:notifier, svc:financing-gateway]
          key: order_id
          supersedes: msg:order-placed
          semantics: "As v1. Dual-published until M4."
      - deprecate: msg:order-placed
        replaced_by: msg:order-placed-v2
      - deprecate: sch:order-placed-v1
        replaced_by: sch:order-placed-v2
      - modify: "flow:checkout#create"
        set:
          logic: "Copies the session into an order and its lines in one transaction, including the promised date per line and the region."
      - modify: "flow:checkout#publish"
        set:
          via: msg:order-placed-v2
      - modify: "flow:checkout#confirmation"
        set:
          via: msg:order-placed-v2
          logic: "The email says *Get it by Thu 8 Oct*, from the order."
      - modify: "flow:fulfil-order#allocate"
        set:
          via: msg:order-placed-v2
      - modify: scr:email-order-confirmation
        set:
          image: assets/email-order-confirmation-tobe.svg
          mockup: mockups/walking.html
          summary: "Sent on `order.placed`. The delivery line is the order's promise."
      - modify: "scr:email-order-confirmation#delivery"
        set:
          shows: "*Get it by Thu 8 Oct.* From `promised_date`, formatted per locale."
          reads: ["sch:order#promised_date"]
  - id: chg:allocation-honours-promise
    title: "Allocation ships from the FC the promise assumed, and publishes a slip when it cannot"
    why: >-
      Today allocation picks the nearest FC with stock ([[flow:fulfil-order#allocate]]). If the promise assumed
      Berlin and Berlin sold out in the meantime, shipping from Lyon is later than promised. The worker must know
      and say so.
    decisions: [dec:promise-frozen-at-capture]
    rollout: "Shadow mode first: log what the worker *would* do against the promise for two weeks, then enforce."
    ops:
      - modify: "flow:fulfil-order#allocate"
        set:
          logic: "Prefer `promised_fc` if it still has stock. Otherwise the FC giving the earliest date; if that date is after `promised_date`, publish `promise.slipped`."
      - add: schema
        value:
          id: sch:promise-slipped-v1
          name: promise.slipped v1
          kind: payload
          fields:
            - { name: order_id, type: uuid, required: true }
            - { name: line_ids, type: "uuid[]", required: true }
            - { name: old_date, type: date, required: true }
            - { name: new_date, type: date, required: true }
            - { name: reason, type: "enum(stock_moved, cutoff_missed, carrier_delay)", required: true }
      - add: message
        value:
          id: msg:promise-slipped
          name: promise.slipped
          version: v1
          topic: st:fulfilment-events
          payload: sch:promise-slipped-v1
          producer: svc:allocation
          consumers: [svc:oms, svc:notifier]
          key: order_id
          semantics: "Once per slip. The WMS integration also publishes it when a wave misses the cutoff."
      - add: flow
        value:
          id: flow:promise-slipped
          name: A promise slips
          actor: System
          trigger: "Allocation cannot ship from the promised FC, or a wave misses the cutoff."
          outcome: "The order shows the new date, and the shopper has been told before they ask."
          steps:
            - id: flow:promise-slipped#publish
              from: svc:allocation
              to: st:fulfilment-events
              via: msg:promise-slipped
              action: Announce the slip
              logic: "Also raised by the WMS integration at 16:05 for shipments still `picked` ([[sc:berlin-slip]])."
            - id: flow:promise-slipped#oms
              from: st:fulfilment-events
              to: svc:oms
              via: msg:promise-slipped
              action: Move the promise on the order
              logic: "Sets `promised_date` on the lines and the order; keeps the old date in `slips` for the tracking page."
              writes: ["sch:order#promised_date", "sch:order-line#promised_date"]
            - id: flow:promise-slipped#notify
              from: st:fulfilment-events
              to: svc:notifier
              via: msg:promise-slipped
              action: Tell the shopper
              screen: scr:email-promise-slipped
              logic: "One email per order, however many lines slipped. Rate-limited: a second slip within a day is one email."
            - id: flow:promise-slipped#push
              from: st:fulfilment-events
              to: svc:notifier
              via: msg:promise-slipped
              action: Push it to the phone
              screen: scr:push-promise-slipped
              logic: "For shoppers who allowed notifications. It carries the new date and opens the tracking page; the email still goes."
              fails: "No push token: nothing is pushed and the email is the only message."
            - id: flow:promise-slipped#measure
              from: svc:oms
              to: svc:oms
              via: internal
              action: Count it
              logic: "Every slip is a row in the on-time metric ([[flow:fulfil-order#dispatched]] closes it)."
  - id: chg:notify-slip
    title: "The notifier tells the shopper by email and push that the date moved, and shows the promise in the shipped email"
    why: "The slip message is the point of the whole plan for Anna ([[sc:berlin-slip]]): she hears from us before she asks. Most shoppers look at their phone before their inbox, so the date also goes as a push."
    rollout: "Templates in four locales; Legal approves the wording ([[q:slip-wording]]). The push uses the same sentence as the email's headline."
    ops:
      - add: screen
        value:
          id: scr:email-promise-slipped
          name: Delivery date moved email
          service: svc:notifier
          kind: email
          device: any
          summary: "Sent on `promise.slipped`. The new date, the old date, why, and the tracking link."
          image: assets/email-promise-slipped-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF3notifier/Emails?node-id=20-77"
          regions:
            - id: scr:email-promise-slipped#headline
              name: Headline
              shows: "*Your tent now arrives Fri 9 Oct. Sorry.*"
              reads: ["sch:promise-slipped-v1#new_date"]
              at: { x: 6, y: 6, w: 88, h: 20 }
            - id: scr:email-promise-slipped#why
              name: Why
              shows: "One plain sentence per reason: *It missed today's collection from our Berlin warehouse.*"
              reads: ["sch:promise-slipped-v1#reason"]
              at: { x: 6, y: 28, w: 88, h: 16 }
            - id: scr:email-promise-slipped#track
              name: Track it
              shows: "Button to the tracking page."
              at: { x: 6, y: 48, w: 88, h: 14 }
      - add: screen
        value:
          id: scr:push-promise-slipped
          name: Delivery date moved push
          service: svc:notifier
          kind: push
          device: mobile
          summary: "Sent on `promise.slipped` to shoppers who allowed notifications. The new date in one line; a tap opens the tracking page."
          image: assets/push-promise-slipped-tobe.svg
          mockup: mockups/walking.html
          regions:
            - id: scr:push-promise-slipped#message
              name: Message
              shows: "*Your tent now arrives Fri 9 Oct. Sorry.* and *We promised Thu 8 Oct.*"
              reads: ["sch:promise-slipped-v1#new_date", "sch:promise-slipped-v1#old_date"]
              at: { x: 5, y: 40, w: 90, h: 26 }
            - id: scr:push-promise-slipped#open
              name: Tap to track
              shows: "Opens *Where is my order* on the order."
              at: { x: 5, y: 68, w: 90, h: 14 }
      - modify: svc:notifier
        set:
          summary: "Templates for confirmation, shipped and delivered emails, rendered per locale. Also the slip email and the slip push."
      - modify: "flow:fulfil-order#shipped-email"
        set:
          logic: "With the carrier's tracking link and the order's promised date, so the two never disagree."
  # ── Tracking
  - id: chg:tracking-shows-promise
    title: "The tracking page shows the promised date and any slip"
    why: "*Where is my order* without a date is why 22% of contacts exist."
    rollout: "With M3; the OMS already has the date by then."
