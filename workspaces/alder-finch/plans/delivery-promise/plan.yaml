milestones:
  - id: ms:promise-exists
    name: "M1 · The promise exists"
    exit: "Promise computes for every SKU and region, [[tst:promise-backtest]] passes at 95%, and the PIM editor shows the panel. Nothing shopper-facing."
    due: "2026-11-13"
  - id: ms:shipping-priced
    name: "M2 · Sweden sees it"
    exit: "In SE: PDP, cart and delivery step show the date and the price with shipping; financing quotes the total. [[tst:pdp-shows-promise]] passes in staging and the SE abandonment rate is read for two weeks."
    due: "2026-12-11"
  - id: ms:order-keeps-promise
    name: "M3 · The order keeps the promise"
    exit: "Orders carry the date; allocation honours it; a slip reaches the shopper by email and the tracking page ([[tst:anna-end-to-end]])."
    due: "2027-01-15"
  - id: ms:everywhere
    name: "M4 · Everyone, everywhere"
    exit: "DE, NL, FR switched; the search facet is live; v1 events and the lead-time field removed ([[tst:retire-nothing-reads-v1]])."
    due: "2027-01-29"

execution:
  summary: >-
    One promise, created once, copied to every place the shopper looks, frozen on the order. The warehouse's only job is to say when it
    cannot keep it. Every path below ends with the shopper holding the same date we hold.
  paths:
    - name: The promise reaches the shelf
      summary: "Stock moves in Berlin; a minute later the product page in Malmö shows a new date."
      steps:
        - { label: Stock, detail: "The WMS publishes `stock.changed` ([[flow:compute-promise#stock]])." }
        - { label: Compute, detail: "Promise picks the FC and date per region ([[flow:compute-promise#compute]])." }
        - { label: Publish, detail: "`promise.changed` goes to the PIM, search and the BFF ([[flow:propagate-promise]])." }
        - { label: Show, detail: "The product page renders the date and the display price ([[flow:browse-product#render]])." }
    - name: The shopper buys
      summary: "The date and the price never change between the product page and the order."
      steps:
        - { label: Cart, detail: "One date for the cart, the latest line ([[flow:add-to-cart#promise]])." }
        - { label: Address, detail: "The real region may move the date; the step says so ([[flow:checkout#region-promise]])." }
        - { label: Pay, detail: "Card or financing for the full total ([[flow:checkout#pay]])." }
        - { label: Freeze, detail: "The order and its lines carry the date and the FC ([[flow:checkout#create]])." }
    - name: The warehouse cannot keep it
      summary: "Stock moved or a cutoff was missed."
      steps:
        - { label: Allocate, detail: "Allocation tries the promised FC first ([[flow:fulfil-order#allocate]])." }
        - { label: Slip, detail: "If the earliest date is later than promised, `promise.slipped` ([[flow:promise-slipped#publish]])." }
        - { label: Tell, detail: "The OMS moves the date; one email per order per day ([[flow:promise-slipped#notify]])." }
        - { label: Measure, detail: "Every slip counts against the 95% target." }
    - name: No promise
      summary: "No stock anywhere, or Promise is down."
      steps:
        - { label: Shelf, detail: "*Delivery date on request*; the price with shipping still shows ([[tst:pdp-promise-miss]])." }
        - { label: Checkout, detail: "The delivery step lets the shopper continue without a date; the order has none." }
  caveats:
    - "Region from IP is a guess until the address is typed; the delivery step is where it is corrected."
    - "Promise confidence `low` is shown as *Likely*; [[q:likely-wording]] is open."
    - "The 95% on-time target is Fulfilment's call and may move after the backtest ([[q:on-time-target]])."

