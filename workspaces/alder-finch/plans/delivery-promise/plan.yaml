    repo: alder-finch/fulfilment
    issue_type: feature
    body: |
      New service in the fulfilment repo. Consume `stock.changed`, hold cutoffs, read lead times from the
      carrier gateway, compute per SKU and region, serve `GET /promises` and `POST /promises/cart`, publish
      `promise.changed` on change only. Behind `promise_service`.

      **Done when** the backtest reports ≥95% per region and the API answers in under 50 ms p99.
