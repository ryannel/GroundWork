# ─────────────────────────────────────────────── chapter 8: What we're committing to
decisions:
  - id: dec:fulfilment-owns-promise
    title: "Fulfilment owns the promise in a new Promise service"
    status: accepted
    decider: team:fulfilment
    decided_on: "2026-09-18"
    reversibility: one-way
    context: "The inputs (stock per FC, cutoffs, carrier days) all live in Fulfilment. The output is needed by five other teams before an order exists ([[q:who-owns-promise]])."
    decision: "A new service in the fulfilment platform computes and publishes it. Everyone else copies."
    consequences: "A new service to run 24/7 on the shopper path; a cache in the BFF so the shelf survives it being down."
    options:
      - { name: "The PIM computes it from a stock feed", why_not: "The PIM would need cutoffs and carrier tables it has no business owning, and it is not on-call at night." }
      - { name: "The BFF computes it on request", why_not: "Three lookups per page view, and nobody else (search, email, the PIM editor) would have it." }
  - id: dec:promise-is-a-date
    title: "The promise is one date, not a range"
    status: accepted
    decider: team:product
    decided_on: "2026-09-18"
    reversibility: two-way
    supersedes: [dec:promise-is-a-range]
    context: "*3–5 days* is what we show now and what shoppers do not trust."
    decision: "One date per region, with `confidence` to soften it in copy (*Likely Thu*)."
    consequences: "We will miss some; the 95% target and the slip email are the price."
  - id: dec:promise-is-a-range
    title: "The promise is a range, *2–3 working days*"
    status: superseded
    decider: team:product
    decided_on: "2026-09-11"
    context: "The first draft kept the shape shoppers already know and hedged the warehouse's misses."
    decision: "Replaced by [[dec:promise-is-a-date]]: *3–5 days* is what we show now and shoppers do not trust it. The June test showed a date, and the date lifted add-to-cart 6.8%."
  - id: dec:pricing-computes-promise
    title: "Pricing computes the promise next to the shipping component"
    status: rejected
    decider: team:fulfilment
    decided_on: "2026-09-18"
    reversibility: two-way
    context: "Pricing already turns weight, region and the carrier cost table into a shipping component, and a promise is carrier days plus a cutoff. Pricing offered to take it."
    decision: "Rejected: Pricing has no stock and no cutoffs. It would have to listen to every stock move to answer, and a second service would then hold the carrier tables."
  - id: dec:region-not-postcode
    title: "Promises are per region, not per postcode"
    status: accepted
    decider: team:fulfilment
    decided_on: "2026-09-18"
    reversibility: two-way
    context: "Carriers price and promise by six regions. Postcode-level data exists for DE only."
    decision: "Six regions in v1. The schema uses an enum so adding regions is a migration, not a redesign."
    consequences: "Kiruna and Malmö differ by a day; islands may be wrong. Revisit after M4."
  - id: dec:shipping-in-display-price
    title: "Shipping is in the price the shopper sees on the product page"
    status: proposed
    decider: team:product
    decide_by: "2026-10-30"
    reversibility: one-way
    context: "German, Dutch and Swedish law allow a shipping-inclusive price if it is stated as such; Legal's written opinion for those three is on file (22 Sep 2026, [[q:price-display-law]]). France is asked separately and is owed before M4 ([[q:price-display-law-fr]]). Competitors in SE already do it."
    decision: "The display price per region includes the shipping component. Checkout shows no shipping row for switched countries. Free shipping above a threshold reduces the total at checkout rather than the shelf price. A percentage promotion discounts the list price only; the shipping component is never discounted."
    consequences: "Prices differ per region on the same page; promotions and price comparison feeds need the region. One-way because telling shoppers the price went *down* later is not something we would do twice."
    options:
      - { name: "Show the shipping cost next to the price", why_not: "Keeps the surprise, just earlier. The June test showed the lift came from one number." }
      - { name: "Flat shipping everywhere, priced into the list price", why_not: "Socks to Berlin subsidise tents to Kiruna; margin on light items goes negative in SE-N." }
  - id: dec:free-shipping-threshold
    title: "Free shipping above a per-region cart threshold"
    status: proposed
    decider: team:pricing
    decide_by: "2026-10-30"
    reversibility: two-way
    context: "A shipping-inclusive shelf price has no place for *free above 75*."
    decision: "The component is deducted at checkout when the cart subtotal is above the region's threshold. The shelf price does not change."
    consequences: "The total at checkout can be lower than the sum of shelf prices. Copy must say *shipping refunded* clearly."
    options:
      - { name: "No free-shipping threshold", why_not: "Basket size would drop; the threshold drives 18% of multi-item orders." }
  - id: dec:bff-reads-promise-directly
    title: "The BFF caches the promise from the event, and falls back to the API"
    status: accepted
    decider: team:storefront
    decided_on: "2026-09-25"
    reversibility: two-way
    context: "The catalog read API gets the promise via the PIM, two hops and a republish later. Product pages need it within a minute of a stock change."
    decision: "The BFF consumes `promise.changed` into its own cache and calls `GET /promises` on a miss. The catalog read API's copy is for everyone else."
    consequences: "Two copies in the storefront's path. The event is compacted so a cold BFF can rebuild."
  - id: dec:one-promise-per-cart
    title: "A cart shows one date: the latest of its lines"
    status: accepted
    decider: team:product
    decided_on: "2026-09-25"
    reversibility: two-way
    context: "Lines from two FCs ship as two parcels on different days."
    decision: "One date for the cart and the order confirmation, the latest. Each line keeps its own date in the cart and on tracking."
    consequences: "Some shoppers get a parcel earlier than promised. We accept that."
    options:
      - { name: "Offer split delivery", why_not: "Two parcels, two carrier costs, and a choice on the cart page. Not in v1." }
  - id: dec:financing-full-total
    title: "Financing partners quote the full total"
    status: accepted
    decider: team:financing
    decided_on: "2026-09-25"
    reversibility: two-way
    context: "The split was a 2021 workaround when Nordbank could not quote amounts with cents."
    decision: "Quote and confirm the checkout total. No separate card charge."
    consequences: "Nordbank contract notice. Partner fees apply to shipping too (0.3% of shipping revenue)."
  - id: dec:promise-frozen-at-capture
    title: "The order's promise is frozen at capture and moves only through a slip"
    status: accepted
    decider: team:orders
    decided_on: "2026-09-25"
    reversibility: one-way
    context: "If the order re-read the live promise, the date would move silently with stock."
    decision: "Capture copies the date and the FC onto each line. Only `promise.slipped` changes it, and every change is kept and shown."
    consequences: "Allocation has to honour the FC or declare a slip. The on-time metric is well defined."
    options:
      - { name: "Re-read the live promise on every order view", why_not: "The date would move silently with stock, and no one could say what was promised." }
      - { name: "Freeze the date but let allocation pick any FC", why_not: "A quieter version of the same silent slip." }
  - id: dec:retire-lead-time-text
    title: "The typed lead time is removed, not kept as a fallback"
    status: accepted
    decider: team:catalog
    decided_on: "2026-09-25"
    reversibility: one-way
    context: "A fallback field nobody maintains becomes the thing everyone reads when the promise is missing."
    decision: "Remove the field in M4. No promise shows *Delivery date on request*."
    consequences: "Products with no stock anywhere show no date. Category managers lose a field they liked."
    options:
      - { name: "Keep lead_time_text as a fallback when the promise is missing", why_not: "A field nobody maintains becomes the one everyone reads." }
  - id: dec:capture-at-order
    title: "Payment stays captured at order, not at dispatch"
    status: accepted
    decider: team:payments
    decided_on: "2026-09-22"
    reversibility: two-way
    context: "Capturing at dispatch would be the right thing for a promise we might slip, and was raised in review."
    decision: "Out of scope. Capture at order stays; a slip is a refund decision for customer care."
    consequences: "A slipped order was paid in full; the slip email does not offer a refund, which settles the refund half of [[q:slip-wording]]."
  - id: dec:no-express-in-v1
    title: "No express option in v1"
    status: accepted
    decider: team:product
    decided_on: "2026-09-18"
    reversibility: two-way
    context: "Express would need a second promise per region and carrier contracts we do not have in FR."
    decision: "One promise, one option. Express is its own plan after M4."
    consequences: "The delivery step keeps one radio button."
  - id: dec:offer-express
    title: "Offer express delivery as a second promise"
    status: deferred
    decider: team:product
    decide_by: "2027-02-26"
    reversibility: two-way
    context: "A faster option means a second promise per region and express rates from the carriers, which we have in DE and SE only."
    decision: "Come back to it after M4, with a month of on-time numbers that show the first promise is kept."
    consequences: "Until then the delivery step keeps one option."

risks:
  - id: risk:promise-wrong
    statement: "The promise is systematically wrong in one region and we train shoppers not to trust it."
    likelihood: med
    impact: high
    roam: mitigated
    owner: team:fulfilment
    mitigation: "The backtest ([[tst:promise-backtest]]) gates M1; on-time per region is a launch dashboard; a region below 90% for a week flips to *Likely* copy."
    about: [chg:promise-service]
  - id: risk:price-perception
    statement: "Shelf prices rise visibly (the shipping component) and conversion drops before the promise lifts it."
    likelihood: med
    impact: high
    roam: owned
    owner: team:product
    mitigation: "SE first and alone for two weeks with the abandonment and add-to-cart metrics read daily. Rollback is the `pdp_promise` flag."
    about: [chg:pdp-delivery-promise, chg:pricing-shipping-component]
  - id: risk:promise-down
    statement: "The Promise service is on the shopper path and goes down."
    likelihood: low
    impact: med
    roam: mitigated
    owner: team:storefront
    mitigation: "The BFF cache serves stale-but-recent for an hour; a miss shows no date, never an error ([[tst:pdp-promise-miss]])."
    about: [chg:pdp-delivery-promise]
  - id: risk:republish-storm
    statement: "Every stock move republishes products and floods translation, search and the read API."
    likelihood: high
    impact: med
    roam: mitigated
    owner: team:catalog
    mitigation: "Promise publishes on date change only (not on every stock tick); translation skips promise-only events; the topic is compacted."
    about: [chg:pim-promise-attribute, chg:promise-service]
  - id: risk:weight-gaps
    statement: "11% of products have no weight and vanish from the shelf when enrichment enforces it."
    likelihood: med
    impact: med
    roam: owned
    owner: team:catalog
    mitigation: "Report-only for two weeks and the supplier-feed backfill before enforcing."
    about: [chg:enrichment-weight-required]
  - id: risk:partner-notice
    statement: "Nordbank's 30-day notice is missed and financing cannot switch with SE in M2."
    likelihood: low
    impact: med
    roam: resolved
    owner: team:financing
    mitigation: "Notice sent on 26 Sep 2026 and acknowledged."
    about: [chg:financing-includes-shipping]
  - id: risk:legal-price
    statement: "A shipping-inclusive price is challenged in FR, where the rules differ."
    likelihood: low
    impact: high
    roam: owned
    owner: team:legal
    mitigation: "FR switches last (M4), and only once Legal's written opinion for FR is on file ([[q:price-display-law-fr]]). The opinion for DE, NL and SE is on file ([[q:price-display-law]])."
    about: [chg:pdp-delivery-promise]
  - id: risk:missed-dates
    statement: "About one order in twenty arrives after the date we gave."
    likelihood: med
    impact: med
    roam: accepted
    owner: team:fulfilment
    accepted_by: dec:promise-is-a-date
    mitigation: "The slip email tells the shopper before they ask ([[chg:notify-slip]]); the target is 95% on time, per region."
    about: [chg:notify-slip]

questions:
  - id: q:who-owns-promise
    question: "Which team owns the delivery promise?"
    decider: team:fulfilment
    status: resolved
    answered_by: dec:fulfilment-owns-promise
    answer: "Fulfilment, in a new Promise service."
  - id: q:price-display-law
    question: "May we show a shipping-inclusive price in DE, NL and SE?"
    decider: team:legal
    status: resolved
    answer: "Yes, if it is labelled *incl. shipping*. Legal's written opinion for the three countries is on file (22 Sep 2026). Feeds the proposed [[dec:shipping-in-display-price]]."
  - id: q:on-time-target
    question: "Is 95% on-time the right bar for M1, per region or overall?"
    decider: team:fulfilment
    decide_by: "2026-10-16"
    status: open
    blocks: [wi:promise-service]
    answer: ""
  - id: q:likely-wording
    question: "What does a low-confidence promise say on the page?"
    decider: team:product
    decide_by: "2026-11-06"
    status: open
    answer: "*Likely Thu 8 Oct* is the placeholder. UX research with 12 shoppers is booked for the week of 26 Oct 2026."
  - id: q:slip-wording
    question: "What may the slip email and push say about why, and must they mention a refund?"
    decider: team:legal
    decide_by: "2026-11-27"
    status: open
    blocks: [wi:notifier-slip]
    answer: ""
  - id: q:promo-and-display-price
    question: "Does a percentage promotion apply to the display price or the list price?"
    decider: team:pricing
    decide_by: "2026-10-30"
    status: open
    answered_by: dec:shipping-in-display-price
    answer: "Pricing proposes list price only; the shipping component is never discounted."
  - id: q:malmo-winter-cutoff
    question: "Does Malmö really close its last wave at 12:00 in winter?"
    decider: team:fulfilment
    status: resolved
    answer: "Yes, from the last Sunday of October. The Malmö warehouse lead confirmed it on 16 Sep 2026, and the cutoff table carries it ([[sch:cutoff]])."
  - id: q:packing-slip-date
    question: "Should the packing slip in the parcel print the promised date?"
    decider: team:fulfilment
    decide_by: "2026-11-20"
    status: open
    answer: ""
  - id: q:price-display-law-fr
    question: "May we show a shipping-inclusive price in FR, and what must the invoice show?"
    decider: team:legal
    decide_by: "2027-01-15"
    status: open
    blocks: [wi:fr-shipping-line, wi:rollout-countries]
    answer: "Not asked in writing yet, because FR switches last, in M4. Legal expects FR to need the shipping component shown as its own line on the invoice ([[wi:fr-shipping-line]]). The opinion is owed before M4 starts."

