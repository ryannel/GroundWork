# Navigation in this fictional retailer's drawn examples. These records describe
# user controls independently of the service steps; they are not production evidence.
interactions:
  - id: ui:search-product
    name: Open the product
    from: ["scr:search-results#tiles"]
    to: scr:pdp
    trigger: click
    effect: navigate
    supporting_steps: ["flow:browse-product#open"]
    evidence: { file: assets/search-results.svg, note: "Drawn example: a result tile opens its product page." }
  - id: ui:cart-product
    name: Open the product
    from: ["scr:cart#lines"]
    to: scr:pdp
    trigger: click
    effect: navigate
    evidence: { file: assets/cart.svg, note: "Drawn example: a product name in the cart opens its product page." }
  - id: ui:add-to-cart
    name: Add to cart
    from: ["scr:pdp#add-to-cart"]
    to: scr:cart
    trigger: click
    effect: navigate
    supporting_steps: ["flow:add-to-cart#press", "flow:add-to-cart#cart", "flow:add-to-cart#show"]
    evidence: { file: assets/pdp.svg, note: "Drawn example: Add to cart stores the line and shows the cart." }
  - id: ui:checkout
    name: Checkout
    from: ["scr:cart#summary"]
    to: scr:checkout-delivery
    trigger: click
    effect: navigate
    supporting_steps: ["flow:checkout#address"]
    evidence: { file: assets/cart.svg, note: "Drawn example: Checkout opens the delivery and address screen." }
  - id: ui:payment
    name: Continue to payment
    from: [scr:checkout-delivery]
    to: scr:checkout-payment
    trigger: submit
    effect: navigate
    condition: The shopper supplies an address and chooses delivery.
    supporting_steps: ["flow:checkout#session", "flow:checkout#delivery", "flow:checkout#quote"]
    evidence: { file: assets/checkout-delivery.svg, note: "Drawn example: Continue to payment opens the payment screen." }
  - id: ui:place-order
    name: Place order
    from: ["scr:checkout-payment#pay"]
    to: scr:email-order-confirmation
    trigger: submit
    effect: output
    condition: Payment succeeds and the order is created.
    result: The shopper receives an order confirmation email.
    supporting_steps: ["flow:checkout#pay", "flow:checkout#place", "flow:checkout#authorise", "flow:checkout#create", "flow:checkout#capture", "flow:checkout#confirmation"]
    evidence: { file: assets/checkout-payment.svg, note: "Drawn example: Place order leads to the confirmation email after a successful order." }
  - id: ui:header-cart
    name: Cart
    from: [scr:pdp, scr:search-results, scr:checkout-delivery, scr:checkout-payment, scr:order-tracking]
    to: scr:cart
    trigger: click
    effect: navigate
    evidence: { file: assets/pdp.svg, note: "Drawn example: the same Cart link appears in the storefront header on product, search, checkout and tracking screens." }

user_journeys:
  - id: uj:buy-product
    name: Find a product and place an order
    actor: Shopper
    interactions: [ui:search-product, ui:add-to-cart, ui:checkout, ui:payment, ui:place-order]
  - id: uj:revisit-product
    name: Return to a product from the cart
    actor: Shopper
    interactions: [ui:cart-product, ui:add-to-cart]

