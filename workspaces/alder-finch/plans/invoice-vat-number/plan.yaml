# A small worked example: one field, two screens, five teams (four with work). Same fictional retailer as
# plans/delivery-promise (Alder & Finch); repos overlap on purpose so the Library can show "shares repos with".
# Approved, in delivery, with a revision history: 1.0 approved, 1.1 rejected, 1.2 proposed.

meta:
  id: invoice-vat-number
  title: "Let business customers add a VAT number and print it on the invoice"
  version: "1.2"
  date: "2026-10-02"
  start: "2026-09-28"
  status: approved
  authors: ["Billing"]
  appetite: "2 weeks · 1 milestone"
  repos: [alder-finch/storefront, alder-finch/checkout, alder-finch/orders, alder-finch/billing]
  revisions:
    - version: "1.0"
      status: approved
      date: "2026-09-25"
      approved_on: "2026-09-25"
      approved_by: "@dana-whitfield"
    - version: "1.1"
      status: rejected
      date: "2026-09-29"
      summary: Print the VAT number on the packing slip as well as the invoice
      by: ["team:orders"]
      pr: 52
      rejected_on: "2026-10-01"
      rejected_by: "@dana-whitfield"
      reason: "The slip would call Billing's invoice API every time the warehouse prints, so a Billing outage would stop the warehouse printing. The schools' request is real; a slip that prints from the billing identity already on the order would not have that problem."
    - version: "1.2"
      status: proposed
      date: "2026-10-02"
      summary: Store the VAT number's country on the billing identity so Billing picks the invoice template without re-parsing it
      why: "Billing picks the invoice template by the country in the VAT number's prefix, so it would parse the number Checkout has already checked. Two parsers drift: Greece's prefix is EL, not GR, and Northern Ireland's is XI. Checkout's format check knows the country; store it once there."
      by: ["team:billing"]
      pr: 54
      work:
        - item: "wi:checkout-vat"
          action: rework
          note: "The format check sets vat_country as well as the number."
        - item: "wi:orders-billing"
          action: keep
          note: "The billing column is JSON, so the new key goes in with no change to Orders."
        - item: "wi:checkout-prefixes"
          action: new
          note: "The country comes from the prefix, and Greece's is EL and Northern Ireland's XI, so Checkout needs the prefix table before it can store it."

problem:
  summary: >-
    Business customers (clubs, schools, outdoor guides) cannot give us a VAT number at checkout. Billing adds it
    by hand after an email, re-issues the invoice PDF, and the first invoice stays wrong in the customer's inbox.
  why: >-
    **410 invoices were re-issued last quarter** for a missing VAT number, each one a Billing ticket and an
    email thread. Dutch and German business buyers cannot reclaim VAT without it on the original invoice, and
    three schools told us they buy elsewhere for that reason.
  goals:
    - "A business customer types a VAT number once at checkout and it is on the first invoice."
    - "Billing stops re-issuing invoices for this reason."
  non_goals:
    - "Validating the VAT number against the EU VIES register in real time ([[dec:format-check-only]])."
    - "Reverse-charge VAT for cross-border business sales. The amount of VAT does not change."
    - "Business accounts, net terms or purchase orders."
  metrics:
    - { name: "Invoices re-issued for a missing VAT number", today: "410 / quarter", target: "under 20 / quarter" }
    - { name: "Orders with a VAT number", today: "0% (added by hand after)", target: "3% of orders in DE and NL" }
  scenarios:
    - id: sc:school-order
      title: "A school in Utrecht orders 30 sleeping bags"
      story: >-
        The teacher ticks **Buying for a business?** on the address step, types *NL123456789B01*, and the
        confirmation email's invoice shows it under the billing address. No email to Billing.
      flows: [flow:checkout-address, flow:issue-invoice]
  glossary:
    - { term: "VAT number", means: "The tax identifier a business shows on invoices to reclaim VAT: *DE123456789*, *NL123456789B01*, *FR12345678901*, *SE123456789001*." }
    - { term: "Invoice", means: "The PDF attached to the confirmation email; the legal record of the sale." }
    - { term: "VIES", means: "The EU's VAT number lookup service. Slow and often down; we do not call it ([[dec:format-check-only]])." }

domain:
  summary: "An **order** gets a **billing identity**: the person or business the invoice names. The VAT number is part of it."
  concepts:
    - id: con:billing-identity
      name: Billing identity
      terms: [billing identity, invoice address, bill-to]
      means: "Who the invoice is made out to: name, address and, for a business, the VAT number."
      born_in: svc:checkout
      aka:
        - { in: svc:checkout, as: billing, at: "sch:checkout-session#billing" }
        - { in: svc:order-capture, as: billing, at: "sch:order#billing" }
        - { in: svc:billing, as: Invoice.bill_to, at: "sch:invoice#bill_to" }
      introduced_by: [chg:checkout-vat-field]
  stages:
    - { id: stage:buy, name: Buy, summary: "Address and payment.", services: [{ svc: svc:storefront-web }, { svc: svc:storefront-bff, from: [svc:storefront-web] }, { svc: svc:checkout, from: [svc:storefront-bff] }], flows: [flow:checkout-address] }
    - { id: stage:capture, name: Capture, summary: "The order exists.", services: [{ svc: svc:order-capture, from: [svc:checkout] }], flows: [flow:checkout-address] }
    - { id: stage:bill, name: Bill, summary: "The invoice is made and sent.", services: [{ svc: svc:billing, from: [svc:order-capture] }, { svc: svc:notifier, from: [svc:billing] }], flows: [flow:issue-invoice] }

# What of today the plan leans on without naming it anywhere else.
context:
  - team:notifications
  - st:cart-cache
  - st:orders-db
  - st:order-events
  - st:billing-db
  - if:bff-graphql
  - if:checkout-rest
  - if:orders-rest
  - if:notifier-rest
  - msg:order-placed

changes:
  - id: chg:checkout-vat-field
    title: "Checkout asks *Buying for a business?* and takes a company name and VAT number"
    why: "The VAT number has to be asked for where the address is ([[sc:school-order]]). A format check is enough ([[dec:format-check-only]])."
    decisions: [dec:format-check-only]
    rollout: "Behind the `vat_number` flag in all four countries at once. The field is optional, so consumer orders are unaffected."
    ops:
      - add: schema
        value:
          id: sch:billing-identity
          name: BillingIdentity
          kind: dto
          summary: "Who the invoice names."
          fields:
            - { name: company, type: string }
            - { name: vat_number, type: string, note: "Format-checked per country prefix; stored upper-case without spaces." }
            - { name: vat_country, type: string, note: "Two-letter country of the VAT number's prefix (*NL*, *DE*), set by the format check, so Billing picks the template without re-parsing the number." }
            - { name: address, type: Address, required: true }
      - add: field
        into: sch:checkout-session
        value: { name: billing, type: BillingIdentity, note: "Defaults to the delivery address with no company." }
      - add: field
        into: sch:order
        value: { name: billing, type: BillingIdentity, required: true }
      - add: field
        into: sch:order-placed-v1
        value: { name: billing, type: BillingIdentity, note: "Optional, so Billing can deploy after Orders." }
      - modify: "flow:checkout-address#store"
        set:
          logic: "Stores the address and, if the box is ticked, the company and VAT number. Rejects a VAT number whose format does not match the country."
      - modify: "flow:checkout-address#create"
        set:
          logic: "After payment. Copies `billing` onto the order; without it, the delivery address with no company."
      - modify: scr:checkout-address
        set:
          summary: "The delivery address form, with a business toggle that reveals company and VAT number."
          image: assets/checkout-address-tobe.svg
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=120-18"
          mockup: mockups/walking.html
      - add: region
        into: scr:checkout-address
        value:
          id: scr:checkout-address#business
          name: Business fields
          shows: "**Buying for a business?** toggle; when on, *Company* and *VAT number* with inline format help (*NL123456789B01*)."
          reads: ["sch:checkout-session#billing"]
          at: { x: 2, y: 56, w: 62, h: 18 }
      - modify: "scr:checkout-address#address"
        set:
          at: { x: 2, y: 14, w: 62, h: 40 }
          shows: "Name, street, postcode, city, country. The **Continue** button moves below the business fields."
  - id: chg:invoice-prints-vat
    title: "The first invoice shows the company and VAT number, so the re-issue script can go"
    why: "With the number on the order, the first invoice is right, and nobody needs the script that patches invoices by hand."
    rollout: "A template change in all four countries. The script is deleted two weeks after launch, once the re-issue tickets stop."
    ops:
      - modify: "sch:invoice#bill_to"
        set:
          type: BillingIdentity
          note: "Copied from `order.placed`. Company and VAT number when present."
      - modify: "flow:issue-invoice#render"
        set:
          logic: "From the template for `bill_to.vat_country` when there is one, else the delivery country. Company above the name, *VAT no.* under the address when present."
      - modify: "scr:invoice-pdf"
        set:
          summary: "The invoice attached to the confirmation email. Bill-to names the business when there is one."
          image: assets/invoice-pdf-tobe.svg
      - modify: "scr:invoice-pdf#bill-to"
        set:
          shows: "Company, name, address and *VAT no. NL123456789B01* when the order has one."
      - deprecate: "flow:issue-invoice#reissue"
      - deprecate: "sch:invoice#reissued_from"

tests:
  - id: tst:vat-format
    level: unit
    name: "A VAT number is format-checked per country"
    given: "Country NL"
    when: "*NL123456789B01*, *nl 1234 5678 9 b01* and *DE123456789* are submitted"
    then: "The first two are accepted and stored as NL123456789B01; the third is rejected with `vat_number_format`"
    proves: [chg:checkout-vat-field]
    walks: ["flow:checkout-address#store"]
    owner: team:checkout
    env: ci
  - id: tst:order-carries-billing
    level: contract
    name: "order.placed carries the billing identity and Billing renders it"
    given: "An order with company *Montessori Utrecht* and VAT NL123456789B01"
    when: "Billing consumes `order.placed`"
    then: "The PDF's bill-to block has the company on line 1 and *VAT no. NL123456789B01* under the address"
    proves: [chg:checkout-vat-field, chg:invoice-prints-vat]
    walks: ["flow:checkout-address#create", "flow:checkout-address#publish", "flow:issue-invoice#consume", "flow:issue-invoice#render"]
    owner: team:billing
    env: ci
  - id: tst:consumer-unchanged
    level: integration
    name: "A consumer order is unchanged"
    given: "The business toggle off"
    when: "The order is placed and invoiced"
    then: "`billing.company` is empty and the PDF is byte-identical to today's for the same order"
    proves: [chg:checkout-vat-field, chg:invoice-prints-vat]
    walks: ["flow:checkout-address#store", "flow:issue-invoice#render"]
    owner: team:billing
    env: ci
  - id: tst:school-e2e
    level: e2e
    name: "The Utrecht school's first invoice is right"
    given: "Staging, NL, business toggle on"
    when: "The order is placed"
    then: "The confirmation email's PDF names the school and its VAT number; no Billing ticket"
    proves: [chg:checkout-vat-field, chg:invoice-prints-vat]
    walks: ["flow:checkout-address#form", "flow:checkout-address#store", "flow:checkout-address#create", "flow:issue-invoice#render", "flow:issue-invoice#send"]
    owner: team:billing
    env: staging

milestones:
  - id: ms:live
    name: "M1 · Live in all four countries"
    exit: "[[tst:school-e2e]] passes in staging; the flag is on; re-issue tickets are watched for two weeks."
    due: "2026-10-16"

execution:
  summary: "One field travels from the address form to the PDF. Nothing else changes."
  paths:
    - name: Business customer
      summary: "Ticks the box, types the number."
      steps:
        - { label: Collect, detail: "Format check per country ([[flow:checkout-address#store]])." }
        - { label: Carry, detail: "Onto the order and into `order.placed` ([[flow:checkout-address#create]])." }
        - { label: Print, detail: "Company and VAT number on the first PDF ([[flow:issue-invoice#render]])." }
    - name: Consumer
      summary: "Box off. Nothing changes."
      steps:
        - { label: Collect, detail: "`billing` defaults to the delivery address." }
        - { label: Print, detail: "Same PDF as today ([[tst:consumer-unchanged]])." }
  caveats:
    - "A wrong-but-well-formed VAT number still gets printed; VIES is out of scope ([[dec:format-check-only]])."

work_items:
  - id: wi:checkout-vat
    title: "Checkout: billing identity on the session and the order request; format check"
    team: team:checkout
    size: S
    milestone: ms:live
    implements: [chg:checkout-vat-field]
    verified_by: [tst:vat-format]
    depends_on: []
    repo: alder-finch/checkout
    issue_type: feature
    github_issue: 41
  - id: wi:storefront-vat
    title: "Storefront: business toggle, company and VAT fields on the address step"
    team: team:storefront
    size: S
    milestone: ms:live
    implements: [chg:checkout-vat-field]
    verified_by: [tst:school-e2e]
    depends_on: [wi:checkout-vat]
    repo: alder-finch/storefront
    issue_type: story
    github_issue: 112
    body: "Build from the Figma on [[scr:checkout-address]]."
  - id: wi:orders-billing
    title: "Orders: billing column and order.placed field"
    team: team:orders
    size: S
    milestone: ms:live
    implements: [chg:checkout-vat-field]
    verified_by: [tst:order-carries-billing]
    depends_on: []
    repo: alder-finch/orders
    issue_type: feature
    github_issue: 87
  - id: wi:billing-template
    title: "Billing: bill-to from order.placed; template by vat_country; delete the re-issue script"
    team: team:billing
    size: S
    milestone: ms:live
    implements: [chg:invoice-prints-vat]
    verified_by: [tst:order-carries-billing, tst:consumer-unchanged]
    depends_on: [wi:orders-billing]
    repo: alder-finch/billing
    issue_type: feature
    github_issue: 58
  # Added by the proposed 1.2: not in GitHub yet, so it reads "not started" while 1.0 is being built.
  - id: wi:checkout-prefixes
    title: "Checkout: prefix table for the format check (Greece is EL, Northern Ireland XI), stored as vat_country"
    team: team:checkout
    size: S
    milestone: ms:live
    implements: [chg:checkout-vat-field]
    verified_by: [tst:vat-format]
    depends_on: [wi:checkout-vat]
    repo: alder-finch/checkout
    issue_type: feature

decisions:
  - id: dec:format-check-only
    title: "Check the VAT number's format, not its existence"
    status: accepted
    decider: team:billing
    decided_on: "2026-09-26"
    reversibility: two-way
    context: "VIES is down several hours a month and takes 2–8 seconds. The legal duty to verify falls on reverse-charge sales, which we do not make."
    decision: "A regex per country at checkout. No VIES call."
    consequences: "A typo gets printed and Billing re-issues as today, but rarely."
    options:
      - { name: "Call VIES at checkout", why_not: "A 2–8 second step with a 3% failure rate on the path that makes money." }
      - { name: "Check VIES asynchronously and warn", why_not: "Extra UI for a problem we have not seen yet." }

risks:
  - id: risk:template-regression
    statement: "The template change shifts the layout for consumers in one country."
    likelihood: low
    impact: med
    roam: mitigated
    owner: team:billing
    mitigation: "[[tst:consumer-unchanged]] compares PDFs byte for byte in all four countries."
    about: [chg:invoice-prints-vat]

questions:
  - id: q:vat-on-tracking
    question: "Should the tracking page and the order history show the VAT number too?"
    decider: team:storefront
    status: open
    answer: "Not for v1; Billing's tickets are about the invoice."

commitment:
  - { team: team:billing, confidence: 5, note: "A template and a deletion." }
  - { team: team:checkout, confidence: 5, note: "One struct and a regex." }
  - { team: team:storefront, confidence: 4, note: "Four locales of copy and a Figma to follow." }
  - { team: team:orders, confidence: 5, note: "A JSON column and one new key." }

story:
  chapters:
    why: { headline: "410 invoices a quarter are re-issued for one missing line.", recap: ["Business buyers need their VAT number on the first invoice.", "One optional field at checkout fixes it."] }
    today: { headline: "The delivery address is the billing address, because there is nowhere else.", recap: ["Billing patches invoices by hand with a script.", "Four teams touch the path from form to PDF."] }
    runs: { headline: "The invoice is made from the delivery address, so a person patches it afterwards.", recap: ["The address goes onto the order, the order goes out as order.placed, and Billing renders the PDF from it.", "The re-issue step is a human running a script."] }
    new: { headline: "The order gets a billing identity: company, VAT number and address.", recap: ["It rides inside order.placed as an optional field."] }
    changes: { headline: "A VAT number reaches the invoice: two changes, four teams, one script deprecated.", recap: ["Checkout collects; Billing prints; the re-issue script is deprecated."] }
    prove: { headline: "A format test, a contract test, and a byte-for-byte check that consumers see no change.", recap: ["One staging run plays the Utrecht school's order end to end."] }
    build: { headline: "Everything ships at once: two weeks, one milestone, all four countries.", recap: ["Checkout and Orders first; Storefront and Billing after."] }
    commit: { headline: "The one decision: check the format, never call VIES.", recap: ["Everyone is at 4 or 5."] }
