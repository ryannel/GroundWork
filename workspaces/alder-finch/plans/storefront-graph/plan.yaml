# ─────────────────────────────────────────────── chapters 4–5: What's new and what changes
changes:
  # ── Fulfilment: the promise joins the graph
  - id: chg:promise-subgraph
    title: "Fulfilment serves a promise subgraph that adds deliveryPromise to Product"
    why: >-
      The promise exists ([[sch:delivery-promise]]), but the page can reach it only through a side call. As a field
      on `Product`, it can be asked for by every operation that already has a `sku`. Fulfilment serves it from the
      Promise service, not from the inventory subgraph, so ownership and the cache stay with the team that computes
      it ([[dec:promise-own-subgraph]]). The field `@requires` the warehouse from `stock { fc }`. That costs a round
      trip wherever the field is selected, so ProductPage must not select it.
    decisions: [dec:promise-own-subgraph, dec:region-in-key]
    rollout: >-
      Publish the subgraph to the registry and compose it in CI (M1); the field exists in the graph before any
      operation selects it. `region` is an argument, so the answer for a region is public and cacheable, and the
      field never reads the region from the session.
    ops:
      - add: subgraph
        value:
          id: sg:promise
          name: Promise subgraph
          graph: graph:storefront
          service: svc:promise
          summary: "Extends `Product` with `deliveryPromise`; owns `DeliveryPromise`. Needs the warehouse from the inventory subgraph (`@requires`)."
          batching: dataloader
          cache_control_default: 60
          timeout_ms: 400
      - add: store
        value:
          id: st:promise-redis
          name: promise cache
          kind: cache
          tech: "Redis 7"
          owner: svc:promise
          does: "Promise per sku and region, 60 s"
          layer: subgraph
          granularity: entity
          keyed_by: "sku · region"
          purge: "keys for the sku, deleted by the Promise service before it publishes promise.changed"
          observed: { latency_ms: { hit: 2, miss: 40 } }
      - add: schema
        value:
          id: sch:gql-delivery-promise
          name: DeliveryPromise
          kind: graph-type
          graph: graph:storefront
          summary: "The date, the cutoff and how sure we are. Public: it is computed for the region the caller names."
          fields:
            - { name: date, type: "Date!", subgraphs: [sg:promise], reads: ["sch:delivery-promise#promised_date"] }
            - { name: orderBy, type: "DateTime!", subgraphs: [sg:promise], reads: ["sch:delivery-promise#order_by"] }
            - { name: confidence, type: "Confidence!", subgraphs: [sg:promise], reads: ["sch:delivery-promise#confidence"] }
      - modify: sch:gql-product
        set:
          keys:
            - { fields: [sku], in: [sg:product, sg:pricing, sg:inventory, sg:cart, sg:search, sg:promise] }
            - { fields: [id], in: [sg:product, sg:reviews] }
      - add: field
        into: sch:gql-product
        value: { name: deliveryPromise, args: "region: Region!", type: "DeliveryPromise", subgraphs: [sg:promise], requires: ["sch:gql-stock#fc"], reads: ["sch:delivery-promise#promised_date", "sch:delivery-promise#order_by", "sch:delivery-promise#confidence"], cache: [{ at: st:promise-redis, ttl: 60 }], cache_control: { max_age: 60 }, note: "Empty when no stock anywhere, so the type stays nullable ([[risk:non-null-promise]]). Public: the region is an argument and part of the edge key ([[dec:region-in-key]])." }
  # ── Fulfilment and Storefront: a moved promise purges the edge
  - id: chg:purge-on-promise
    title: "promise.changed purges the SKU at the edge and in the gateway, for every region"
    why: >-
      ProductPromise lives at the edge for 60 s per region ([[chg:split-product-page]]). A 60-second life alone means
      Anna can see Thursday for a minute after Berlin sold out ([[sc:berlin-sells-out]]). The purger already
      turns price and stock events into purges by SKU; the promise event joins them ([[dec:purge-and-ttl]]).
      One surrogate-key purge per SKU drops all six regional copies ([[q:surrogate-purge-regions]]).
    decisions: [dec:purge-and-ttl]
    rollout: "The purger consumes `promise.changed` from M1; the caches below list it. After each purge it asks the Promise service for the three busiest regions to warm the cache. The 60-second life is the backstop if the purger is down."
    ops:
      - modify: msg:promise-changed
        append: { consumers: [svc:cache-purger] }
      - modify: st:edge-cache
        append: { invalidated_by: [msg:promise-changed] }
      - modify: st:gateway-entity-cache
        append: { invalidated_by: [msg:promise-changed] }
      - add: flow
        value:
          id: flow:promise-change-purge
          name: A moved promise purges every cache
          actor: System
          trigger: "Fulfilment publishes `promise.changed` for a SKU."
          outcome: "Within seconds neither the edge nor the gateway serves the old promise for the SKU in any region. ProductPage's copy is purged too and refilled unchanged."
          steps:
            - id: flow:promise-change-purge#evict-redis
              from: svc:promise
              to: svc:promise
              via: internal
              action: Purge the promise keys
              purges: [st:promise-redis]
              logic: "Deletes `promise:{sku}:*` in [[st:promise-redis]] before publishing, so a refill after the purge cannot read the old value."
            - id: flow:promise-change-purge#publish
              from: svc:promise
              to: st:fulfilment-events
              via: msg:promise-changed
              action: Announce the moved promise
              reads: [sch:delivery-promise]
            - id: flow:promise-change-purge#take-event
              from: st:fulfilment-events
              to: svc:cache-purger
              via: msg:promise-changed
              action: Take the event
            - id: flow:promise-change-purge#purge-edge
              from: svc:cache-purger
              to: svc:fastly
              via: api:fastly-purge
              action: Purge the surrogate key
              purges: [st:edge-cache]
              logic: "One call per SKU purges ProductPromise in every region, because all six copies carry the SKU. ProductPage carries it too and is refilled unchanged."
              fails: "Retried for a minute; after that the 60-second life is the backstop."
            - id: flow:promise-change-purge#purge-gateway
              from: svc:cache-purger
              to: svc:graph-gateway
              via: api:gateway-invalidate
              action: Purge the Product entity
              purges: [st:gateway-entity-cache]
              logic: "Drops the cached promise pieces for the SKU, so the mini cart's lines are right too."
            - id: flow:promise-change-purge#warm
              from: svc:cache-purger
              to: svc:promise
              via: api:promise-get
              action: Warm the promise for the SKU
              logic: "Reads the promise for the SKU in the three busiest regions, so the first shopper after the purge finds [[st:promise-redis]] filled instead of paying for a 40 ms miss."
              reads: [sch:delivery-promise]
              fails: "Skipped; the first shopper in each region fills the cache, as before."
  # ── Pricing: price moves to a new subgraph, step one
  - id: chg:price-v2-expand
    title: "Pricing adds a pricing-v2 subgraph that can serve price, at 0 % of requests"
    why: >-
      The Kotlin pricing subgraph resolves one product at a time and cannot batch. A Go rewrite batches the
      lookups and shares the same Redis. Moving a field between subgraphs is a migration, not an edit
      ([[dec:price-progressive-override]]): first the new subgraph claims the field with `@override` at 0 %, so
      the graph still composes and no request moves.
    decisions: [dec:price-progressive-override]
    rollout: "Publish pricing-v2 with `@override(from: \"pricing\", label: \"percent(0)\")`. Nothing a shopper can see changes."
    ops:
      - add: service
        value:
          id: svc:pricing-graph-v2
          name: Pricing graph service v2
          team: team:pricing
          kind: service
          tech: "Go · gqlgen"
          does: "Adds price to Product, batched"
          summary: "Replaces the Kotlin pricing subgraph. Resolves `price` for many products in one call to [[api:pricing-get-price]]; shares [[st:price-redis]]."
      - add: subgraph
        value:
          id: sg:pricing-v2
          name: Pricing subgraph v2
          graph: graph:storefront
          service: svc:pricing-graph-v2
          summary: "Takes over `price` and `Money` from the pricing subgraph, progressively."
          batching: dataloader
          cache_control_default: 300
          timeout_ms: 500
      - modify: st:price-redis
        append: { access: [{ svc: svc:pricing-graph-v2, mode: readwrite }] }
      - modify: msg:price-published
        append: { consumers: [svc:pricing-graph-v2] }
      - modify: sch:gql-product
        set:
          keys:
            - { fields: [sku], in: [sg:product, sg:pricing, sg:pricing-v2, sg:inventory, sg:cart, sg:search, sg:promise] }
            - { fields: [id], in: [sg:product, sg:reviews] }
      - modify: "sch:gql-money#amount"
        append: { subgraphs: [sg:pricing-v2] }
        set: { shareable: true }
      - modify: "sch:gql-money#currency"
        append: { subgraphs: [sg:pricing-v2] }
        set: { shareable: true }
      - modify: "sch:gql-product#price"
        append: { subgraphs: [sg:pricing-v2] }
        set: { override: { from: sg:pricing, percent: 0 } }
  # ── Catalog: the old number is on its way out
  - id: chg:deprecate-lead-time
    title: "Product.leadTimeDays is deprecated in favour of deliveryPromise"
    why: "Two delivery answers on one type are one too many. The registry shows three operations select it today, all the storefront's, plus an iOS version nobody can force to update."
    rollout: "`@deprecated(reason: \"Use deliveryPromise\")` in the product subgraph's SDL; registry field-usage alerts at zero before M3 removes it."
    ops:
      - deprecate: "sch:gql-product#leadTimeDays"
        replaced_by: "sch:gql-product#deliveryPromise"
      - modify: "sch:catalog-product#lead_time_days"
        set:
          note: "No longer served by the subgraph once nothing selects `leadTimeDays`; the column is dropped in M3."
  # ── Storefront: the page asks twice
  - id: chg:split-product-page
    title: "The product page sends a second, public operation, ProductPromise, with the region in its edge key"
    why: >-
      Adding `deliveryPromise` to ProductPage grew its query plan from two round trips to three and put the region
      into every page's key. The cache rules alone give ProductPage a 30 s life; it has a 600 s override because
      stock is shown only as in or out. A date that changes per region breaks that reason, and the edge hit ratio
      fell to 58 % in August. So ProductPage stays exactly as it is, and a second operation asks only for the
      promise ([[dec:split-query]]). That operation is not private: *per region* is public, so `region` goes into
      the edge key and Fastly keeps six copies for 60 s ([[dec:region-in-key]]). Private is a cache hint the
      customer subgraph sets on `me`; the plan derives it from `auth`.
    decisions: [dec:split-query, dec:region-in-key]
    rollout: >-
      Behind the `pdp_promise_graph` flag, country by country, Sweden first. The second operation is sent after first
      paint and never blocks the hero. Registered as a persisted query so the client sends an id and the edge can cache the GET.
    ops:
      - add: operation
        value:
          id: gql:product-promise
          name: ProductPromise
          kind: query
          graph: graph:storefront
          screens: [scr:pdp#delivery]
          client: svc:storefront-web
          method: GET
          persisted: apq
          trigger: load
          summary: "Sent after first paint, from the client. Public: the region is a variable, so it is part of the edge key and nothing in the answer depends on who is signed in."
          document: |
            query ProductPromise($sku: ID!, $region: Region!) {
              product(sku: $sku) {
                sku
                deliveryPromise(region: $region) { date orderBy confidence }
              }
            }
          cache:
            - { at: st:edge-cache, ttl: 60, key: { operation: id, variables: [sku, region], headers: [Accept-Language] }, reason: "The cache rules alone give 30 s, because of `stock { fc }`, which the gateway fetches only to feed `@requires`. `promise.changed` and `stock.changed` purge the SKU on every move, so 60 s is acceptable." }
          plan_check: { fetches: 3, round_trips: 3, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/ProductPromise/plan" }
      - modify: scr:pdp
        set:
          summary: "Three operations: [[gql:product-page]] fills the hero, price and stock from the edge; [[gql:product-promise]] fills the delivery line a moment later; [[gql:product-reviews]] fills the reviews on scroll."
          image: assets/pdp-tobe.svg
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=88-1201"
          mockup: mockups/walking.html
      - add: region
        into: scr:pdp
        value:
          id: scr:pdp#delivery
          name: Delivery line
          shows: "*Get it by Thu 8 Oct · order by 14:00 Mon*. A skeleton line until ProductPromise answers; *Delivery date on request* when there is no promise."
          reads: ["sch:gql-product#deliveryPromise"]
          at: { x: 55, y: 46, w: 43, h: 8 }
      - modify: "scr:pdp#add-to-cart"
        set:
          at: { x: 55, y: 56, w: 43, h: 14 }
      - modify: "scr:pdp#reviews"
        set:
          at: { x: 55, y: 72, w: 43, h: 22 }
      - add: step
        into: flow:browse-product
        after: "flow:browse-product#open"
        value:
          id: flow:browse-product#promise
          from: svc:storefront-web
          to: svc:graph-gateway
          via: gql:product-promise
          case: miss
          action: Ask for the promise
          screen: scr:pdp#delivery
          logic: "From the client after first paint. The edge answers from the copy for the shopper's region; on a miss, product, then inventory for the warehouse, then the promise subgraph: three round trips, once a minute per region."
          fails: "The delivery line shows *Delivery date on request*; the hero, price and stock are already on screen."
  # ── Storefront: the page stops reading the old number
  - id: chg:pdp-drops-lead-time
    title: "ProductPage stops selecting leadTimeDays; the stock region says only *In stock*"
    why: "The edge key does not change and neither does the query plan (product, then pricing and inventory in parallel). The document just loses one field."
    decisions: [dec:split-query]
    rollout: "With `pdp_promise_graph`. A new persisted-query id is registered; the old one keeps answering until M3."
    ops:
      - modify: gql:product-page
        set:
          document: |
            query ProductPage($sku: ID!) {
              product(sku: $sku) {
                sku
                name
                imageUrl
                price { amount currency }
                stock { available }
              }
            }
      - modify: "flow:browse-product#render"
        set:
          logic: "The stock region shows *In stock*; the delivery line is a skeleton until [[flow:browse-product#promise]] answers. The response still carries `Surrogate-Key: <sku>`."
      - modify: "scr:pdp#stock"
        set:
          name: Stock
          shows: "*In stock*. The delivery text has moved to its own line."
          reads: ["sch:gql-product#stock"]
  # ── Storefront: the cart lines carry it
  - id: chg:cart-shows-promise
    title: "AddToCart and CartSummary return the promise per line; the cart's static text is deprecated"
    why: >-
      `CartLine.product` is a bare reference by `sku` ([[sch:gql-cart-line#product]]) the cart subgraph cannot
      fill, so the gateway asks the product subgraph for the name and image, the inventory subgraph for the
      warehouse the promise needs, and then the promise subgraph ([[sc:storefront-dev]]). CartSummary is private
      because it goes through `me`; the gateway's entity cache answers the repeated products per sku. The
      cart subgraph's *3–5 working days* is computed from `leadTimeDays` and is replaced by the per-line dates.
    rollout: "With `pdp_promise_graph`. Both operations are private already, so no edge change. The region comes from the customer's saved address or the shopper's market, passed as a variable."
    ops:
      - modify: gql:cart-summary
        set:
          document: |
            query CartSummary($region: Region!) {
              me {
                cart {
                  id
                  lines {
                    id
                    qty
                    unitCents
                    product { sku name imageUrl deliveryPromise(region: $region) { date } }
                  }
                  subtotalCents
                  currency
                  estimatedDelivery
                }
              }
            }
          plan_check: { fetches: 5, round_trips: 4, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/CartSummary/plan" }
      - modify: gql:add-to-cart
        set:
          document: |
            mutation AddToCart($sku: ID!, $qty: Int!, $region: Region!) {
              addToCart(sku: $sku, qty: $qty) {
                id
                lines {
                  id sku qty unitCents
                  product { deliveryPromise(region: $region) { date } }
                }
                subtotalCents
                currency
                estimatedDelivery
              }
            }
      - deprecate: "sch:gql-cart#estimatedDelivery"
        replaced_by: "sch:gql-product#deliveryPromise"
      - modify: "flow:add-to-cart#show"
        set:
          logic: "The mutation's response fills the mini cart; each line shows its own *Get it by*."
      - modify: scr:mini-cart
        set:
          summary: "Slides in after add-to-cart or from the header. Each line shows its promise."
          image: assets/mini-cart-tobe.svg
          mockup: mockups/walking.html
          figma: "https://www.figma.com/design/AF2storefront/Storefront?node-id=88-1402"
      - modify: "scr:mini-cart#lines"
        set:
          shows: "Each line with image, name, qty, unit price and *Get it by Thu 8 Oct*."
          reads: ["sch:gql-cart#lines", "sch:gql-product#deliveryPromise"]
  # ── Pricing: price moves, step two
  - id: chg:price-v2-migrate
    title: "Ten percent of price requests are served by pricing-v2"
    why: "The override label goes from 0 to 10 %: the gateway sends that share of `price` fetches to the new subgraph. The shopper sees the same prices; Pricing compares the two subgraphs' answers per request for a week before going further."
    decisions: [dec:price-progressive-override]
    rollout: "Set the percentage in the registry, not in code; rollback is setting it to 0. 10 % → 50 % → 100 % are steps of this window, recorded in the registry's history; the plan keeps the first rung."
    ops:
      - modify: "sch:gql-product#price"
        set: { override: { from: sg:pricing, percent: 10 } }
  # ── Catalog: remove
  - id: chg:retire-lead-time
    title: "Remove leadTimeDays from the graph and the catalogue"
    why: "Once the registry shows zero selections for 14 days there is no reason to keep serving it."
    rollout: "M3 + 14 clean days. The product subgraph drops the field and the read copy drops the column. The old ProductPage persisted id is unregistered in the same PR."
    ops:
      - remove: "sch:gql-product#leadTimeDays"
      - remove: "sch:catalog-product#lead_time_days"
      - modify: "flow:project-product#project"
        set:
          logic: "Projects the product without `lead_time_days`; the column and the field are gone."
  # ── Checkout: remove the static text
  - id: chg:retire-cart-static-text
    title: "Remove Cart.estimatedDelivery and the cart's static text"
    why: "The per-line dates say it better, and the field's only job was to repeat a number that is gone."
    rollout: "M3, after the registry shows no selections of `Cart.estimatedDelivery`. The cart subgraph deletes its resolver and the Redis field."
    ops:
      - modify: gql:cart-summary
        set:
          document: |
            query CartSummary($region: Region!) {
              me {
                cart {
                  id
                  lines {
                    id
                    qty
                    unitCents
                    product { sku name imageUrl deliveryPromise(region: $region) { date } }
                  }
                  subtotalCents
                  currency
                }
              }
            }
      - modify: gql:add-to-cart
        set:
          document: |
            mutation AddToCart($sku: ID!, $qty: Int!, $region: Region!) {
              addToCart(sku: $sku, qty: $qty) {
                id
                lines {
                  id sku qty unitCents
                  product { deliveryPromise(region: $region) { date } }
                }
                subtotalCents
                currency
              }
            }
      - remove: "sch:gql-cart#estimatedDelivery"
      - remove: "sch:cart#estimated_delivery_text"
      - modify: "scr:mini-cart#summary"
        set:
          shows: "Subtotal. The delivery dates are on the lines."
          reads: ["sch:gql-cart#subtotalCents"]
  # ── Pricing: price moves, step three
  - id: chg:price-v2-contract
    title: "pricing-v2 owns price; the old pricing subgraph is deprecated"
    why: "At 100 % for two weeks with identical answers, the override is removed and the old subgraph stops owning anything. Cache ownership follows: the price cache and its purging belong to the new service."
    decisions: [dec:price-progressive-override]
    rollout: "Publish pricing-v2 without the override and the old subgraph without the field, in that order. The Kotlin service is deleted the quarter after."
    ops:
      - modify: "sch:gql-product#price"
        drop: { subgraphs: [sg:pricing] }
        set: { override: null }
      - modify: sch:gql-product
        set:
          keys:
            - { fields: [sku], in: [sg:product, sg:pricing-v2, sg:inventory, sg:cart, sg:search, sg:promise] }
            - { fields: [id], in: [sg:product, sg:reviews] }
      - modify: "sch:gql-money#amount"
        drop: { subgraphs: [sg:pricing] }
      - modify: "sch:gql-money#currency"
        drop: { subgraphs: [sg:pricing] }
      - modify: msg:price-published
        drop: { consumers: [svc:pricing-graph] }
      - modify: "flow:price-change-purge#evict-redis"
        set: { to: svc:pricing-graph-v2 }
      - modify: st:price-redis
        set: { owner: svc:pricing-graph-v2 }
      - deprecate: sg:pricing
        replaced_by: sg:pricing-v2

# ─────────────────────────────────────────────── chapter 6: How we prove it
tests:
  - id: tst:promise-subgraph-contract
    level: contract
    name: "The promise subgraph resolves Product by sku and returns deliveryPromise for the region it is given"
    given: "An `_entities` request for `Product { sku: \"FJ2-TENT\", stock: { fc: \"BER\" } }` and `region: SE-S`"
    when: "The promise subgraph answers"
    then: "`deliveryPromise` is `{ date: 2026-10-08, orderBy: 2026-10-05T14:00+02:00, confidence: high }`; for a SKU with no stock it is `null` and no error; the answer does not change with the session"
    proves: [chg:promise-subgraph]
    walks: ["sg:promise", "flow:browse-product#promise"]
    owner: team:fulfilment
    env: ci
  - id: tst:inventory-requires-contract
    level: contract
    name: "The inventory subgraph returns stock { fc } for a batch of Product keys"
    given: "Forty `Product { sku }` representations"
    when: "The inventory subgraph answers `_entities`"
    then: "Forty stocks with their warehouse from the snapshot in one fetch; no WMS call"
    proves: [chg:promise-subgraph]
    walks: ["sg:inventory", "flow:sync-stock#snapshot"]
    owner: team:fulfilment
    env: ci
  - id: tst:composition
    level: service
    name: "The graph composes with the promise and pricing-v2 subgraphs and its query plans are what the registry says"
    given: "The nine published subgraph schemas"
    when: "Composition runs in the gateway repo's CI, then the registry plans the five operations"
    then: "No composition errors; ProductPage keeps 3 fetches in 2 round trips; ProductPromise is 3 fetches in 3 round trips; SearchResults is 1 fetch; the `@override` on price is accepted"
    proves: [chg:promise-subgraph, chg:price-v2-expand]
    walks: ["gql:product-page", "gql:product-promise", "gql:search-results"]
    owner: team:storefront
    env: ci
  - id: tst:promise-purge
    level: integration
    name: "promise.changed purges the SKU at the edge in every region and in the gateway within 5 s"
    given: "Warm edge copies of ProductPromise for FJ2-TENT in SE-S and DE-N, and a warm gateway entity cache"
    when: "`promise.changed` for FJ2-TENT is published"
    then: "Both regional copies are misses on the next request and return the new date; the gateway's promise piece is gone; ProductPage is refilled unchanged"
    proves: [chg:purge-on-promise]
    walks: ["flow:promise-change-purge#evict-redis", "flow:promise-change-purge#purge-edge", "flow:promise-change-purge#purge-gateway", "gql:product-promise"]
    owner: team:storefront
    env: staging
  - id: tst:purger-contract
    level: contract
    name: "The purger turns promise.changed into one Fastly purge and one gateway purge per SKU"
    given: "A `promise.changed` event for FJ2-TENT with three regions changed"
    when: "The purger consumes it against fakes of the Fastly and gateway APIs"
    then: "Exactly one `POST /purge/FJ2-TENT` and one `POST /invalidate` for type Product, key FJ2-TENT; a failed call is retried for a minute"
    proves: [chg:purge-on-promise]
    walks: ["flow:promise-change-purge#publish", "flow:promise-change-purge#take-event", "flow:promise-change-purge#purge-edge", "flow:promise-change-purge#purge-gateway"]
    owner: team:storefront
    env: ci
  - id: tst:pricing-v2-contract
    level: contract
    name: "pricing-v2 returns the same price as the pricing subgraph for a batch of Product keys"
    given: "Forty `Product { sku }` representations and a Swedish market"
    when: "Both pricing subgraphs answer `_entities`"
    then: "Forty identical prices from each, in one fetch from pricing-v2; pricing-v2 reads and fills the same Redis keys"
    proves: [chg:price-v2-expand]
    walks: ["sg:pricing-v2"]
    owner: team:pricing
    env: ci
  - id: tst:lead-time-deprecated
    level: unit
    name: "leadTimeDays is marked deprecated with a reason"
    given: "The product subgraph's SDL"
    when: "Introspected"
    then: "`Product.leadTimeDays` has `@deprecated(reason: \"Use deliveryPromise\")`"
    proves: [chg:deprecate-lead-time]
    walks: ["sg:product"]
    owner: team:catalog
    env: ci
  - id: tst:product-page-plan
    level: contract
    name: "The new ProductPage document keeps the same query plan and the same edge key"
    given: "The old and new ProductPage documents"
    when: "Both are planned and sent through staging Fastly"
    then: "Same fetch tree (3 fetches, 2 round trips); `leadTimeDays` absent from the new one; the new persisted id is a HIT on the second request"
    proves: [chg:pdp-drops-lead-time]
    walks: ["gql:product-page"]
    owner: team:storefront
    env: staging
  - id: tst:product-promise-edge-key
    level: integration
    name: "ProductPromise is public and cached at the edge per region for 60 s"
    given: "Fastly staging in front of the gateway"
    when: "ProductPromise is sent twice for the same sku from SE-S, then once from DE-N, then ProductPage twice"
    then: "No response carries `Cache-Control: private`; the second SE-S request is an edge HIT; DE-N is a MISS with a different date; the second ProductPage is a HIT"
    proves: [chg:split-product-page]
    walks: ["gql:product-promise", "gql:product-page"]
    owner: team:storefront
    env: staging
  - id: tst:region-from-market
    level: unit
    name: "The region variable falls back to the shopper's market when there is no saved address"
    given: "A session in the SE market with no saved address"
    when: "The front end picks `region` for the promise"
    then: "`region` is SE-S, never empty"
    proves: [chg:split-product-page]
    walks: ["flow:view-cart#render"]
    owner: team:storefront
    env: ci
  - id: tst:pdp-renders-promise
    level: service
    name: "The product page paints from ProductPage and fills the delivery line from ProductPromise"
    given: "A tent in Berlin, a shopper in Malmö, `pdp_promise_graph` on for SE"
    when: "The page renders"
    then: "The hero, price and *In stock* are in the server HTML; the delivery line is a skeleton; after ProductPromise it reads *Få det tors 8 okt · beställ före 14:00 mån*"
    proves: [chg:split-product-page, chg:pdp-drops-lead-time]
    walks: ["flow:browse-product#open", "flow:browse-product#promise", "flow:browse-product#render"]
    owner: team:storefront
    env: ci
  - id: tst:cart-stub-contract
    level: contract
    name: "The cart subgraph returns product as a bare reference and the gateway completes the promise"
    given: "A cart with two lines"
    when: "AddToCart is planned and run"
    then: "The cart fetch returns `product { __typename sku }` only; the inventory and promise subgraphs are asked for both skus in one fetch each; `deliveryPromise.date` per line"
    proves: [chg:cart-shows-promise]
    walks: ["sg:cart", "flow:add-to-cart#press"]
    owner: team:checkout
    env: ci
  - id: tst:cart-summary-private
    level: integration
    name: "CartSummary is never cached at the edge and its product pieces come from the gateway cache"
    given: "A signed-in shopper with two lines, a warm gateway entity cache"
    when: "CartSummary is sent twice"
    then: "Both responses are edge PASS with `Cache-Control: private`; the second has no fetch to the product subgraph for the two skus; each line carries its date; the query plan is 4 round trips cold"
    proves: [chg:cart-shows-promise]
    walks: ["flow:view-cart#open", "gql:cart-summary"]
    owner: team:storefront
    env: staging
  - id: tst:price-override-10
    level: integration
    name: "With the override at 10 %, one request in ten is served by pricing-v2 and prices do not differ"
    given: "The override set to 10 % in staging with the shadow comparison on"
    when: "A thousand ProductPage requests run"
    then: "About a hundred `price` fetches go to pricing-v2; the shadow comparison finds zero differences; p95 for those fetches is lower"
    proves: [chg:price-v2-migrate]
    walks: ["gql:product-page", "sg:pricing-v2"]
    owner: team:pricing
    env: staging
  - id: tst:retire-nothing-selects-lead-time
    level: integration
    name: "No operation selects leadTimeDays for 14 days"
    given: "Registry field usage for `Product.leadTimeDays`"
    when: "M2 has been live for 14 days"
    then: "Zero requests; the old ProductPage persisted id has had zero hits"
    proves: [chg:retire-lead-time]
    walks: ["flow:browse-product#open", "flow:project-product#project"]
    owner: team:catalog
    env: prod
  - id: tst:retire-cart-text
    level: contract
    name: "Cart.estimatedDelivery is gone and the mini cart still renders"
    given: "The cart subgraph SDL and the registry usage for the field"
    when: "Composition runs without the field"
    then: "No composition errors; zero selections in the last 14 days; the mini cart shows dates on the lines and no summary text"
    proves: [chg:retire-cart-static-text]
    walks: ["sg:cart", "gql:cart-summary"]
    owner: team:checkout
    env: ci
  - id: tst:price-contract-clean
    level: integration
    name: "With the override removed pricing-v2 serves every price and the old subgraph serves none"
    given: "Production traffic for 14 days at 100 %"
    when: "The override is removed and the old subgraph publishes without `price`"
    then: "Zero fetches reach the old pricing subgraph; `price.published` still purges the price cache once, in the new service's Redis client"
    proves: [chg:price-v2-contract]
    walks: ["sg:pricing-v2", "flow:price-change-purge#evict-redis"]
    owner: team:pricing
    env: prod
  - id: tst:anna-end-to-end
    level: e2e
    name: "Anna's tent: Thursday on the page and the cart, Monday a minute after Berlin sells out"
    given: "Staging with a Berlin-only tent, a Malmö shopper, Fastly in front"
    when: "She opens the page, adds to cart, and the last Berlin tent is picked for someone else"
    then: "The page paints from the edge, the delivery line says Thursday, the mini cart line says Thursday; after `promise.changed` the next page view says Monday within 60 s and the edge hit ratio for ProductPage is unchanged"
    proves: [chg:promise-subgraph, chg:split-product-page, chg:purge-on-promise, chg:cart-shows-promise]
    walks: ["flow:browse-product#open", "flow:browse-product#promise", "flow:browse-product#render", "flow:add-to-cart#press", "flow:add-to-cart#show", "flow:promise-change-purge#publish", "flow:promise-change-purge#purge-edge"]
    owner: team:product
    env: staging

# ─────────────────────────────────────────────── chapter 7: How we build it
milestones:
  - id: ms:promise-in-graph
    name: "M1 · The promise is in the graph"
    exit: "The promise subgraph is composed, `promise.changed` purges the edge and the gateway ([[tst:promise-purge]]), and pricing-v2 is published at 0 %. Nothing shopper-facing."
    due: "2026-11-06"
  - id: ms:pdp-shows-it
    name: "M2 · Sweden sees it"
    exit: "In SE the product page and the mini cart show the promise; ProductPage's edge hit ratio is read for two weeks and stays ≥ 90 % ([[tst:anna-end-to-end]]); ten percent of price requests run on pricing-v2."
    due: "2026-11-27"
  - id: ms:lead-time-retired
    name: "M3 · The old number is gone"
    exit: "All countries switched; `leadTimeDays` and the cart's static text removed ([[tst:retire-nothing-selects-lead-time]]); pricing-v2 owns `price` alone."
    due: "2026-12-11"

execution:
  summary: >-
    One new subgraph, one new field, and the page asks twice: a question about the product the edge keeps for ten
    minutes, and a question about its promise the edge keeps for a minute per region. The old number is
    deprecated the day the new one is on the page and removed two weeks after nothing selects it. Alongside,
    the price changes hands between subgraphs in three small steps.
  paths:
    - name: The promise reaches the page
      summary: "Through the graph, in its own operation, kept at the edge by region."
      steps:
        - { label: Compose, detail: "The promise subgraph publishes; the gateway composes it ([[sg:promise]])." }
        - { label: Ask, detail: "The page sends ProductPromise after first paint ([[flow:browse-product#promise]])." }
        - { label: Answer, detail: "Edge copy for the region, else product, inventory, promise ([[gql:product-promise]])." }
        - { label: Purge, detail: "`promise.changed` purges the SKU everywhere ([[flow:promise-change-purge]])." }
    - name: The price changes hands
      summary: "Expand, migrate, remove: no request is ever unowned."
      steps:
        - { label: Expand, detail: "pricing-v2 claims `price` at 0 % ([[chg:price-v2-expand]])." }
        - { label: Migrate, detail: "The override label rises to 10 % and beyond ([[chg:price-v2-migrate]])." }
        - { label: Remove, detail: "The override and the old ownership go ([[chg:price-v2-contract]])." }
  caveats:
    - "ProductPromise is three round trips on a miss; the edge, not the graph, carries the traffic."
    - "A shopper whose region is unknown gets no promise and *Delivery date on request*, never a wrong region's date."
    - "Surrogate-key purging across regions is assumed to work as it does for price; [[q:surrogate-purge-regions]] checks that before M2."

