# Alder & Finch's storefront graph: the same fictional EU outdoor retailer as plans/delivery-promise, and the plan
# that comes after it. By now plans/delivery-promise has shipped. The Promise service and `promise.changed` run
# today, the graph gateway below has replaced the storefront BFF that plan names, the cart service is the cart
# subgraph, and the catalog read API is the product subgraph. Seven subgraphs (product, search, pricing,
# inventory, cart, customer, reviews) sit behind Apollo Router, which sits behind Fastly. This plan puts the
# delivery promise into the graph without losing the edge cache: a new promise subgraph, one new field, one query
# split in two, one field deprecated and then removed, and the price moved to a new pricing subgraph with a
# progressive @override. Teams, repos, commit links and screenshots are fictional; the `sources` follow the
# permalink format but point at repositories that do not exist.
#
# Written against docs/09-design-federated-graph.md v2 (§2 model, §6 example): `graphs`, `subgraphs`,
# `operations`, `schemas[].kind: graph-type`, the field extensions, flat cache props on stores, `case` and
# `purges` on steps. The documents are parsed; paths, variables and plans are derived, never authored twice.

meta:
  id: storefront-graph
  title: "Show the delivery promise through the graph"
  version: "0.2"
  date: "2026-10-02"
  start: "2026-10-19"
  status: draft
  authors: ["Storefront", "Fulfilment", "Catalog", "Pricing"]
  appetite: "8 weeks · 3 milestones"
  repos:
    - alder-finch/storefront-graph
    - alder-finch/storefront
    - alder-finch/pim
    - alder-finch/pricing
    - alder-finch/fulfilment
    - alder-finch/checkout
    - alder-finch/customers
    - alder-finch/search
    - alder-finch/content

# ─────────────────────────────────────────────── chapter 1: Why
problem:
  summary: >-
    The product page is one GraphQL operation, **ProductPage**. Three subgraphs answer it through the gateway, and
    the edge keeps each answer for ten minutes, so 92 % of product-page requests never reach the gateway. Fulfilment
    now computes the delivery promise ([[sch:delivery-promise]]). It is per region and moves with stock, yet the page
    still shows the static `leadTimeDays` from the catalogue. This plan adds a **promise subgraph** and a
    `Product.deliveryPromise` field, and splits the page: ProductPage stays as it is, and a new **ProductPromise**
    operation carries the promise. ProductPromise is public, has the region in its edge key and lives for 60
    seconds. In the same window the price moves to a new pricing subgraph with a progressive `@override`, and
    `leadTimeDays` is removed.
  why: >-
    The first attempt (branch `pdp-promise-spike`, August) added `deliveryPromise` to ProductPage. The field needs
    the warehouse from `stock`, so the page grew a third round trip. It also broke the reason for the page's 600 s
    edge override ("stock is in or out only"): the page now showed a per-region date, so its life had to fall to 60 s
    and `region` joined every page's key. Responses varied by region and went stale every minute. In the DE canary
    the edge hit ratio fell from **92 % to 58 %** within an hour and gateway p95 rose from 95 ms to **310 ms**. The
    canary was rolled back the same afternoon. The promise is wanted on the page ([[sc:anna-malmo]]); the cache is
    wanted more. Nobody could say, from the repositories, which subgraph owned which field or which cache the spike
    had broken, which is why this plan draws it.
  goals:
    - "A shopper sees *Get it by Thu 8 Oct* on the product page and the mini cart, for their region, within a minute of a stock change."
    - "ProductPage's edge hit ratio stays at or above 90 % and its query plan does not change."
    - "The promise reaches the page through the graph, not through a side REST call from the page."
    - "`price` is served by the pricing-v2 subgraph for every request by M3, with no change a shopper can see."
    - "`leadTimeDays` is gone from the graph by M3, once no client selects it. iOS ≤ 4.2 cannot be forced to update and is the open case ([[q:ios-lead-time]])."
  non_goals:
    - "The promise on search-result tiles. Six regions × every listing page is a different cache problem ([[dec:no-promise-on-tiles]])."
    - "Checkout and the order. The promise is already frozen on the order by plans/delivery-promise; this plan stops at the mini cart."
    - "Moving pricing or inventory data into the gateway's entity cache beyond what it caches today."
    - "`@defer`. It would keep the region in the page's key and the third round trip on every miss ([[dec:split-query]])."
  metrics:
    - { name: "ProductPage edge hit ratio", today: "92 % (30 days)", target: "≥ 90 % with the promise on the page" }
    - { name: "ProductPromise edge hit ratio", today: "n/a (new)", target: "≥ 80 % with the region in the key" }
    - { name: "Gateway p95 for ProductPage on a miss", today: "95 ms", target: "unchanged" }
    - { name: "Time from stock change to the page showing a new promise", today: "n/a (static text)", target: "under 60 s" }
    - { name: "Operations selecting `leadTimeDays` (registry field usage)", today: "3", target: "0 by M3, if iOS ≤ 4.2 is settled ([[q:ios-lead-time]])" }
  scenarios:
    - id: sc:anna-malmo
      title: "Anna in Malmö sees Thursday without waiting for it"
      story: >-
        Anna opens the Fjäll 2 tent from Malmö. The hero, price and stock paint from the edge in 15 ms, as today.
        A moment later the delivery line fills in: **Get it by Thu 8 Oct · order by 14:00 Mon**, answered by the
        edge from the copy cached for Sweden-south. She adds the tent to the cart and the mini cart repeats
        Thursday on the line.
      flows: [flow:browse-product, flow:add-to-cart]
    - id: sc:berlin-sells-out
      title: "Berlin sells out and the page says Monday within a minute"
      story: >-
        At 11:40 the last Berlin tent is picked for someone else. Fulfilment publishes `promise.changed`; the
        purger purges the SKU at the edge, for every region at once, and in the gateway's entity cache. Anna's next
        look at the page says **Get it by Mon 12 Oct**. ProductPage was not touched.
      flows: [flow:sync-stock, flow:promise-change-purge]
    - id: sc:storefront-dev
      title: "Priya adds a field and sees who she is about to call"
      story: >-
        Priya on Storefront wants `deliveryPromise` on the cart lines. The plan shows that `CartLine.product` is a
        reference by `sku` the cart subgraph cannot fill, so the gateway asks the product subgraph, the inventory
        subgraph (for `stock { fc }`, which the promise needs) and then the promise subgraph: four teams, one more
        round trip. She did not have to read seven repos.
      flows: [flow:view-cart]
  glossary:
    - { term: "operation", means: "A named query or mutation the front end sends, word for word. Its document is parsed, so fields, variables and the query plan are derived, not written twice ([[gql:product-page]])." }
    - { term: "mutation", means: "An operation that changes data ([[gql:add-to-cart]]). Sent as POST, never cached, and its root fields run one after another." }
    - { term: "the graph", means: "The one GraphQL schema the storefront talks to, composed from the subgraphs ([[graph:storefront]])." }
    - { term: "gateway", means: "The service every operation goes through. It works out which subgraphs answer which fields, runs the fetches and merges the result ([[svc:graph-gateway]])." }
    - { term: "subgraph", means: "One service's slice of the graph, owned by one team ([[sg:product]]). Always written as subgraph · the service that serves it · its team." }
    - { term: "owns a field", means: "The subgraph that resolves a field. Two or more may, if the field is shareable or one of them has taken it over with an override." }
    - { term: "key", means: "The fields that identify one entity (here `sku`), so the gateway can ask another subgraph for *that product*. Shown ⚿." }
    - { term: "round trip", means: "One level of the query plan: fetches that must wait for the keys the previous level returned. Fetches in one level run in parallel." }
    - { term: "fetch", means: "One request from the gateway to one subgraph. An operation is a handful of fetches in two or three round trips." }
    - { term: "cache layer", means: "A place an answer can be remembered: at the edge, in the gateway, or inside a subgraph. The cache path lists them outermost first." }
    - { term: "edge", means: "Fastly, in front of the gateway. It answers persisted GETs without touching the graph ([[st:edge-cache]])." }
    - { term: "hit", means: "A cache layer has the answer, so nothing below it runs." }
    - { term: "miss", means: "A cache layer does not have the answer, so the request falls through to the next layer." }
    - { term: "fills", means: "On the way back, a layer that missed stores the answer it just saw, so the next request hits." }
    - { term: "emptied by", means: "The event or call that purges an entry before its time is up, such as `price.published` reaching the cache purger." }
    - { term: "serves stale", means: "A layer may answer with an entry past its time while it refreshes, or when the layer below is down." }
    - { term: "private field", means: "A field whose answer depends on who is signed in (`auth`). One selected private field makes the whole response uncacheable at a shared layer. *Per region* is not private: a region is just part of the key." }
    - { term: "persisted operation", means: "The client sends an id instead of the document, so the request can be a GET the edge is allowed to cache." }
    - { term: "batched", means: "Many lookups sent as one call (*12 lines in 1 call*) by a loader inside the subgraph. Unbatched, a list becomes one query per row." }
    - { term: "surrogate key", means: "A tag Fastly attaches to a cached object (here the SKU), so one purge call removes every object that mentions it, in every region." }

domain:
  summary: >-
    A **product** is read by the storefront through **the graph**: the catalogue owns its name and images, Pricing
    its price, Fulfilment its stock, and Content its reviews. Each is joined to the product by a **key**: `sku`
    for most, `id` for reviews. A **cart** belongs to the signed-in customer. The **delivery promise** exists in
    Fulfilment already; this plan makes it a field of the product, served by a subgraph of its own.
  concepts:
    - id: con:product
      name: Product
      terms: [product, SKU, item]
      means: "Something we sell. In the graph it is one type with fields from four (soon five) subgraphs, joined by `sku`."
      born_in: svc:pim
      aka:
        - { in: svc:product-graph, as: Product, at: sch:gql-product, note: "The graph type; the piece every subgraph extends." }
        - { in: svc:product-graph, as: CatalogProduct, at: sch:catalog-product, note: "The read copy behind the product subgraph." }
        - { in: svc:pricing, as: Price, at: sch:price }
        - { in: svc:inventory-graph, as: StockSnapshot, at: sch:stock-snapshot }
    - id: con:delivery-promise
      name: Delivery promise
      terms: [promise, delivery promise, delivery date]
      means: "The date a product arrives in a region if ordered before the cutoff. Computed by Fulfilment; this plan puts it on the product in the graph."
      born_in: svc:promise
      relates: [{ to: con:product, as: "is for one" }, { to: con:region, as: "holds for one" }]
      aka:
        - { in: svc:promise, as: DeliveryPromise, at: sch:delivery-promise }
      introduced_by: [chg:promise-subgraph]
    - id: con:cart
      name: Cart
      terms: [cart, basket, mini cart]
      means: "What a shopper has picked. Owned by the cart subgraph and reached through the signed-in customer; its lines reference products by `sku`."
      born_in: svc:cart-graph
      relates: [{ to: con:product, as: "holds many" }]
      aka:
        - { in: svc:cart-graph, as: Cart, at: sch:gql-cart }
        - { in: svc:cart-graph, as: Cart, at: sch:cart, note: "The Redis record behind the type." }
    - id: con:region
      name: Region
      terms: [region, delivery region]
      means: "The area a price and a promise are given for. ProductPromise takes it as a variable, which puts it in the edge key: six regions are six cached copies, not a private response."
      born_in: svc:customer-graph
  stages:
    - id: stage:ask
      name: Ask
      summary: "The page sends an operation; the edge or the gateway answers."
      services:
        - { svc: svc:storefront-web }
        - { svc: svc:fastly }
        - { svc: svc:graph-gateway }
        - { svc: svc:cache-purger, from: [svc:pricing, svc:wms, svc:pim] }
      flows: [flow:browse-product, flow:search-results, flow:add-to-cart, flow:view-cart]
    - id: stage:answer
      name: Answer
      summary: "The subgraphs each resolve their fields."
      services:
        - { svc: svc:product-graph, from: [svc:pim] }
        - { svc: svc:search-graph, from: [svc:search-api] }
        - { svc: svc:pricing-graph, from: [svc:pricing] }
        - { svc: svc:inventory-graph, from: [svc:wms] }
        - { svc: svc:cart-graph }
        - { svc: svc:customer-graph }
        - { svc: svc:reviews-graph }
      flows: [flow:price-change-purge, flow:sync-stock, flow:project-product]
    - id: stage:source
      name: Source
      summary: "The systems of record the subgraphs read from or project."
      services:
        - { svc: svc:pim }
        - { svc: svc:pricing }
        - { svc: svc:wms }
        - { svc: svc:search-api }
        - { svc: svc:promise }
      flows: []

# ─────────────────────────────────────────────── chapter 2: The system today
teams:
  - { id: team:storefront, name: "Storefront", channel: "#team-storefront", colour: 2 }
  - { id: team:catalog, name: "Catalog", channel: "#team-catalog", colour: 5 }
  - { id: team:pricing, name: "Pricing", channel: "#team-pricing", colour: 6 }
  - { id: team:fulfilment, name: "Fulfilment", channel: "#team-fulfilment", colour: 4 }
  - { id: team:checkout, name: "Checkout", channel: "#team-checkout", colour: 1 }
  - { id: team:customers, name: "Customers", channel: "#team-customers", colour: 12 }
  - { id: team:discovery, name: "Discovery", channel: "#team-discovery", colour: 7 }
  - { id: team:content, name: "Content", channel: "#team-content", colour: 8 }
  - { id: team:product, name: "Product management", channel: "#product-commerce", colour: 11 }

services:
  # ── Ask
  - id: svc:storefront-web
    name: Storefront
    team: team:storefront
    kind: ui
    tech: "Next.js · Apollo Client"
    does: "The shop: product pages, search, the mini cart"
    summary: "Server-rendered pages in four locales. Every data need is a named operation against [[graph:storefront]]; queries go out as persisted GETs so the edge can cache them."
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/graphql/client.ts#L1-L60", note: "persisted-query link, GET for queries" }]
  - id: svc:fastly
    name: Fastly
    team: team:storefront
    kind: external
    tech: "CDN"
    does: "Serves cached graph responses at the edge"
    summary: "The edge in front of the gateway. Its cache is [[st:edge-cache]]; its purge API is [[if:fastly-api]]."
  - id: svc:graph-gateway
    name: Graph gateway
    team: team:storefront
    kind: service
    tech: "Apollo Router 1.x"
    does: "Composes the graph and routes each operation to its subgraphs"
    summary: "Works out which subgraphs answer each operation, runs the fetches and merges the result. Keeps an entity cache in Redis (one entry per subgraph, type and key). Owns the graph: composition runs in its repo on every subgraph publish."
    sources:
      - { url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/router.yaml#L1-L80", note: "gateway config: persisted queries, entity cache, headers" }
      - { url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.yaml#L1-L30", note: "the seven subgraphs" }
  - id: svc:cache-purger
    name: Cache purger
    team: team:storefront
    kind: job
    tech: "Go · Kafka consumer"
    does: "Turns catalog, price and stock events into edge and gateway purges"
    summary: "Consumes `product.published`, `price.published` and `stock.changed` and purges the SKU's surrogate key at Fastly and the Product entity in the gateway's cache."
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/purger/main.go#L20-L140" }]
  # ── Answer
  - id: svc:product-graph
    name: Product graph service
    team: team:catalog
    kind: service
    tech: "Node · Apollo Server"
    does: "Serves Product, its name, images and lead time"
    summary: "The catalogue's read copy as a subgraph. Owns the `Product` entity, its `id` and `sku` keys and the `product` root field. Batches catalogue reads with DataLoader."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/subgraph/src/schema.graphql#L1-L70" }]
  - id: svc:search-graph
    name: Search graph service
    team: team:discovery
    kind: service
    tech: "Go · gqlgen"
    does: "Owns the search root and answers it from the search API"
    summary: "Owns `Query.search`. Returns each hit as a `Product` reference and also its `name` and `imageUrl` straight from the search index (`@provides`), so a result list needs no second fetch."
    sources: [{ url: "https://github.com/alder-finch/search/blob/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d/subgraph/schema.graphqls#L1-L40" }]
  - id: svc:pricing-graph
    name: Pricing graph service
    team: team:pricing
    kind: service
    tech: "Kotlin · GraphQL Kotlin"
    does: "Adds price to Product by calling Pricing"
    summary: "Extends `Product` with `price`. Resolves it by calling [[api:pricing-get-price]] and caches the answer in Redis per SKU and market, purged on `price.published`. One call per product: it does not batch."
    sources: [{ url: "https://github.com/alder-finch/pricing/blob/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c/subgraph/src/main/kotlin/pricing/graph/ProductResolver.kt#L10-L90" }]
  - id: svc:inventory-graph
    name: Inventory graph service
    team: team:fulfilment
    kind: service
    tech: "Python · Strawberry"
    does: "Adds stock to Product from a Redis snapshot"
    summary: "Extends `Product` with `stock`. Keeps one snapshot per SKU in Redis, written from `stock.changed`; never calls the WMS on the request path."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/inventory-subgraph/app/schema.py#L1-L60" }]
  - id: svc:cart-graph
    name: Cart graph service
    team: team:checkout
    kind: service
    tech: "Go · gqlgen"
    does: "Owns Cart and the add-to-cart mutation"
    summary: "Owns the `Cart` entity and the `addToCart` mutation, and makes the cart a field of `Customer`. Lines hold the SKU and a price re-read from Pricing at add time; `product` on a line is a bare reference by `sku` the gateway completes. Batches with DataLoader."
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/cart-subgraph/schema.graphqls#L1-L50" }]
  - id: svc:customer-graph
    name: Customer graph service
    team: team:customers
    kind: service
    tech: "Java · DGS"
    does: "Owns the signed-in customer: email, region, saved address"
    summary: "Owns `Customer` and the `me` root field, which needs the shopper session. Everything reached through `me` is therefore private."
    sources: [{ url: "https://github.com/alder-finch/customers/blob/0f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6/subgraph/src/main/resources/schema/customer.graphqls#L1-L30" }]
  - id: svc:reviews-graph
    name: Reviews graph service
    team: team:content
    kind: service
    tech: "Node · Apollo Server"
    does: "Adds customer reviews to Product"
    summary: "Extends `Product` with `reviews`. It only knows a product by its `id`, not its `sku`, so a request that arrives with a `sku` must first ask the product subgraph for the `id`. Batches with DataLoader."
    sources: [{ url: "https://github.com/alder-finch/content/blob/3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b/reviews-subgraph/schema.graphql#L1-L40" }]
  # ── Source
  - id: svc:pim
    name: PIM API
    team: team:catalog
    kind: service
    tech: "Java · Spring Boot"
    does: "Source of truth for products and their attributes"
    summary: "Publishes `product.published` whenever a product changes; the product subgraph projects it."
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/api/src/main/java/pim/PimApplication.java" }]
  - id: svc:pricing
    name: Pricing
    team: team:pricing
    kind: service
    tech: "Kotlin · Ktor"
    does: "Prices every SKU for every region"
    summary: "Holds list prices and promotions; answers price lookups over REST and publishes `price.published`."
    sources: [{ url: "https://github.com/alder-finch/pricing/blob/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c/src/main/kotlin/pricing/Application.kt" }]
  - id: svc:wms
    name: WMS
    team: team:fulfilment
    kind: service
    tech: "Manhattan Active · our integration layer"
    does: "Stock, picking and shipping in the three warehouses"
    summary: "Publishes `stock.changed` per SKU and FC."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/wms/events/stock.py#L1-L40" }]
  - id: svc:search-api
    name: Search API
    team: team:discovery
    kind: service
    tech: "Go · OpenSearch"
    does: "Answers search and listing queries"
    summary: "The search subgraph calls it for `Query.search` and returns the hits."
    sources: [{ url: "https://github.com/alder-finch/search/blob/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d/api/main.go#L1-L50" }]
  - id: svc:promise
    name: Promise
    team: team:fulfilment
    kind: service
    tech: "Python · FastAPI · Kafka consumer"
    does: "Computes and publishes the delivery promise per SKU and region"
    summary: "Built by plans/delivery-promise. Holds one promise per SKU and region in [[st:promise-db]], serves [[api:promise-get]], publishes `promise.changed` when a date moves. Not in the graph today."
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/promise/app/main.py#L1-L80" }]

stores:
  # ── cache layers, outermost first
  - id: st:edge-cache
    name: edge cache
    kind: cache
    tech: "Fastly"
    owner: svc:fastly
    does: "Caches persisted GET responses at the edge"
    layer: edge
    granularity: response
    keyed_by: "operation id · variables · Accept-Language"
    stale: { while_revalidate: 30, if_error: 3600 }
    access: [{ svc: svc:cache-purger, mode: write }]
    purge: "surrogate key per sku, sent by the cache purger"
    invalidated_by: [msg:price-published, msg:product-published, msg:stock-changed]
    observed: { hit_ratio: 0.92, latency_ms: { hit: 15, miss: 120 } }
    notes: "Only operations the client sends as GET with a persisted id are cacheable; mutations and POSTs pass through. 92 % is ProductPage over the last 30 days; SearchResults sits at about 71 %."
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/fastly/vcl/graph.vcl#L1-L90", note: "cache key = operation id + sorted variables + Accept-Language; surrogate keys from the gateway's response header" }]
  - id: st:gateway-entity-cache
    name: gateway entity cache
    kind: cache
    tech: "Apollo Router entity caching · Redis 7"
    owner: svc:graph-gateway
    does: "Remembers entity pieces per subgraph, so a fetch can be skipped"
    layer: gateway
    granularity: entity
    keyed_by: "subgraph · type · key fields · selection hash · scope"
    access: [{ svc: svc:cache-purger, mode: write }]
    purge: "entity type and key (sku) through the gateway's invalidation endpoint"
    invalidated_by: [msg:price-published, msg:product-published, msg:stock-changed]
    observed: { hit_ratio: 0.62, latency_ms: { hit: 8, miss: 95 } }
    notes: "Caches per entity, not per response, so it answers `pricing: hit · inventory: miss` inside one operation. Entries honour each subgraph's `cache_control` and keep private data apart by scope."
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/router.yaml#L40-L72" }]
  - id: st:price-redis
    name: price cache
    kind: cache
    tech: "Redis 7"
    owner: svc:pricing-graph
    does: "Price per sku and market, 5 min, purged on price.published"
    layer: subgraph
    granularity: entity
    keyed_by: "sku · market"
    purge: "key per sku and market"
    invalidated_by: [msg:price-published]
    observed: { hit_ratio: 0.97, latency_ms: { hit: 2, miss: 35 } }
  # ── stores of record
  - id: st:stock-redis
    name: stock snapshot
    kind: cache
    tech: "Redis 7"
    owner: svc:inventory-graph
    does: "One stock snapshot per sku, written from stock.changed"
    notes: "A Redis used as a projection of `stock.changed`, not as a cache layer on the read path. It never falls through to the WMS."
  - { id: st:catalog-read-db, name: catalog-read-db, kind: database, tech: "Postgres 15", owner: svc:product-graph, does: "Read projection of published products" }
  - { id: st:catalog-events, name: catalog.events, kind: topic, tech: "Kafka", owner: svc:pim, does: "product.published" }
  - { id: st:pricing-db, name: pricing-db, kind: database, tech: "Postgres 15", owner: svc:pricing, does: "List prices, rules, promotions" }
  - { id: st:price-events, name: pricing.events, kind: topic, tech: "Kafka", owner: svc:pricing, does: "price.published" }
  - { id: st:fulfilment-events, name: fulfilment.events, kind: topic, tech: "Kafka", owner: svc:wms, does: "stock.changed, promise.changed" }
  - { id: st:cart-cache, name: cart-cache, kind: cache, tech: "Redis 7", owner: svc:cart-graph, does: "Carts, 30-day TTL; the store of record for a cart", notes: "A Redis used as the primary store, not as a cache layer on the read path." }
  - { id: st:customer-db, name: customer-db, kind: database, tech: "Postgres 15", owner: svc:customer-graph, does: "Customers, addresses, consents" }
  - { id: st:reviews-db, name: reviews-db, kind: database, tech: "Postgres 15", owner: svc:reviews-graph, does: "Customer reviews and ratings" }
  - { id: st:promise-db, name: promise-db, kind: database, tech: "Postgres 15", owner: svc:promise, does: "Promises, cutoffs and lead times" }

schemas:
  # ── records behind the subgraphs
  - id: sch:catalog-product
    name: CatalogProduct
    kind: record
    store: st:catalog-read-db
    summary: "The read copy per SKU and locale that the product subgraph serves."
    fields:
      - { name: sku, type: string, required: true, key: true }
      - { name: locale, type: string, required: true, key: true }
      - { name: name, type: string, required: true }
      - { name: images, type: "uri[]", required: true }
      - { name: lead_time_days, type: int, note: "Typed by the category manager years ago; 3 for almost everything. The source of `Product.leadTimeDays`." }
      - { name: publishable, type: bool, required: true }
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/subgraph/db/V3__catalog_product.sql#L1-L30" }]
  - id: sch:price
    name: Price
    kind: record
    store: st:pricing-db
    summary: "List price per SKU and region."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:catalog-product#sku" }
      - { name: region, type: "enum(DE-N, DE-S, NL, FR, SE-S, SE-N)", required: true, key: true }
      - { name: list_cents, type: int, required: true }
      - { name: promo_cents, type: int }
      - { name: currency, type: "enum(EUR, SEK)", required: true }
  - id: sch:stock-snapshot
    name: StockSnapshot
    kind: record
    store: st:stock-redis
    summary: "What the inventory subgraph knows about a SKU: the sum over FCs and which FCs have it."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:catalog-product#sku" }
      - { name: available, type: int, required: true }
      - { name: fcs, type: "string[]", required: true }
      - { name: updated_at, type: timestamptz, required: true }
  - id: sch:cart
    name: Cart
    kind: record
    store: st:cart-cache
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: customer_id, type: uuid, ref: "sch:customer#id" }
      - { name: region, type: string, required: true }
      - { name: lines, type: "CartLine[]", required: true, note: "id, sku, qty, unit_cents" }
      - { name: subtotal_cents, type: int, required: true }
      - { name: currency, type: string, required: true }
      - { name: estimated_delivery_text, type: string, note: "*3–5 working days*, from the largest `leadTimeDays` across lines. Static." }
      - { name: status, type: "enum(open, checked_out)", required: true, default: open }
  - id: sch:customer
    name: Customer
    kind: record
    store: st:customer-db
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: email, type: string, required: true, unique: true }
      - { name: region, type: string, note: "From the saved address; falls back to the IP region at the router." }
      - { name: saved_address, type: Address }
  - id: sch:delivery-promise
    name: DeliveryPromise
    kind: record
    store: st:promise-db
    summary: "The current promise for one SKU in one region. Owned by Fulfilment since plans/delivery-promise."
    fields:
      - { name: sku, type: string, required: true, key: true, ref: "sch:catalog-product#sku" }
      - { name: region, type: "enum(DE-N, DE-S, NL, FR, SE-S, SE-N)", required: true, key: true }
      - { name: promised_date, type: date, required: true }
      - { name: order_by, type: timestamptz, required: true }
      - { name: confidence, type: "enum(high, low)", required: true }
      - { name: computed_at, type: timestamptz, required: true }
  - id: sch:review
    name: Review
    kind: record
    store: st:reviews-db
    summary: "One customer review of one product."
    fields:
      - { name: id, type: uuid, required: true, key: true }
      - { name: product_id, type: uuid, required: true, note: "The product's `id`, not its `sku`: Content never learned the SKU." }
      - { name: rating, type: int, required: true }
      - { name: title, type: string }
      - { name: body, type: string, required: true }
      - { name: author, type: string, required: true }
      - { name: created_at, type: timestamptz, required: true }
  # ── payloads
  - id: sch:product-published-v2
    name: product.published v2
    kind: payload
    fields:
      - { name: sku, type: string, required: true }
      - { name: name, type: string, required: true }
      - { name: lead_time_days, type: int }
      - { name: publishable, type: bool, required: true }
      - { name: published_at, type: timestamptz, required: true }
  - id: sch:price-published-v1
    name: price.published v1
    kind: payload
    fields:
      - { name: sku, type: string, required: true }
      - { name: region, type: string, required: true }
      - { name: list_cents, type: int, required: true }
      - { name: promo_cents, type: int }
      - { name: currency, type: string, required: true }
  - id: sch:stock-changed-v1
    name: stock.changed v1
    kind: payload
    fields:
      - { name: sku, type: string, required: true }
      - { name: fc, type: string, required: true }
      - { name: available, type: int, required: true }
  - id: sch:promise-changed-v1
    name: promise.changed v1
    kind: payload
    summary: "One SKU, all regions, whenever any date moves."
    fields:
      - { name: sku, type: string, required: true }
      - { name: promises, type: "RegionPromise[]", required: true, note: "region, promised_date, order_by, confidence" }
      - { name: computed_at, type: timestamptz, required: true }
  # ── graph types: who owns which field
  - id: sch:gql-query
    name: Query
    kind: graph-type
    graph: graph:storefront
    root: query
    summary: "The root. Each root field belongs to the subgraph the gateway asks first."
    fields:
      - { name: product, args: "sku: ID!", type: "Product", subgraphs: [sg:product] }
      - { name: search, args: "q: String!, first: Int", type: "[Product!]!", subgraphs: [sg:search], via: api:search-query, provides: ["sch:gql-product#name", "sch:gql-product#imageUrl"], cache_control: { max_age: 120 }, note: "The search subgraph asks the search API and returns each hit with its name and image, so a result list is one fetch." }
      - { name: me, type: "Customer", subgraphs: [sg:customer], auth: "shopper session", note: "Everything selected through `me` is private to the session." }
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.graphql#L1-L40", note: "composed SDL, Query" }]
  - id: sch:gql-mutation
    name: Mutation
    kind: graph-type
    graph: graph:storefront
    root: mutation
    fields:
      - { name: addToCart, args: "sku: ID!, qty: Int!", type: "Cart!", subgraphs: [sg:cart], via: api:pricing-get-price, auth: "shopper session", note: "Re-reads the price from Pricing so the cart never trusts the page." }
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.graphql#L42-L60" }]
  - id: sch:gql-product
    name: Product
    kind: graph-type
    graph: graph:storefront
    keys:
      - { fields: [sku], in: [sg:product, sg:pricing, sg:inventory, sg:cart, sg:search] }
      - { fields: [id], in: [sg:product, sg:reviews] }
    summary: "The product as the front end sees it. Four subgraphs contribute fields: product, pricing and inventory join by `sku`, reviews by `id`. The cart and search subgraphs are in the `sku` list because they hold a reference to a product, not a product: they own none of its fields. Whether the gateway may ask them for one by `sku`, or they should be stubs it never fetches from, is open ([[q:cart-search-key-stubs]])."
    fields:
      - { name: sku, type: "ID!", subgraphs: [sg:product], note: "The key. The product, pricing and inventory subgraphs can be asked for a product by it; the cart and search subgraphs only hold it ([[q:cart-search-key-stubs]]). The catalogue copy is `sch:catalog-product#sku`." }
      - { name: id, type: "ID!", subgraphs: [sg:product], note: "The catalogue's internal id. Content only knows reviews by this." }
      - { name: name, type: "String!", subgraphs: [sg:product], cache_control: { max_age: 3600 }, note: "From the catalogue copy (`sch:catalog-product#name`) in the product subgraph. The search subgraph declares it @external and provides it on `Query.search` hits from its index, so a search result needs no second fetch; asked for a Product by key, only the product subgraph answers." }
      - { name: imageUrl, type: "String", subgraphs: [sg:product], cache_control: { max_age: 3600 }, note: "The first image: `sch:catalog-product#images` in the product subgraph; search provides it on `Query.search` hits." }
      - { name: price, type: "Money!", subgraphs: [sg:pricing], reads: ["sch:price#list_cents", "sch:price#promo_cents", "sch:price#currency"], via: api:pricing-get-price, cache: [{ at: st:price-redis, ttl: 300 }], cache_control: { max_age: 300 }, note: "For the market of the request's locale. Public: the edge key varies on `Accept-Language`." }
      - { name: stock, type: "Stock!", subgraphs: [sg:inventory], reads: ["sch:stock-snapshot#available", "sch:stock-snapshot#fcs"], cache_control: { max_age: 30 } }
      - { name: leadTimeDays, type: "Int", subgraphs: [sg:product], reads: ["sch:catalog-product#lead_time_days"], usage: { clients: ["web", "ios ≤ 4.2"], per_day: "1.2M", last_seen: "2026-09-30", source: "https://studio.apollographql.com/graph/alderfinch-storefront/fields/Product.leadTimeDays" }, note: "Static; the same number in every region. The plan deprecates it, then removes it." }
      - { name: reviews, type: "[Review!]!", subgraphs: [sg:reviews], reads: ["sch:review#rating", "sch:review#title", "sch:review#body", "sch:review#author"], cache_control: { max_age: 300 } }
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.graphql#L62-L110", note: "`type Product @key(fields: \"sku\") @key(fields: \"id\")` with `@join__field(graph:)` per field" }]
  - id: sch:gql-money
    name: Money
    kind: graph-type
    graph: graph:storefront
    summary: "A value type: amount in minor units and the currency. Pricing's; resolved inside the fetch that returns a price, so it has no key."
    fields:
      - { name: amount, type: "Int!", subgraphs: [sg:pricing] }
      - { name: currency, type: "String!", subgraphs: [sg:pricing] }
  - id: sch:gql-stock
    name: Stock
    kind: graph-type
    graph: graph:storefront
    fields:
      - { name: available, type: "Int!", subgraphs: [sg:inventory], reads: ["sch:stock-snapshot#available"] }
      - { name: fc, type: "String", subgraphs: [sg:inventory], reads: ["sch:stock-snapshot#fcs"], note: "The warehouse that would ship it first. Only the admin tooling selects it today." }
  - id: sch:gql-review
    name: Review
    kind: graph-type
    graph: graph:storefront
    fields:
      - { name: rating, type: "Int!", subgraphs: [sg:reviews], reads: ["sch:review#rating"] }
      - { name: title, type: "String", subgraphs: [sg:reviews], reads: ["sch:review#title"] }
      - { name: body, type: "String!", subgraphs: [sg:reviews], reads: ["sch:review#body"] }
      - { name: author, type: "String!", subgraphs: [sg:reviews], reads: ["sch:review#author"] }
  - id: sch:gql-customer
    name: Customer
    kind: graph-type
    graph: graph:storefront
    keys:
      - { fields: [id], in: [sg:customer, sg:cart] }
    summary: "The signed-in shopper. The cart belongs to it, which is why a cart is only ever reached through `me`."
    fields:
      - { name: id, type: "ID!", subgraphs: [sg:customer], reads: ["sch:customer#id"] }
      - { name: email, type: "String!", subgraphs: [sg:customer], reads: ["sch:customer#email"] }
      - { name: region, type: "String!", subgraphs: [sg:customer], reads: ["sch:customer#region"], note: "Saved address first, IP region second. The storefront passes it as the `region` variable." }
      - { name: savedAddress, type: "String", subgraphs: [sg:customer], reads: ["sch:customer#saved_address"] }
      - { name: cart, type: "Cart", subgraphs: [sg:cart], reads: ["sch:cart#id"] }
  - id: sch:gql-cart
    name: Cart
    kind: graph-type
    graph: graph:storefront
    summary: "Everything on a cart is reached through the signed-in customer."
    fields:
      - { name: id, type: "ID!", subgraphs: [sg:cart], reads: ["sch:cart#id"] }
      - { name: lines, type: "[CartLine!]!", subgraphs: [sg:cart], reads: ["sch:cart#lines"] }
      - { name: subtotalCents, type: "Int!", subgraphs: [sg:cart], reads: ["sch:cart#subtotal_cents"] }
      - { name: currency, type: "String!", subgraphs: [sg:cart], reads: ["sch:cart#currency"] }
      - { name: estimatedDelivery, type: "String", subgraphs: [sg:cart], reads: ["sch:cart#estimated_delivery_text"], usage: { clients: ["web"], per_day: "310k", last_seen: "2026-09-30", source: "https://studio.apollographql.com/graph/alderfinch-storefront/fields/Cart.estimatedDelivery" }, note: "*3–5 working days*. Computed by the cart subgraph from the lines' `leadTimeDays`. Static." }
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/cart-subgraph/schema.graphqls#L1-L50" }]
  - id: sch:gql-cart-line
    name: CartLine
    kind: graph-type
    graph: graph:storefront
    fields:
      - { name: id, type: "ID!", subgraphs: [sg:cart] }
      - { name: sku, type: "ID!", subgraphs: [sg:cart] }
      - { name: qty, type: "Int!", subgraphs: [sg:cart] }
      - { name: unitCents, type: "Int!", subgraphs: [sg:cart], note: "The price at add time, from the cart record; not re-resolved by Pricing." }
      - { name: product, type: "Product!", subgraphs: [sg:cart], note: "A bare reference `{ sku }`; the gateway fetches the rest from the subgraphs that own it." }

graphs:
  - id: graph:storefront
    name: Storefront graph
    gateway: svc:graph-gateway
    registry: "https://studio.apollographql.com/graph/alderfinch-storefront"
    summary: >-
      One schema for the shop, composed from seven subgraphs by Apollo Router. The storefront is its only client.
      Fastly sits in front for persisted GETs, and the gateway keeps an entity cache of its own. Every subgraph is a
      service owned by its team; a `Product` is four of them joined by `sku` and a fifth joined by `id`.
    sources:
      - { url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.yaml#L1-L30" }
      - { url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/supergraph.graphql#L1-L160", note: "the composed SDL, checked in by CI" }

subgraphs:
  - id: sg:product
    name: Product subgraph
    graph: graph:storefront
    service: svc:product-graph
    summary: "Catalogue entities: `Product` (owner of both keys), `id`, `name`, `leadTimeDays` and the `product` root."
    batching: dataloader
    cache_control_default: 3600
    timeout_ms: 800
    observed: { latency_ms: 28, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/pim/blob/9c1e4b7a2d3f5061728394a5b6c7d8e9f0a1b2c3/subgraph/src/schema.graphql#L1-L70" }]
  - id: sg:search
    name: Search subgraph
    graph: graph:storefront
    service: svc:search-graph
    summary: "Owns `Query.search`; provides `name` and `imageUrl` on the hits it returns. It holds only a reference to `Product` by `sku`."
    batching: none
    cache_control_default: 120
    timeout_ms: 600
    observed: { latency_ms: 45, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/search/blob/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d/subgraph/schema.graphqls#L1-L40" }]
  - id: sg:pricing
    name: Pricing subgraph
    graph: graph:storefront
    service: svc:pricing-graph
    summary: "Extends `Product` with `price`; owns `Money`."
    batching: none
    cache_control_default: 300
    timeout_ms: 500
    observed: { latency_ms: 70, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/pricing/blob/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c/subgraph/src/main/resources/schema.graphqls#L1-L40" }]
  - id: sg:inventory
    name: Inventory subgraph
    graph: graph:storefront
    service: svc:inventory-graph
    summary: "Extends `Product` with `stock`; owns `Stock`."
    batching: dataloader
    cache_control_default: 30
    timeout_ms: 300
    observed: { latency_ms: 35, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/fulfilment/blob/6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a/inventory-subgraph/app/schema.py#L1-L60" }]
  - id: sg:cart
    name: Cart subgraph
    graph: graph:storefront
    service: svc:cart-graph
    summary: "Owns `Cart`, `CartLine`, `Customer.cart` and `addToCart`. It holds only a reference to `Product` by `sku`: a line's `product` is a bare reference."
    batching: dataloader
    cache_control_default: 0
    timeout_ms: 500
    observed: { latency_ms: 22, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/checkout/blob/5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/cart-subgraph/schema.graphqls#L1-L50" }]
  - id: sg:customer
    name: Customer subgraph
    graph: graph:storefront
    service: svc:customer-graph
    summary: "Owns `Customer` and `me`. Everything it serves is private."
    batching: none
    cache_control_default: 0
    timeout_ms: 400
    observed: { latency_ms: 18, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/customers/blob/0f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6/subgraph/src/main/resources/schema/customer.graphqls#L1-L30" }]
  - id: sg:reviews
    name: Reviews subgraph
    graph: graph:storefront
    service: svc:reviews-graph
    summary: "Extends `Product` with `reviews`. Knows a product only by `id`, so it is asked after the product subgraph has returned one."
    batching: dataloader
    cache_control_default: 300
    timeout_ms: 600
    observed: { latency_ms: 40, source: "Grafana · gateway → subgraph p50, last 30 days" }
    sources: [{ url: "https://github.com/alder-finch/content/blob/3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b/reviews-subgraph/schema.graphql#L1-L40" }]

interfaces:
  - id: if:storefront-graph
    service: svc:graph-gateway
    protocol: graphql
    summary: "`POST /graphql` and persisted `GET /graphql?extensions=…`. The only API the storefront calls; what it asks is in `operations`."
    sources: [{ url: "https://github.com/alder-finch/storefront-graph/blob/a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e/router.yaml#L1-L20" }]
  - id: if:gateway-admin
    service: svc:graph-gateway
    protocol: rest
    summary: "The gateway's invalidation endpoint, called by the cache purger."
    endpoints:
      - { id: api:gateway-invalidate, sig: "POST /invalidate", summary: "Drop cached entities of a type with this key (sku).", auth: "service token", idempotent: true }
  - id: if:fastly-api
    service: svc:fastly
    protocol: rest
    endpoints:
      - { id: api:fastly-purge, sig: "POST /service/{id}/purge/{surrogate_key}", auth: "API token", idempotent: true }
  - id: if:pricing-rest
    service: svc:pricing
    protocol: rest
    endpoints:
      - { id: api:pricing-get-price, sig: "GET /prices/{sku}?market=", response: sch:price, auth: "service token", idempotent: true }
  - id: if:search-rest
    service: svc:search-api
    protocol: rest
    endpoints:
      - { id: api:search-query, sig: "GET /search?q=&locale=&first=", auth: "service token", idempotent: true, summary: "Returns skus, names and image urls; the subgraph turns them into Product references." }
  - id: if:promise-rest
    service: svc:promise
    protocol: rest
    summary: "Lookups for checkout and the PIM. The graph does not call it today."
    endpoints:
      - { id: api:promise-get, sig: "GET /promises/{sku}?region=", response: sch:delivery-promise, auth: "service token", idempotent: true }

operations:
  - id: gql:product-page
    name: ProductPage
    kind: query
    graph: graph:storefront
    screens: [scr:pdp#hero, scr:pdp#price, scr:pdp#stock]
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: load
    summary: "Sent once when the page is server-rendered; the hero, price and stock come from it. The edge keeps it longer than stock changes: the page shows only *In stock* or not, and the purger removes the cached page when stock moves."
    document: |
      query ProductPage($sku: ID!) {
        product(sku: $sku) {
          sku
          name
          imageUrl
          price { amount currency }
          stock { available }
          leadTimeDays
        }
      }
    cache:
      - { at: st:edge-cache, ttl: 600, key: { operation: id, variables: [sku], headers: [Accept-Language] }, reason: "Stock is shown as in or out only and `stock.changed` purges the page by sku, so ten minutes is acceptable, although the cache rules alone would give 30 s." }
    plan_check: { fetches: 3, round_trips: 2, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/ProductPage/plan" }
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/pdp/queries.ts#L10-L30" }]
  - id: gql:product-reviews
    name: ProductReviews
    kind: query
    graph: graph:storefront
    screens: [scr:pdp#reviews]
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: scroll
    summary: "Sent when the reviews scroll into view. The reviews subgraph only knows a product by `id`, so the product subgraph is asked first."
    document: |
      query ProductReviews($sku: ID!) {
        product(sku: $sku) {
          sku
          reviews { rating title body author }
        }
      }
    cache:
      - { at: st:edge-cache, ttl: 300, key: { operation: id, variables: [sku], headers: [Accept-Language] } }
    plan_check: { fetches: 2, round_trips: 2, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/ProductReviews/plan" }
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/pdp/reviews.ts#L1-L30" }]
  - id: gql:search-results
    name: SearchResults
    kind: query
    graph: graph:storefront
    screens: [scr:search-results#tiles]
    client: svc:storefront-web
    method: GET
    persisted: apq
    trigger: load
    summary: "Sent on page load, and again with a larger `first` when the shopper asks for more. One fetch: the search subgraph provides the name and image of every hit itself."
    document: |
      query SearchResults($q: String!, $first: Int) {
        search(q: $q, first: $first) {
          sku
          name
          imageUrl
        }
      }
    cache:
      - { at: st:edge-cache, ttl: 120, key: { operation: id, variables: [q, first], headers: [Accept-Language] } }
    plan_check: { fetches: 1, round_trips: 1, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/SearchResults/plan" }
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/search/queries.ts#L1-L40" }]
  - id: gql:add-to-cart
    name: AddToCart
    kind: mutation
    graph: graph:storefront
    screens: [scr:pdp#add-to-cart]
    client: svc:storefront-web
    method: POST
    persisted: safelist
    trigger: click
    summary: "Sent when the button is pressed. The response feeds the mini cart directly, with no second query."
    document: |
      mutation AddToCart($sku: ID!, $qty: Int!) {
        addToCart(sku: $sku, qty: $qty) {
          id
          lines { id sku qty unitCents }
          subtotalCents
          currency
          estimatedDelivery
        }
      }
    writes: [sch:cart]
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/cart/mutations.ts#L1-L30" }]
  - id: gql:cart-summary
    name: CartSummary
    kind: query
    graph: graph:storefront
    screens: [scr:mini-cart]
    client: svc:storefront-web
    method: POST
    persisted: safelist
    trigger: click
    summary: "Sent when the mini cart opens from the header. Private, because the cart is reached through `me`, so nothing above the gateway caches it."
    document: |
      query CartSummary {
        me {
          cart {
            id
            lines {
              id
              qty
              unitCents
              product { sku name imageUrl }
            }
            subtotalCents
            currency
            estimatedDelivery
          }
        }
      }
    cache:
      - { at: st:gateway-entity-cache, key: "subgraph · type · sku · scope" }
    plan_check: { fetches: 3, round_trips: 3, source: "https://studio.apollographql.com/graph/alderfinch-storefront/operations/CartSummary/plan" }
    sources: [{ url: "https://github.com/alder-finch/storefront/blob/4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/apps/web/src/cart/queries.ts#L1-L40" }]

messages:
  - id: msg:product-published
    name: product.published
    version: v2
    topic: st:catalog-events
    payload: sch:product-published-v2
    producer: svc:pim
    consumers: [svc:product-graph, svc:cache-purger]
    key: sku
    semantics: "At least once. The whole product every time."
  - id: msg:price-published
    name: price.published
    version: v1
    topic: st:price-events
    payload: sch:price-published-v1
    producer: svc:pricing
    consumers: [svc:pricing-graph, svc:cache-purger]
    key: "sku, region"
    semantics: "At least once."
  - id: msg:stock-changed
    name: stock.changed
    version: v1
    topic: st:fulfilment-events
    payload: sch:stock-changed-v1
    producer: svc:wms
    consumers: [svc:inventory-graph, svc:cache-purger, svc:promise]
    semantics: "At least once per SKU and FC."
  - id: msg:promise-changed
    name: promise.changed
    version: v1
    topic: st:fulfilment-events
    payload: sch:promise-changed-v1
    producer: svc:promise
    consumers: [svc:pim]
    key: sku
    semantics: "At least once, compacted. Published only when a date or confidence moved."

# ─────────────────────────────────────────────── chapter 3: How it runs today
flows:
  - id: flow:browse-product
    name: Look at a product
    actor: Shopper
    trigger: "The shopper opens a product page."
    outcome: "The shopper sees the product, its price for their market, stock, *ships in 3 days*, and the reviews as they scroll."
    steps:
      - id: flow:browse-product#open
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:product-page
        case: cold
        action: Ask for the product
        screen: scr:pdp
        logic: "The server-rendered page sends ProductPage as a persisted GET. On a cold path the edge misses and the gateway asks the product subgraph first, then pricing and inventory in parallel by `sku`."
        fails: "If the gateway is down, the edge serves the expired copy for 30 s. Without one, the page shows an error state, never a blank hero."
      - id: flow:browse-product#render
        from: svc:graph-gateway
        to: svc:storefront-web
        via: internal
        action: Render the page
        screen: scr:pdp#stock
        logic: "The stock region shows *In stock · ships in 3 days* from `stock.available` and `leadTimeDays`. The response carries `Surrogate-Key: <sku>`, so the next shopper in the market hits the edge."
      - id: flow:browse-product#reviews
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:product-reviews
        case: cold
        action: Ask for the reviews on scroll
        screen: scr:pdp#reviews
        logic: "A second persisted GET once the reviews scroll into view. The reviews subgraph only knows a product by `id`, so the gateway asks the product subgraph for it first."
        fails: "The reviews region stays a skeleton; nothing else on the page waits for it."
  - id: flow:search-results
    name: Search and scroll
    actor: Shopper
    trigger: "The shopper searches for *tent*."
    outcome: "Tiles with image and name; more appear when she asks."
    steps:
      - id: flow:search-results#open
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:search-results
        case: miss
        action: Ask for the first page
        screen: scr:search-results#tiles
        logic: "The search subgraph calls the search API and returns the hits with their names and images: one fetch, because it provides those fields itself."
      - id: flow:search-results#more
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:search-results
        case: miss
        action: Ask for more
        screen: scr:search-results#tiles
        logic: "The same operation with a larger `first`. Rarely an edge hit: every page size is its own key."
      - id: flow:search-results#render
        from: svc:graph-gateway
        to: svc:storefront-web
        via: internal
        action: Show the tiles
        screen: scr:search-results#tiles
  - id: flow:add-to-cart
    name: Add to cart
    actor: Shopper
    trigger: "The shopper presses **Add to cart**."
    outcome: "The mini cart opens with the line and *Delivery 3–5 working days*."
    steps:
      - id: flow:add-to-cart#press
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:add-to-cart
        action: Add the line
        screen: scr:pdp#add-to-cart
        logic: "A mutation: the edge passes it through, the gateway does not cache it. The cart subgraph re-reads the price from Pricing and writes the cart."
        fails: "The button shows *Try again*; the cart is unchanged."
      - id: flow:add-to-cart#show
        from: svc:graph-gateway
        to: svc:storefront-web
        via: internal
        action: Open the mini cart
        screen: scr:mini-cart#summary
        logic: "The mutation's response fills the mini cart; `estimatedDelivery` is the cart subgraph's static text."
  - id: flow:view-cart
    name: Open the mini cart
    actor: Shopper
    trigger: "The shopper presses the cart icon in the header."
    outcome: "The shopper sees their lines, the subtotal and *Delivery 3–5 working days*."
    steps:
      - id: flow:view-cart#open
        from: svc:storefront-web
        to: svc:graph-gateway
        via: gql:cart-summary
        case: hit
        action: Ask for the cart
        screen: scr:mini-cart
        logic: "Private, and a POST: the edge cannot cache it, so the gateway is the outermost layer. The customer and cart fetches always run; the product pieces for the lines come from the gateway's entity cache."
      - id: flow:view-cart#render
        from: svc:graph-gateway
        to: svc:storefront-web
        via: internal
        action: Show the lines
        screen: scr:mini-cart#lines
  - id: flow:price-change-purge
    name: A price change purges every cache
    actor: System
    trigger: "Pricing publishes a new price for a SKU and region."
    outcome: "The next shopper sees the new price within seconds, and every cache layer refills with it. In the rare race below, one refill can bring the old price back for up to five minutes."
    steps:
      - id: flow:price-change-purge#publish
        from: svc:pricing
        to: st:price-events
        via: msg:price-published
        action: Announce the price
        reads: [sch:price]
      - id: flow:price-change-purge#evict-redis
        from: st:price-events
        to: svc:pricing-graph
        via: msg:price-published
        action: Purge the price key
        purges: [st:price-redis]
        logic: "Deletes `price:{sku}:{market}` in [[st:price-redis]]. The next resolve calls Pricing and refills."
      - id: flow:price-change-purge#take-event
        from: st:price-events
        to: svc:cache-purger
        via: msg:price-published
        action: Take the event
        logic: "One purge per SKU, debounced for 2 s across regions. [[flow:price-change-purge#evict-redis]] and this step consume the same event in parallel. Redis is purged first and the edge second, only because of that debounce. If the edge purge landed first, the next miss would refill Fastly from the stale Redis entry (up to 5 min, the Redis time to live). The soft purge limits that: Fastly keeps the old object as stale-while-revalidate for 30 s, so it fetches the page again once Redis has been purged."
      - id: flow:price-change-purge#purge-edge
        from: svc:cache-purger
        to: svc:fastly
        via: api:fastly-purge
        action: Purge the surrogate key
        purges: [st:edge-cache]
        logic: "Every cached object tagged with the SKU goes: ProductPage for every market, every SearchResults page that listed it."
        fails: "Retried for a minute; after that the edge serves the old price until its time is up (10 minutes at most)."
      - id: flow:price-change-purge#purge-gateway
        from: svc:cache-purger
        to: svc:graph-gateway
        via: api:gateway-invalidate
        action: Purge the Product entity
        purges: [st:gateway-entity-cache]
        logic: "Drops every cached entity piece for the SKU in [[st:gateway-entity-cache]]."
  - id: flow:sync-stock
    name: Keep stock in sync
    actor: System
    trigger: "Stock moves in a warehouse."
    outcome: "The inventory subgraph's snapshot is rewritten and the edge copies of the page are purged."
    steps:
      - id: flow:sync-stock#publish
        from: svc:wms
        to: st:fulfilment-events
        via: msg:stock-changed
        action: Announce the change
      - id: flow:sync-stock#snapshot
        from: st:fulfilment-events
        to: svc:inventory-graph
        via: msg:stock-changed
        action: Rewrite the snapshot
        logic: "Sum over FCs, list the FCs with stock, overwrite the key. This is the only writer of [[st:stock-redis]]."
        writes: [sch:stock-snapshot]
      - id: flow:sync-stock#take-event
        from: st:fulfilment-events
        to: svc:cache-purger
        via: msg:stock-changed
        action: Take the event
        logic: "One purge per SKU, sent to Fastly and to the gateway below ([[flow:price-change-purge#purge-edge]] is the same call). Stock changes are the noisiest cause: 60 % of all purges."
      - id: flow:sync-stock#purge-edge
        from: svc:cache-purger
        to: svc:fastly
        via: api:fastly-purge
        action: Purge the surrogate key
        purges: [st:edge-cache]
        logic: "ProductPage for the SKU in every market goes, so the 600 s life is only a backstop."
      - id: flow:sync-stock#purge-gateway
        from: svc:cache-purger
        to: svc:graph-gateway
        via: api:gateway-invalidate
        action: Purge the Product entity
        purges: [st:gateway-entity-cache]
        logic: "Drops the SKU's cached `stock` pieces in [[st:gateway-entity-cache]]."
  - id: flow:project-product
    name: Update the read copy of a product
    actor: System
    trigger: "`product.published` for a SKU."
    outcome: "The product subgraph serves the new copy and the edge no longer holds the old page."
    steps:
      - id: flow:project-product#publish
        from: svc:pim
        to: st:catalog-events
        via: msg:product-published
        action: Announce the product
      - id: flow:project-product#project
        from: st:catalog-events
        to: svc:product-graph
        via: msg:product-published
        action: Update the read copy
        writes: [sch:catalog-product]
      - id: flow:project-product#take-event
        from: st:catalog-events
        to: svc:cache-purger
        via: msg:product-published
        action: Take the event
        logic: "One purge per SKU, sent to Fastly and to the gateway below."
      - id: flow:project-product#purge-edge
        from: svc:cache-purger
        to: svc:fastly
        via: api:fastly-purge
        action: Purge the surrogate key
        purges: [st:edge-cache]
      - id: flow:project-product#purge-gateway
        from: svc:cache-purger
        to: svc:graph-gateway
        via: api:gateway-invalidate
        action: Purge the Product entity
        purges: [st:gateway-entity-cache]
        logic: "Drops the cached `name` and `imageUrl` pieces for the SKU in [[st:gateway-entity-cache]]."

