# ─────────────────────────────────────────────── chapter 8: What we're committing to
decisions:
  - id: dec:promise-own-subgraph
    title: "The promise is its own subgraph, served by the Promise service"
    status: accepted
    decider: team:fulfilment
    decided_on: "2026-09-24"
    reversibility: one-way
    context: "The field could live in the inventory subgraph (same team) or the product subgraph could call the promise API."
    decision: "An eighth subgraph on the Promise service. The team that computes the promise owns the field and its cache."
    consequences: "One more subgraph to compose, one more fetch in any query plan that selects the field, and a `@requires` on `stock { fc }` that adds a round trip wherever the field is selected."
    options:
      - { name: "A field in the inventory subgraph", why_not: "Inventory would have to call Promise per request or copy its data; two services for one fact." }
      - { name: "The product subgraph calls the promise API", why_not: "Catalog would own a field it cannot explain, and the region would have to reach the product subgraph." }
  - id: dec:region-in-key
    title: "deliveryPromise is public: the region is a variable and part of the edge key"
    status: accepted
    decider: team:storefront
    decided_on: "2026-09-24"
    reversibility: two-way
    context: "*Per region* feels private, and the first sketch made the field private and read the region from the session. But nothing in the answer depends on who is signed in; it depends on a region the caller names."
    decision: "`deliveryPromise(region: Region!)` is public. ProductPromise takes `region` as a variable and the edge key includes it, so Fastly keeps six copies for 60 s. Private is a cache hint the customer subgraph sets on `me` (`Query.me` carries `auth`, from which the plan derives it); a region argument sets none."
    consequences: "ProductPromise is cacheable at the edge and at the gateway; its hit ratio is bounded by six regions × SKUs per minute. The page must know the shopper's region; the customer's saved address is passed in by the storefront."
  - id: dec:split-query
    title: "The product page asks twice: ProductPage (long edge life) and ProductPromise (60 s, per region)"
    status: accepted
    decider: team:storefront
    decided_on: "2026-09-29"
    reversibility: one-way
    context: "The August spike added the field to ProductPage and the edge hit ratio fell from 92 % to 58 % within an hour. It added a third round trip and put the region in every page key. The 600 s override could not stay, because its reason (stock is in or out only) no longer held once the page showed a per-region date. The alternatives were tried on paper ([[q:defer-or-split]])."
    decision: "ProductPage keeps its document, key and query plan. A second persisted query asks for the promise after first paint, public, with the region in its edge key and a 60-second life."
    consequences: "Two operations per page view; the delivery line paints a moment later than the hero. One-way because the page's data layer is built around the pair and the old single-query id is unregistered."
    options:
      - { name: "One operation with the promise and a 60 s edge life", why_not: "The 600 s override's reason no longer holds with a per-region date on the page, so the whole page would expire every minute and vary by region: the hit ratio would sit near 60 %, as the spike showed." }
      - { name: "`@defer` the promise in ProductPage", why_not: "`@defer` keeps the promise in ProductPage's document, so `region` is still in the page's edge key (six copies of every page) and the third round trip still runs on every edge miss. Fastly also cannot cache a multipart response." }
      - { name: "The page calls the promise REST API directly", why_not: "A second API in the storefront is what the graph exists to avoid; the page would need the region too." }
  - id: dec:purge-and-ttl
    title: "promise.changed purges the SKU at the edge; the 60 s life is the backstop"
    status: accepted
    decider: team:storefront
    decided_on: "2026-09-29"
    reversibility: two-way
    context: "A 10-second life would be fresh enough and need no purger work, but would send six times the traffic to the graph on every region's miss."
    decision: "A 60 s life plus a purge by surrogate key per SKU, through the existing purger, at Fastly and in the gateway."
    consequences: "The purger consumes one more topic; the promise subgraph's load is bounded by distinct sku+region pairs per minute."
  - id: dec:price-progressive-override
    title: "Price moves to pricing-v2 with a progressive @override: expand, migrate, remove"
    status: proposed
    decider: team:pricing
    decide_by: "2026-11-13"
    reversibility: two-way
    context: "The pricing subgraph cannot batch. Either it is rewritten in place, or a second subgraph takes the field over."
    decision: "pricing-v2 claims `price` with `@override(from: \"pricing\")` at 0 %, the label is raised to 10 % and then to 100 %, and the old ownership is removed last. Three changes in three milestones."
    consequences: "For a while two subgraphs can answer; composition picks one per request. Rollback is the percentage, not a deploy."
    options:
      - { name: "Rewrite the Kotlin subgraph in place", why_not: "No way to compare old and new on live traffic, and rollback is a deploy." }
  - id: dec:no-promise-on-tiles
    title: "Search-result tiles do not show the promise in v1"
    status: deferred
    decider: team:product
    decide_by: "2026-12-04"
    reversibility: two-way
    context: "A tile is an image and a name, answered in one fetch because the search subgraph provides both. The promise needs three more fetches per page of results, six regions over."
    decision: "Deferred until M3 numbers for the PDP are in. If wanted, it is a second public operation per page of tiles with the region in its key."
    consequences: "The tiles keep saying nothing about when."

risks:
  - id: risk:edge-hit-ratio
    statement: "Putting the region in ProductPromise's key splits it six ways; the edge hit ratio for the promise is lower than ProductPage's, and someone 'fixes' it by selecting deliveryPromise in ProductPage."
    likelihood: med
    impact: high
    roam: mitigated
    owner: team:storefront
    mitigation: "The validator's query-plan check names the third round trip when a document selects the field; a CI check on the persisted-query manifest refuses it in ProductPage; the edge hit ratio per operation is on the launch dashboard with an 85 % alert on ProductPage and 70 % on ProductPromise."
    about: [chg:split-product-page]
  - id: risk:non-null-promise
    statement: "Someone makes `deliveryPromise` required; when the promise subgraph is slow or down, the whole `product` comes back empty and ProductPromise returns nothing at all."
    likelihood: low
    impact: med
    roam: mitigated
    owner: team:fulfilment
    mitigation: "The field stays optional (nullable). The query plan shows how far a failure reaches: if Promise fails, only `deliveryPromise` comes back empty. [[tst:promise-subgraph-contract]] pins the optional type."
    about: [chg:promise-subgraph]
  - id: risk:cart-round-trips
    statement: "CartSummary goes from three round trips to four when the promise joins the lines, and the mini cart feels slow."
    likelihood: med
    impact: med
    roam: mitigated
    owner: team:storefront
    mitigation: "The gateway's entity cache answers the product, inventory and promise pieces per sku; [[tst:cart-summary-private]] pins the second request to no product fetch."
    about: [chg:cart-shows-promise]
  - id: risk:override-window
    statement: "While price is overridden, the two pricing subgraphs disagree on a price and nobody notices which one answered."
    likelihood: low
    impact: high
    roam: mitigated
    owner: team:pricing
    mitigation: "A shadow comparison runs per request while the label is above 0 and below 100; [[tst:price-override-10]] requires zero differences before the next rung."
    about: [chg:price-v2-migrate, chg:price-v2-expand]
  - id: risk:promise-subgraph-down
    statement: "The promise subgraph goes down while the product page is open."
    likelihood: low
    impact: low
    roam: accepted
    owner: team:storefront
    accepted_by: dec:split-query
    mitigation: "ProductPromise is its own operation: the hero, price and stock paint regardless; the delivery line says *Delivery date on request*."
    about: [chg:split-product-page]
  - id: risk:old-ios-lead-time
    statement: "iOS ≤ 4.2 still selects `leadTimeDays` and cannot be forced to update, so the field never reaches zero selections and removing it in M3 breaks those apps."
    likelihood: med
    impact: med
    roam: owned
    owner: team:storefront
    mitigation: "The registry's usage by client is on the launch dashboard. M3 removes the field only after [[q:ios-lead-time]] is answered: either the old versions are below a share we accept, or the field keeps answering them with a frozen value."
    about: [chg:deprecate-lead-time, chg:retire-lead-time]

questions:
  - id: q:defer-or-split
    question: "Split the page into two operations, or @defer the promise inside ProductPage?"
    decider: team:storefront
    status: resolved
    answered_by: dec:split-query
    answer: "Split. Fastly cannot cache a multipart response."
  - id: q:surrogate-purge-regions
    question: "Does one surrogate-key purge per SKU drop ProductPromise for all six regions, or do we need sku+region keys?"
    decider: team:storefront
    decide_by: "2026-11-20"
    status: open
    blocks: [chg:purge-on-promise]
    answer: "Fastly says yes (surrogate keys are per object, and all six copies carry the SKU). To be confirmed in staging with the purge log."
  - id: q:plan-check-evidence
    question: "Does the registry's query plan for ProductPromise and CartSummary match the derived 3 and 4 round trips, once `@requires` is composed?"
    decider: team:storefront
    decide_by: "2026-11-13"
    status: open
    blocks: [chg:cart-shows-promise]
    answer: "Unknown until the promise subgraph is published; the numbers in `plan_check` are the registry's today for ProductPage, and an estimate for the other two."
  - id: q:cart-search-key-stubs
    question: "Should the cart and search subgraphs declare the `sku` key as `resolvable: false`, since they hold only a reference to a product?"
    decider: team:storefront
    decide_by: "2026-11-13"
    status: open
    blocks: [chg:cart-shows-promise]
    answer: "Probably. `CartLine.product` and the hits on `Query.search` carry a bare `sku`, and neither subgraph can return a product from it, yet the key lists them as subgraphs the gateway can ask. In Federation 2 a key with `resolvable: false` is never fetched from, so the gateway would plan CartSummary through the product, pricing, inventory and promise subgraphs alone, as the 4 round trips in `plan_check` assume; with the key resolvable it may plan a fetch into the cart or search subgraph. The schema here lists the subgraphs but has no field for the flag, so the answer is read off the composed supergraph and the lists follow it."
  - id: q:ios-lead-time
    question: "What do iOS ≤ 4.2 apps see when `leadTimeDays` is removed, given they cannot be forced to update?"
    decider: team:storefront
    decide_by: "2026-11-27"
    status: open
    blocks: [chg:retire-lead-time]
    answer: "Unknown. The registry lists iOS ≤ 4.2 among the clients that select it, but not their share of the 1.2M requests a day, and the target of zero selections cannot be met while they are installed. The choice is to accept breaking old versions below an agreed share, or to keep answering them with a frozen value."
  - id: q:promise-requires-fc
    question: "Can the promise subgraph get the warehouse without the `@requires` round trip?"
    decider: team:fulfilment
    decide_by: "2026-11-04"
    status: open
    blocks: [chg:promise-subgraph]
    answer: "Unknown. `@requires(fields: \"stock { fc }\")` makes the gateway fetch the warehouse from inventory first. `fc` is the same in every region and the promise is stored per sku and region ([[sch:delivery-promise]] holds no warehouse), so the inventory fetch asks for something the region argument does not change. It is paid on every miss of ProductPromise and CartSummary, which is why ProductPage must not select the field. If the Promise service can read the warehouse for a sku itself, the `@requires` and one round trip leave every plan that selects the field; if it cannot, the round trip stays and the 60 s edge life is what pays for it."
  - id: q:promise-ttl
    question: "Is 60 s the right edge life for ProductPromise, given the purge does the real work?"
    decider: team:fulfilment
    status: open
    answer: "Fulfilment proposes 60 s; a longer life only matters if the purger is down."

commitment:
  - { team: team:fulfilment, confidence: 4, note: "The subgraph is a thin layer over data we have. `@requires` on the warehouse is the one new federation feature we use." }
  - { team: team:storefront, confidence: 3, note: "The gateway, the purger, two operations and the page. The edge hit ratio is ours to keep." }
  - { team: team:catalog, confidence: 5, note: "One deprecation and one removal." }
  - { team: team:checkout, confidence: 4, note: "A contract test and a resolver to delete." }
  - { team: team:pricing, confidence: 3, note: "A new subgraph and a three-step migration; the shadow comparison is what makes it safe." }
  - { team: team:customers, confidence: 5, note: "The region is passed in by the page; we change nothing." }
  - { team: team:discovery, confidence: 5, note: "Nothing changes for the search subgraph; `@provides` keeps SearchResults at one fetch." }
  - { team: team:content, confidence: 5, note: "Nothing changes; reviews stay keyed by `id`." }
  - { team: team:product, confidence: 4, note: "The tiles are deferred; the page is what the June test wanted." }

story:
  chapters:
    why:
      headline: "The promise is wanted on the page; the edge cache is wanted more."
      recap:
        - "The August spike put the promise in ProductPage and cut the edge hit ratio from 92 % to 58 % in an hour."
        - "A field, a subgraph and a split: the page asks twice, and the promise lives at the edge for a minute per region."
    today:
      headline: "The graph is seven subgraphs behind three cache layers, and a Product is five teams' data joined by SKU and id."
      recap:
        - "ProductPage is five fields from three subgraphs, kept at the edge for 600 s, though the stock it shows is only good for 30 s."
        - "Every field has one owner. The grid of types by subgraph shows who, which no single repository does."
    runs:
      headline: "A cold product page is one root fetch and two entity fetches; a price change is a surrogate-key purge at the edge and a purge in the gateway."
      recap:
        - "Search is one fetch, because the search subgraph provides the name and image itself."
        - "The cart is private because it is reached through `me`; the gateway's entity cache keeps its products."
    new:
      headline: "A promise subgraph adds a public field with the region in its key, and the price moves to a new subgraph."
      recap:
        - "ProductPromise is cached at the edge per region for 60 s and purged by promise.changed."
        - "price moves to pricing-v2 with an override: expand, migrate, remove."
    changes:
      headline: "The page asks twice, the promise joins the graph and the price changes subgraph: eleven changes in the systems of five teams."
      recap:
        - "ProductPage's document shrinks by one field and its query plan does not change."
        - "The edge and the gateway now purge on promise.changed; price takes three steps to its new home."
    prove:
      headline: "A contract test per subgraph, a composition check, and one staging run with Fastly in front."
      recap:
        - "ProductPromise is cached per region and never private; ProductPage is still cached."
        - "promise.changed purges every region's copy within 5 s."
    build:
      headline: "Compose first, switch Sweden on second, remove the old number third."
      recap:
        - "M1 composes the subgraph and the purge, and publishes pricing-v2 at 0 % without showing anything."
        - "M2 is Sweden with the edge hit ratio read for two weeks; M3 removes leadTimeDays and finishes the price move."
    commit:
      headline: "The price override waits for Pricing's yes; four other decisions are accepted."
      recap:
        - "The split is one-way: the single-query id is unregistered."
        - "Storefront and Pricing are at 3; everyone else at 4 or 5."
