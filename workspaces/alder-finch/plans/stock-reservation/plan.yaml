    issue_type: task
    github_issue: 122

decisions:
  - id: dec:reserve-in-integration-layer
    title: "Reservations live in our WMS integration layer, not in Manhattan"
    status: accepted
    decider: team:fulfilment
    decided_on: "2026-06-26"
    reversibility: one-way
    context: "Manhattan's own soft-allocation needs a sales order, which does not exist until capture. A Manhattan change is a vendor project."
    decision: "A reservation table in our layer; availability we expose subtracts it. Manhattan sees only the final allocation."
    consequences: "Two views of stock: Manhattan's and ours. Any other reader of Manhattan directly (the store-stock dashboard) will over-count availability."
    options:
      - { name: "Use Manhattan soft allocation with a provisional sales order", why_not: "Creates and cancels thousands of sales orders a day; vendor said no." }
      - { name: "Reserve in Checkout's Redis", why_not: "Checkout would hold stock it does not own, and allocation could not see it." }
  - id: dec:reserve-at-payment
    title: "Reserve on entering the payment step, not at add-to-cart"
    status: accepted
    decider: team:checkout
    decided_on: "2026-06-26"
    reversibility: two-way
    context: "72% of carts are abandoned; holding stock for all of them would lock a third of inventory on drop days."
    decision: "Reserve on entering the payment step, the last point where the shopper can be told without a refund."
    consequences: "A sold-out message late in the funnel. Accepted over phantom stock-outs."
  - id: dec:fifteen-minutes
    title: "Reservations last fifteen minutes"
    status: accepted
    decider: team:checkout
    decided_on: "2026-07-14"
    reversibility: two-way
    context: "Median time from payment step to order is 2 min 40 s; p95 is 11 min (3DS challenges, financing quotes)."
    decision: "Fifteen minutes, as a config value. [[tst:expiry-rate]] reviews it."
    consequences: "A shopper slower than that may find the line sold out when they press pay; they are re-reserved and told if it fails."
    options:
      - { name: "Five minutes", why_not: "Cuts off the p95." }
      - { name: "Thirty minutes", why_not: "Doubles locked stock on drop days for no measured gain." }
  - id: dec:fail-open
    title: "A WMS outage lets checkout proceed unreserved"
    status: accepted
    decider: team:checkout
    decided_on: "2026-07-03"
    reversibility: two-way
    context: "The WMS layer has 99.5% availability; closing checkout for it would cost more than the oversells it prevents."
    decision: "Timeout 400 ms; on failure the session has no reservations, allocation handles the order, and a metric fires."
    consequences: "During an outage the old oversell risk returns, and until M2 the report catches it."

risks:
  - id: risk:locked-stock
    statement: "On a drop day abandoned holds lock the stock and the product shows sold out while units sit unsold."
    likelihood: med
    impact: med
    roam: mitigated
    owner: team:checkout
    mitigation: "15-minute expiry, a sweep every minute, and release on abandon. The expiry rate is a launch metric ([[tst:expiry-rate]])."
    about: [chg:checkout-reserves, chg:reservation-sweep]
  - id: risk:stock-dashboard
    statement: "The store-stock dashboard reads Manhattan directly and over-counts availability by the reserved amount."
    likelihood: high
    impact: low
    roam: accepted
    owner: team:fulfilment
    accepted_by: dec:reserve-in-integration-layer
    mitigation: "Dashboard switches to our API in a follow-up; until then it says *before reservations*."
    about: [chg:wms-reservations]
  - id: risk:outbox-lag
    statement: "Confirm-at-capture lags behind and a reservation expires before it is confirmed."
    likelihood: low
    impact: high
    roam: mitigated
    owner: team:orders
    mitigation: "Confirm accepts a reservation that expired less than 5 minutes ago if stock is still available; otherwise the order falls back to allocation. Outbox lag is alarmed at 30 s."
    about: [chg:capture-confirms]

questions:
  - id: q:store-dashboard
    question: "Who moves the store-stock dashboard onto our stock API, and when?"
    decider: team:fulfilment
    status: resolved
    answer: "Fulfilment, in its next quarter. Until then the dashboard says *before reservations*, as [[risk:stock-dashboard]] accepts."
  - id: q:financing-timeout
    question: "Does a Fjordbank instalment quote (up to 90 s) push shoppers past fifteen minutes often enough to matter?"
    decider: team:checkout
    status: resolved
    answer: "No. In the first two weeks 0.6% of sessions ran past fifteen minutes, nearly all of them Fjordbank quotes, and the shopper is re-reserved when they press pay. Fifteen minutes stays ([[dec:fifteen-minutes]])."

commitment:
  - { team: team:fulfilment, confidence: 4, note: "The table and locking are known work; the load test is the risk." }
  - { team: team:checkout, confidence: 4, note: "Fail-open and sold-out handling are the fiddly bits." }
  - { team: team:orders, confidence: 4, note: "An outbox we already have, one more consumer." }
  - { team: team:customer-care, confidence: 5, note: "We watch a report go empty, then stop getting it." }

story:
  chapters:
    why: { headline: "We sell the last tent twice and find out at three in the morning.", recap: ["1.8% of orders are cancelled for no stock, 11% on drop days.", "Hold stock at payment; confirm it at capture."] }
    today: { headline: "Nothing holds stock until a warehouse allocates the order.", recap: ["Checkout, Orders and the WMS wrapper; Manhattan underneath, untouched.", "The 03:00 report is the safety net."] }
    runs: { headline: "Stock is taken minutes after the shopper has paid, and a 03:00 CSV catches the misses.", recap: ["First come, first served happens after the money moved."] }
    new: { headline: "A reservation holds stock for fifteen minutes, in one warehouse, for one session.", recap: ["Three endpoints on the WMS wrapper; a sweep every minute.", "Capture confirms; allocation becomes a fallback."] }
    changes: { headline: "Four changes reserve stock; two take out the oversell report, in two steps.", recap: ["Deprecate at M1, remove at M2.", "order.placed gains a `reserved` flag; no new version needed."] }
    prove: { headline: "A race test, a WMS-outage test and three empty weeks of the report show it works.", recap: ["The expiry rate decides whether fifteen minutes stays."] }
    build: { headline: "Fulfilment first; Checkout and Orders in parallel; delete the report last.", recap: ["M1 reserves everywhere; M2 removes the report."] }
    commit: { headline: "Fifteen minutes holds: four decisions are accepted.", recap: ["The store dashboard stays on Manhattan until Fulfilment moves it next quarter."] }
