    title: "WMS integration: reservation table, reserve/release/confirm endpoints, availability subtracts reserved"
    team: team:fulfilment
    size: L
    milestone: ms:reserving
    implements: [chg:wms-reservations]
    verified_by: [tst:reserve-last-unit, tst:reserve-idempotent]
    depends_on: []
    repo: alder-finch/fulfilment
    issue_type: feature
    github_issue: 118
    body: "Row-level locking on (sku, fc) for the reserve path; load test at 50 reservations/s before M1."
  - id: wi:sweep
    title: "Reservation sweep job"
    team: team:fulfilment
    size: S
    milestone: ms:reserving
    implements: [chg:reservation-sweep]
    verified_by: [tst:sweep-expires]
    depends_on: [wi:wms-reservations]
    repo: alder-finch/fulfilment
    issue_type: feature
    github_issue: 119
  - id: wi:checkout-reserve
    title: "Checkout: reserve on payment step, release on abandon, sold-out handling, fail-open, flag"
    team: team:checkout
    size: M
    milestone: ms:reserving
    implements: [chg:checkout-reserves]
    verified_by: [tst:checkout-sold-out, tst:checkout-fail-open, tst:abandon-releases]
    depends_on: [wi:wms-reservations]
    repo: alder-finch/checkout
    issue_type: feature
    github_issue: 64
  - id: wi:orders-confirm
    title: "Orders: reservation_id per line, confirm via outbox, reserved flag on order.placed"
    team: team:orders
    size: M
    milestone: ms:reserving
    implements: [chg:capture-confirms]
    verified_by: [tst:capture-confirms]
    depends_on: [wi:wms-reservations]
