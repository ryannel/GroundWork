# A mid-sized, backend-only worked example, approved and delivered: four teams (three with work), no screens. Same
# fictional retailer as plans/delivery-promise (Alder & Finch). Shows deprecate → remove across milestones, a
# sweep job, an external system (the WMS) that we wrap rather than change, and what a finished plan looks like:
# every work item filed in GitHub and closed (plans/stock-reservation/status.json).

meta:
  id: stock-reservation
  title: "Reserve stock at checkout so we stop selling what we don't have"
  version: "1.0"
  date: "2026-07-07"
  start: "2026-07-20"
  status: approved
  authors: ["Fulfilment", "Checkout", "Orders"]
  appetite: "6 weeks · 2 milestones"
  repos: [alder-finch/checkout, alder-finch/orders, alder-finch/fulfilment]
  revisions:
    - version: "1.0"
      status: approved
      date: "2026-07-17"
      approved_on: "2026-07-17"
      approved_by: "@tomas-reyes"

problem:
  summary: >-
    Stock is only taken when a warehouse allocates the order, minutes to hours after the shopper paid. Two
    shoppers can buy the last tent; one of them is cancelled the next morning. This plan reserves stock for
    fifteen minutes when the shopper reaches payment, and turns the reservation into an allocation at capture.
  why: >-
    **1.8% of orders are cancelled for no stock** (2,100 last quarter), each a refund, an apology email and a
    one-star review waiting to happen. The nightly *oversell report* exists only to find them. On drop days
    (the Fjäll 3 launch) it was 11%.
  goals:
    - "An order that is captured has stock held for it in a named warehouse."
    - "A shopper is told *sold out* at payment, not the morning after."
    - "The oversell report has nothing to report and is deleted."
  non_goals:
    - "Reserving at add-to-cart. Fifteen minutes from the payment step is enough ([[dec:reserve-at-payment]])."
    - "Backorders and pre-orders."
    - "Changing the WMS itself; we change our integration layer only."
  metrics:
    - { name: "Orders cancelled for no stock", today: "1.8%", target: "under 0.1%" }
    - { name: "Reservations that expire unused", today: "n/a", target: "under 20% (watch: stock locked for nothing)" }
  scenarios:
    - id: sc:last-tent
      title: "Two shoppers, one tent"
      story: >-
        Jonas and Petra both have the last Fjäll 3 in their carts. Jonas reaches payment first; the tent is
        reserved for him for fifteen minutes. Petra reaches payment thirty seconds later and sees *Sold out,
        removed from your cart*. Jonas pays; the reservation becomes his allocation. If Jonas walks away, Petra's
        next try at 14:16 succeeds.
      flows: [flow:reserve, flow:expire-reservation]
  glossary:
    - { term: "Reservation", means: "A hold on a quantity of a SKU in one warehouse for one checkout session, with an expiry." }
    - { term: "Allocation", means: "The warehouse assignment of an order line, after capture. A reservation becomes one." }
    - { term: "Oversell report", means: "The 03:00 job that lists orders allocation could not fulfil. Today's safety net." }
    - { term: "WMS", means: "Warehouse management system (Manhattan). We wrap it in an integration layer and never change it." }
    - { term: "Sweep", means: "A job that runs every minute and releases reservations past their expiry." }

domain:
  summary: "A **checkout session** gets a **reservation** per line in one **warehouse**; capture turns it into the line's **allocation**."
  concepts:
    - id: con:reservation
      name: Reservation
      terms: [reservation, hold, stock hold]
      means: "A quantity of one SKU held in one warehouse for one checkout session until an expiry."
      born_in: svc:wms
      relates:
        - { to: con:stock-level, as: "reduces the available part of" }
      aka:
        - { in: svc:wms, as: Reservation, at: sch:reservation }
        - { in: svc:checkout, as: reservation_ids, at: "sch:checkout-session#reservation_ids" }
      introduced_by: [chg:wms-reservations]
    - id: con:stock-level
      name: Stock level
      terms: [stock, stock level, availability, on hand]
      means: "What a warehouse has of a SKU: on hand, and available after reservations."
      born_in: svc:wms
      aka: [{ in: svc:wms, as: StockLevel, at: sch:stock-level }]
  stages:
    - { id: stage:buy, name: Buy, summary: "The shopper pays.", services: [{ svc: svc:checkout }], flows: [flow:reserve] }
    - { id: stage:capture, name: Capture, summary: "The order exists.", services: [{ svc: svc:order-capture, from: [svc:checkout] }], flows: [flow:reserve] }
    - { id: stage:fulfil, name: Fulfil, summary: "Stock is held, then allocated.", services: [{ svc: svc:wms, from: [svc:checkout, svc:order-capture] }, { svc: svc:allocation, from: [svc:order-capture] }, { svc: svc:reservation-sweep }, { svc: svc:oversell-report }], flows: [flow:allocate, flow:oversell-report] }

changes:
  - id: chg:wms-reservations
    title: "The WMS integration layer holds reservations with an expiry"
    why: "Only the stock owner can hold stock. Manhattan has no reservation concept we can use from outside, so the integration layer keeps its own table and subtracts it from availability ([[dec:reserve-in-integration-layer]])."
    decisions: [dec:reserve-in-integration-layer, dec:reserve-at-payment]
    rollout: "Table and endpoints first; nothing calls them until Checkout's flag is on."
    ops:
      - add: schema
        value:
          id: sch:reservation
          name: Reservation
          kind: record
          store: st:wms-db
          summary: "A hold on stock for one checkout session."
          fields:
            - { name: id, type: uuid, required: true, key: true }
            - { name: session_id, type: uuid, required: true, ref: "sch:checkout-session#id", note: "Idempotency key with sku." }
            - { name: sku, type: string, required: true }
            - { name: fc, type: string, required: true }
            - { name: qty, type: int, required: true }
            - { name: expires_at, type: timestamptz, required: true, note: "15 minutes from creation ([[dec:fifteen-minutes]])." }
            - { name: status, type: "enum(held, confirmed, released, expired)", required: true, default: held }
      - add: field
        into: sch:stock-level
        value: { name: reserved, type: int, required: true, note: "Sum of `held` reservations. Available = on_hand − allocated − reserved." }
      - add: endpoint
        into: if:wms-rest
        value: { id: api:wms-reserve, sig: "POST /reservations", request: sch:reservation, response: sch:reservation, auth: "service token", idempotent: true, summary: "Holds qty of sku in the nearest FC with availability; 409 `sold_out` when none has it.", errors: [{ status: 409, code: sold_out, when: "No FC has qty available." }] }
      - add: endpoint
        into: if:wms-rest
        value: { id: api:wms-release, sig: "DELETE /reservations/{id}", auth: "service token", idempotent: true }
      - add: endpoint
        into: if:wms-rest
        value: { id: api:wms-confirm-reservation, sig: "POST /reservations/{id}/confirm", request: sch:order-line, response: sch:shipment, auth: "service token", idempotent: true, summary: "Turns a held reservation into an allocation and a shipment line." }
      - modify: svc:wms
        set:
          summary: "Our layer over Manhattan. Exposes stock, shipments and now reservations; availability subtracts held reservations. Manhattan itself is not changed."
  - id: chg:checkout-reserves
    title: "Checkout reserves stock on entering the payment step and releases it on abandon"
    why: "Payment is the last step a shopper can be told *sold out* without a refund ([[sc:last-tent]])."
    decisions: [dec:reserve-at-payment, dec:fifteen-minutes]
    rollout: "Behind the `stock_reservation` flag: Sweden first for a week, then everywhere. With the flag off, checkout behaves as today."
    ops:
      - add: field
        into: sch:checkout-session
        value: { name: reservation_ids, type: "uuid[]", note: "One per line, set on entering payment." }
      - modify: "flow:reserve#payment-step"
        set:
          logic: "Reserves each line before showing the payment form. A `sold_out` line is removed from the cart and the shopper is told."
      - add: step
        into: flow:reserve
        after: "flow:reserve#payment-step"
        value:
          id: flow:reserve#hold
          from: svc:checkout
          to: svc:wms
          via: api:wms-reserve
          action: Hold each line for 15 minutes
          logic: "Idempotent on session + sku, so a refresh does not double-hold."
          writes: [sch:reservation, "sch:stock-level#reserved"]
          fails: "`sold_out`: the line is dropped from the session and the shopper sees *Sold out, removed from your cart*. A WMS outage: checkout proceeds unreserved and logs it ([[dec:fail-open]])."
      - add: step
        into: flow:reserve
        after: "flow:reserve#hold"
        value:
          id: flow:reserve#keep-ids
          from: svc:checkout
          to: svc:checkout
          via: internal
          action: Remember the reservations on the session
          writes: ["sch:checkout-session#reservation_ids"]
      - modify: "flow:reserve#create"
        set:
          logic: "Passes the reservation ids with the lines. Orders confirms them."
      - add: flow
        value:
          id: flow:abandon
          name: Abandon the checkout
          actor: Shopper
          trigger: "The shopper leaves the payment step, or the session is deleted."
          outcome: "The held stock is free again."
          steps:
            - id: flow:abandon#release
              from: svc:checkout
              to: svc:wms
              via: api:wms-release
              action: Release each reservation
              logic: "Best effort; the sweep catches what this misses."
              writes: ["sch:reservation#status", "sch:stock-level#reserved"]
  - id: chg:capture-confirms
    title: "Order capture confirms the reservations and allocation only handles what was never held"
    why: "The reservation already chose the warehouse. Confirming it at capture is the allocation; the worker only remains for unreserved orders (flag off, or WMS outage)."
    rollout: "Orders deploys before Checkout's flag is on; `reservation_ids` is optional in the request."
    ops:
      - add: field
        into: sch:order-line
        value: { name: reservation_id, type: uuid, note: "Empty for orders placed unreserved." }
      - add: field
        into: sch:order-placed-v1
        value: { name: reserved, type: bool, required: true, note: "True when every line has a reservation. Allocation skips these." }
      - add: step
        into: flow:reserve
        after: "flow:reserve#create"
        value:
          id: flow:reserve#confirm
          from: svc:order-capture
          to: svc:wms
          via: api:wms-confirm-reservation
          action: Confirm each reservation into a shipment line
          logic: "In the same transaction as the order, through an outbox, so a brief WMS failure retries instead of losing the hold."
          writes: ["sch:reservation#status", sch:shipment, "sch:stock-level#allocated", "sch:stock-level#reserved"]
          fails: "Retried from the outbox for 10 minutes; after that the order is placed unreserved and allocation handles it."
      - modify: "flow:allocate#consume"
        set:
          logic: "Skips orders with `reserved: true`; they already have their shipments."
      - modify: "flow:allocate#choose"
        set:
          logic: "Only for unreserved orders. Nearest FC with `on_hand - allocated - reserved >= qty`."
  - id: chg:reservation-sweep
    title: "A sweep releases expired reservations every minute"
    why: "Abandon is best effort; closed laptops do not call release."
    rollout: "With M1."
    ops:
      - add: service
        value:
          id: svc:reservation-sweep
          name: Reservation sweep
          team: team:fulfilment
          system: sys:fulfilment
          kind: job
          tech: "Python · cron every minute"
          does: "Releases reservations past their expiry"
      - modify: st:wms-db
        append: { access: [{ svc: svc:reservation-sweep, mode: readwrite }] }
      - add: flow
        value:
          id: flow:expire-reservation
          name: Expire a reservation
          actor: System
          trigger: "Every minute."
          outcome: "Stock held for nobody is available again."
          steps:
            - id: flow:expire-reservation#sweep
              from: svc:reservation-sweep
              to: svc:reservation-sweep
              via: internal
              action: Mark held reservations past expiry as expired
              logic: "`UPDATE … WHERE status = 'held' AND expires_at < now()`, batched by 500; recomputes `reserved` per SKU and FC."
              reads: [sch:reservation]
              writes: ["sch:reservation#status", "sch:stock-level#reserved"]
  - id: chg:retire-oversell-report
    title: "Deprecate the oversell report once nothing is oversold"
    why: "A safety net with nothing left to catch is a job that sends Customer care a CSV for no reason."
    rollout: "Deprecated at M1 (still runs, Customer care watches it stay empty for three weeks). Removed at M2."
    ops:
      - deprecate: svc:oversell-report
      - deprecate: flow:oversell-report
      - deprecate: sch:oversell-row
      - deprecate: "sch:order#cancel_reason"
        replaced_by: "sch:order#status"
  - id: chg:remove-oversell-report
    title: "Delete the oversell report job and its store access"
    why: "Three empty weeks after M1 show that nothing is left for the report to catch."
    rollout: "M2. The cron entry, the job and the Customer care runbook page go together."
    ops:
      - remove: svc:oversell-report
      - remove: flow:oversell-report
      - remove: sch:oversell-row
      - modify: st:wms-db
        drop: { access: [{ svc: svc:oversell-report, mode: read }] }

tests:
  - id: tst:reserve-last-unit
    level: unit
    name: "Two reservations for the last unit: one holds, one is sold out"
    given: "on_hand 1, allocated 0, reserved 0 in Berlin; none elsewhere"
    when: "Two `POST /reservations` for qty 1 arrive 30 ms apart"
    then: "The first is `held`; the second is 409 `sold_out`; `reserved` is 1"
    proves: [chg:wms-reservations]
    walks: ["flow:reserve#hold"]
    owner: team:fulfilment
    env: ci
  - id: tst:reserve-idempotent
    level: contract
    name: "A refresh of the payment step does not double-hold"
    given: "A session that already holds sku X"
    when: "The same session reserves sku X again"
    then: "The same reservation id is returned and `reserved` is unchanged"
    proves: [chg:wms-reservations, chg:checkout-reserves]
    walks: ["flow:reserve#hold", "flow:reserve#keep-ids"]
    owner: team:fulfilment
    env: ci
  - id: tst:checkout-sold-out
    level: integration
    name: "A sold-out line is removed and the shopper is told"
    given: "A cart with a tent that is sold out and socks that are not"
    when: "The shopper enters the payment step"
    then: "The tent is removed from the session, the socks are held, and the step shows *Sold out, removed from your cart*"
    proves: [chg:checkout-reserves]
    walks: ["flow:reserve#payment-step", "flow:reserve#hold"]
    owner: team:checkout
    env: ci
  - id: tst:checkout-fail-open
    level: integration
    name: "A WMS outage does not block checkout"
    given: "`POST /reservations` times out"
    when: "The shopper enters the payment step"
    then: "The step renders; the session has no reservation ids; a metric `reservation.skipped` is emitted"
    proves: [chg:checkout-reserves]
    walks: ["flow:reserve#hold"]
    owner: team:checkout
    env: ci
  - id: tst:abandon-releases
    level: contract
    name: "Leaving the payment step releases the hold"
    given: "A session with two held reservations"
    when: "The shopper goes back to the cart"
    then: "Both reservations are `released` and `reserved` drops by their qty"
    proves: [chg:checkout-reserves, chg:wms-reservations]
    walks: ["flow:abandon#release"]
    owner: team:checkout
    env: ci
  - id: tst:capture-confirms
    level: contract
    name: "Capture turns the reservation into a shipment line"
    given: "A session with a held reservation in Berlin"
    when: "The order is created"
    then: "The reservation is `confirmed`, a shipment exists in Berlin, `allocated` +1, `reserved` −1, and `order.placed` has `reserved: true`"
    proves: [chg:capture-confirms, chg:wms-reservations]
    walks: ["flow:reserve#create", "flow:reserve#confirm", "flow:reserve#publish"]
    owner: team:orders
    env: ci
  - id: tst:allocation-skips-reserved
    level: contract
    name: "Allocation ignores reserved orders and still handles unreserved ones"
    given: "One `order.placed` with `reserved: true` and one with `reserved: false`"
    when: "The worker consumes both"
    then: "The first creates nothing; the second is allocated as today, counting `reserved` against availability"
    proves: [chg:capture-confirms]
    walks: ["flow:allocate#consume", "flow:allocate#choose", "flow:allocate#shipment"]
    owner: team:fulfilment
    env: ci
  - id: tst:sweep-expires
    level: integration
    name: "The sweep frees a 16-minute-old hold and leaves a 14-minute-old one"
    given: "Two held reservations, expiring 1 minute ago and in 1 minute"
    when: "The sweep runs"
    then: "The first is `expired` and its qty is back in availability; the second is untouched"
    proves: [chg:reservation-sweep]
    walks: ["flow:expire-reservation#sweep"]
    owner: team:fulfilment
    env: ci
  - id: tst:two-shoppers-e2e
    level: e2e
    name: "Petra is told sold out and Jonas gets the last tent"
    given: "Staging with one Fjäll 3 in Berlin"
    when: "Jonas reaches payment, Petra reaches payment, Jonas pays"
    then: "Petra sees sold out; Jonas's order is allocated to Berlin at capture; the 03:00 report is empty"
    proves: [chg:wms-reservations, chg:checkout-reserves, chg:capture-confirms, chg:retire-oversell-report]
    walks: ["flow:reserve#payment-step", "flow:reserve#hold", "flow:reserve#create", "flow:reserve#confirm", "flow:oversell-report#scan"]
    owner: team:fulfilment
    env: staging
  - id: tst:report-empty-three-weeks
    level: e2e
    name: "The oversell report is empty for 21 days before deletion"
    given: "Production with the flag on everywhere"
    when: "21 daily runs"
    then: "Zero rows every day"
    proves: [chg:retire-oversell-report, chg:remove-oversell-report]
    walks: ["flow:oversell-report#scan", "flow:oversell-report#email"]
    owner: team:customer-care
    env: prod
  - id: tst:expiry-rate
    level: e2e
    name: "Fewer than 20% of reservations expire unused"
    given: "One week of production in SE"
    when: "Reservations are counted by final status"
    then: "`expired` + `released` under 20% of all; otherwise [[dec:fifteen-minutes]] is revisited"
    proves: [chg:reservation-sweep, chg:checkout-reserves]
    walks: ["flow:expire-reservation#sweep", "flow:abandon#release"]
    owner: team:checkout
    env: prod

milestones:
  - id: ms:reserving
    name: "M1 · Reserving everywhere"
    exit: "Flag on in all countries; [[tst:two-shoppers-e2e]] passed; the oversell report runs but is being watched."
    due: "2026-08-07"
  - id: ms:report-gone
    name: "M2 · The report is gone"
    exit: "[[tst:report-empty-three-weeks]] passed; job, cron and runbook deleted."
    due: "2026-08-28"

execution:
  summary: "Hold at payment, confirm at capture, sweep what is abandoned. The allocation worker shrinks to a fallback."
  paths:
    - name: The shopper pays
      summary: "The common case."
      steps:
        - { label: Hold, detail: "Each line held for 15 minutes in the nearest FC ([[flow:reserve#hold]])." }
        - { label: Pay, detail: "Card or financing, as today." }
        - { label: Confirm, detail: "Capture turns holds into shipment lines ([[flow:reserve#confirm]])." }
    - name: The shopper leaves
      summary: "Back button or closed laptop."
      steps:
        - { label: Release, detail: "Best effort on navigation ([[flow:abandon#release]])." }
        - { label: Sweep, detail: "Within a minute of expiry otherwise ([[flow:expire-reservation#sweep]])." }
    - name: Sold out at payment
      summary: "Someone else holds the last one."
      steps:
        - { label: Tell, detail: "The line is removed; the rest of the cart continues ([[tst:checkout-sold-out]])." }
        - { label: Retry, detail: "If the other hold expires, the next attempt succeeds." }
    - name: The WMS is down
      summary: "Checkout carries on without a reservation."
      steps:
        - { label: Skip, detail: "Checkout proceeds unreserved and says so in metrics ([[dec:fail-open]])." }
        - { label: Allocate, detail: "The worker handles it as today; the report may catch an oversell until M2." }
  caveats:
    - "Fifteen minutes is one config value ([[dec:fifteen-minutes]]); [[tst:expiry-rate]] reviews it if drop-day holds pile up."
    - "Drop days may show stock as sold out while abandoned holds wait to expire ([[risk:locked-stock]])."

work_items:
