id: flow:sync-stock
origin: seeded
name: Keep stock in sync
actor: System
trigger: Stock moves in a warehouse.
outcome: The inventory subgraph's snapshot is rewritten and the edge copies of the page are purged.
steps:
  - id: flow:sync-stock#publish
    from: svc:wms
    to: st:fulfilment-events
    via: msg:stock-changed
    action: Announce the change
  - id: flow:sync-stock#snapshot
    from: st:fulfilment-events
    to: svc:inventory-graph
    via: msg:stock-changed
    action: Rewrite the snapshot
    logic: Sum over FCs, list the FCs with stock, overwrite the key. This is the only writer of [[st:stock-redis]].
    writes:
      - sch:stock-snapshot
  - id: flow:sync-stock#take-event
    from: st:fulfilment-events
    to: svc:cache-purger
    via: msg:stock-changed
    action: Take the event
    logic:
      'One purge per SKU, sent to Fastly and to the gateway below ([[flow:price-change-purge#purge-edge]] is
      the same call). Stock changes are the noisiest cause: 60 % of all purges.'
  - id: flow:sync-stock#purge-edge
    from: svc:cache-purger
    to: svc:fastly
    via: api:fastly-purge
    action: Purge the surrogate key
    purges:
      - st:edge-cache
    logic: ProductPage for the SKU in every market goes, so the 600 s life is only a backstop.
  - id: flow:sync-stock#purge-gateway
    from: svc:cache-purger
    to: svc:graph-gateway
    via: api:gateway-invalidate
    action: Purge the Product entity
    purges:
      - st:gateway-entity-cache
    logic: Drops the SKU's cached `stock` pieces in [[st:gateway-entity-cache]].
