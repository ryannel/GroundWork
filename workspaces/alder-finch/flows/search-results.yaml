id: flow:search-results
origin: seeded
name: Search and scroll
actor: Shopper
trigger: The shopper searches for *tent*.
outcome: Tiles with image and name; more appear when she asks.
steps:
  - id: flow:search-results#open
    from: svc:storefront-web
    to: svc:graph-gateway
    via: gql:search-results
    case: miss
    action: Ask for the first page
    screen: scr:search-results#tiles
    logic:
      'The search subgraph calls the search API and returns the hits with their names and images: one fetch,
      because it provides those fields itself.'
  - id: flow:search-results#more
    from: svc:storefront-web
    to: svc:graph-gateway
    via: gql:search-results
    case: miss
    action: Ask for more
    screen: scr:search-results#tiles
    logic: 'The same operation with a larger `first`. Rarely an edge hit: every page size is its own key.'
  - id: flow:search-results#render
    from: svc:graph-gateway
    to: svc:storefront-web
    via: internal
    action: Show the tiles
    screen: scr:search-results#tiles
