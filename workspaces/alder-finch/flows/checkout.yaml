id: flow:checkout
origin: seeded
name: Check out and pay
actor: Shopper
trigger: The shopper presses **Checkout**.
outcome: An order exists, is paid or financed, and the shopper has a confirmation email.
steps:
  - id: flow:checkout#address
    from: svc:storefront-web
    to: svc:storefront-bff
    via: api:bff-checkout-step
    action: Give the address
    screen: scr:checkout-delivery#address
  - id: flow:checkout#session
    from: svc:storefront-bff
    to: svc:checkout
    via: api:checkout-step
    action: Store the address
    logic: Country comes from the address. `shipping_cents` is set to the constant here.
    writes:
      - sch:checkout-session
  - id: flow:checkout#delivery
    from: svc:checkout
    to: svc:storefront-web
    via: internal
    action: Show delivery
    screen: scr:checkout-delivery#delivery-option
    logic:
      'One option: *Standard · 3–5 working days · 4.95*. `shipping_cents` is the constant 495, whatever the
      country or cart.'
  - id: flow:checkout#quote
    from: svc:checkout
    to: svc:financing-gateway
    via: api:financing-quote
    action: Ask for financing quotes
    logic: For carts above 100 in DE/NL/SE. The amount quoted is the **subtotal**, not the total.
    writes:
      - sch:financing-quote
    fails: The payment step shows card only.
  - id: flow:checkout#partner-quote
    from: svc:financing-gateway
    to: svc:paylater-partner
    via: api:nordbank-quote
    action: Get the pay-later offer
    logic:
      Nordbank returns the instalment plan for the amount. Fjordbank ([[api:fjordbank-quote]]) is asked above
      500.
  - id: flow:checkout#pay
    from: svc:storefront-web
    to: svc:storefront-bff
    via: api:bff-place-order
    action: Choose how to pay and place the order
    screen: scr:checkout-payment#pay
  - id: flow:checkout#place
    from: svc:storefront-bff
    to: svc:checkout
    via: api:checkout-place
    action: Place the order
    logic:
      'Card: authorise the total with Payments. Financing: confirm the quote for the subtotal, and authorise
      the **shipping on the card** separately.'
  - id: flow:checkout#authorise
    from: svc:checkout
    to: svc:payments
    via: api:payments-authorise
    action: Authorise the card
    writes:
      - sch:payment
    fails: Checkout shows *Payment declined* and stays on the payment step.
  - id: flow:checkout#psp
    from: svc:payments
    to: svc:psp
    via: api:psp-authorise
    action: Authorise with Nordpay
  - id: flow:checkout#confirm-loan
    from: svc:checkout
    to: svc:financing-gateway
    via: api:financing-confirm
    action: Confirm the loan
    logic: Only when the shopper chose financing.
    writes:
      - sch:financing-quote
  - id: flow:checkout#create
    from: svc:checkout
    to: svc:order-capture
    via: api:orders-create
    action: Create the order
    logic: Copies the session into an order and its lines in one transaction.
    writes:
      - sch:order
      - sch:order-line
    fails: Checkout voids the authorisation and shows *Something went wrong*.
  - id: flow:checkout#publish
    from: svc:order-capture
    to: st:order-events
    via: msg:order-placed
    action: Announce the order
    reads:
      - sch:order
      - sch:order-line
  - id: flow:checkout#capture
    from: svc:checkout
    to: svc:payments
    via: api:payments-capture
    action: Capture the payment
    logic: Captured at order creation, not at dispatch.
    writes:
      - sch:payment
  - id: flow:checkout#confirmation
    from: st:order-events
    to: svc:notifier
    via: msg:order-placed
    action: Send the confirmation email
    screen: scr:email-order-confirmation
    logic: The email says *Delivery 3–5 working days*, from the template, not the product.
