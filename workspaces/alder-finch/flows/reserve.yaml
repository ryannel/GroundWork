id: flow:reserve
origin: seeded
name: Pay and place the order
actor: Shopper
trigger: The shopper reaches the payment step.
outcome: An order exists. Each line was held in one warehouse while the shopper paid.
steps:
  - id: flow:reserve#payment-step
    from: svc:checkout
    to: svc:checkout
    via: internal
    action: Enter the payment step
    logic:
      Reserves each line before showing the payment form. A `sold_out` line is removed from the cart and the
      shopper is told.
    writes:
      - sch:checkout-session#step
  - id: flow:reserve#hold
    from: svc:checkout
    to: svc:wms
    via: api:wms-reserve
    action: Hold each line for 15 minutes
    logic: Idempotent on session + sku, so a refresh does not double-hold.
    writes:
      - sch:reservation
      - sch:stock-level#reserved
    fails:
      '`sold_out`: the line is dropped from the session and the shopper sees *Sold out, removed from your
      cart*. A WMS outage: checkout proceeds unreserved and logs it.'
  - id: flow:reserve#keep-ids
    from: svc:checkout
    to: svc:checkout
    via: internal
    action: Remember the reservations on the session
    writes:
      - sch:checkout-session#reservation_ids
  - id: flow:reserve#create
    from: svc:checkout
    to: svc:order-capture
    via: api:orders-create
    action: Create the order after payment
    writes:
      - sch:order
      - sch:order-line
    logic: Passes the reservation ids with the lines. Orders confirms them.
  - id: flow:reserve#confirm
    from: svc:order-capture
    to: svc:wms
    via: api:wms-confirm-reservation
    action: Confirm each reservation into a shipment line
    logic:
      In the same transaction as the order, through an outbox, so a brief WMS failure retries instead of
      losing the hold.
    writes:
      - sch:reservation#status
      - sch:shipment
      - sch:stock-level#allocated
      - sch:stock-level#reserved
    fails:
      Retried from the outbox for 10 minutes; after that the order is placed unreserved and allocation
      handles it.
  - id: flow:reserve#publish
    from: svc:order-capture
    to: st:order-events
    via: msg:order-placed
    action: Announce the order
    reads:
      - sch:order
