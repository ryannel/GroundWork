id: flow:expire-reservation
origin: seeded
name: Expire a reservation
actor: System
trigger: Every minute.
outcome: Stock held for nobody is available again.
steps:
  - id: flow:expire-reservation#sweep
    from: svc:reservation-sweep
    to: svc:reservation-sweep
    via: internal
    action: Mark held reservations past expiry as expired
    logic:
      "`UPDATE … WHERE status = 'held' AND expires_at < now()`, batched by 500; recomputes `reserved` per SKU
      and FC."
    reads:
      - sch:reservation
    writes:
      - sch:reservation#status
      - sch:stock-level#reserved
