id: flow:allocate
origin: seeded
name: Allocate the order
actor: System
trigger: '`order.placed` arrives.'
outcome: Each line has a warehouse, or is left unallocated.
steps:
  - id: flow:allocate#consume
    from: st:order-events
    to: svc:allocation
    via: msg:order-placed
    action: Take the order
    reads:
      - sch:order-placed-v1
    logic: 'Skips orders with `reserved: true`; they already have their shipments.'
  - id: flow:allocate#choose
    from: svc:allocation
    to: svc:wms
    via: api:wms-stock
    action: Find a warehouse with stock
    logic: Only for unreserved orders. Nearest FC with `on_hand - allocated - reserved >= qty`.
    reads:
      - sch:stock-level
    fails: 'No FC has it: the line is left unallocated.'
  - id: flow:allocate#shipment
    from: svc:allocation
    to: svc:wms
    via: api:wms-create-shipment
    action: Create the shipment and take the stock
    writes:
      - sch:shipment
      - sch:stock-level#allocated
