id: flow:browse-product
origin: seeded
name: Look at a product
actor: Shopper
trigger: The shopper opens a product page.
outcome:
  The shopper sees the product, its price for their market, stock, *ships in 3 days*, and the reviews
  as they scroll.
steps:
  - id: flow:browse-product#open
    from: svc:storefront-web
    to: svc:graph-gateway
    via: gql:product-page
    case: cold
    action: Ask for the product
    screen: scr:pdp
    logic:
      The server-rendered page sends ProductPage as a persisted GET. On a cold path the edge misses and the
      gateway asks the product subgraph first, then pricing and inventory in parallel by `sku`.
    fails:
      If the gateway is down, the edge serves the expired copy for 30 s. Without one, the page shows an error
      state, never a blank hero.
  - id: flow:browse-product#render
    from: svc:graph-gateway
    to: svc:storefront-web
    via: internal
    action: Render the page
    screen: scr:pdp#stock
    logic:
      'The stock region shows *In stock · ships in 3 days* from `stock.available` and `leadTimeDays`. The
      response carries `Surrogate-Key: <sku>`, so the next shopper in the market hits the edge.'
  - id: flow:browse-product#reviews
    from: svc:storefront-web
    to: svc:graph-gateway
    via: gql:product-reviews
    case: cold
    action: Ask for the reviews on scroll
    screen: scr:pdp#reviews
    logic:
      A second persisted GET once the reviews scroll into view. The reviews subgraph only knows a product by
      `id`, so the gateway asks the product subgraph for it first.
    fails: The reviews region stays a skeleton; nothing else on the page waits for it.
