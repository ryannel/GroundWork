# Fast staged-file checks run on commit. The complete suite runs before push and in CI.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '**/*.{ts,tsx,mts,mjs,css}'
      run: node tools/lint-changed.ts {staged_files}
    styles:
      glob: 'src/**/*.css'
      run: npx stylelint --cache --cache-location node_modules/.cache/stylelint/ {staged_files}
    format:
      run: npx prettier --check --cache --cache-location node_modules/.cache/prettier.json --ignore-unknown {staged_files}
    workspaces:
      glob: 'workspaces/**/*.{yaml,yml,json}'
      run: for folder in workspaces/*/; do if [ -f "${folder}workspace.yaml" ]; then npm run --silent workspace -- check "$folder" || exit 1; fi; done

pre-push:
  commands:
    check:
      run: npm run check
